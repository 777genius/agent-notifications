{
  "name": "TEST C5 installed Pi macos process compatibility",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "TEST-c5-pi-macos-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "macos": {
      "name": "Actual installed Pi / macOS process compatibility",
      "runs-on": "${{ vars.CI_MACOS_15_RUNNER || 'macos-15' }}",
      "timeout-minutes": 30,
      "env": {
        "GOWORK": "off",
        "GOTOOLCHAIN": "local",
        "CGO_ENABLED": "1",
        "MACOSX_DEPLOYMENT_TARGET": "12.0",
        "SOURCE_SHA": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Keep the actual asynchronous Pi child attached to native stdin",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/TEST-pi-macos/evidence\"\npython -B scripts/test_pi_macos_terminal_fixture.py -v 2>&1 | tee \"$RUNNER_TEMP/TEST-pi-macos/evidence/terminal-pty.txt\"\n"
        },
        {
          "name": "Compile the native product observers first",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/TEST-pi-macos/evidence\"\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\npython - <<'PY'\nimport hashlib, json, os, platform\nfrom pathlib import Path\nsource = Path('tests/integration/pi_installed_desktop_darwin.swift')\nroot = Path(os.environ['RUNNER_TEMP']) / 'TEST-pi-macos/evidence'\n(root / 'observer-host.json').write_text(json.dumps({\n    'source_sha': os.environ['SOURCE_SHA'], 'host_os': platform.system(),\n    'host_architecture': platform.machine(), 'host_version': platform.mac_ver()[0],\n    'observer_source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),\n    'desktop_qualified': False,\n}, indent=2) + '\\n')\nPY\nswiftc -parse-as-library tests/integration/pi_installed_desktop_darwin.swift \\\n  -framework AppKit -framework ApplicationServices -framework AVFoundation \\\n  -framework CoreAudio -framework CoreMedia -framework ScreenCaptureKit \\\n  -o \"$RUNNER_TEMP/TEST-pi-macos/observer\"\n\"$RUNNER_TEMP/TEST-pi-macos/observer\" test-process-identity > \"$RUNNER_TEMP/TEST-pi-macos/evidence/process-identity.json\"\n"
        },
        {
          "uses": "actions/setup-go@v7",
          "with": {
            "go-version": "1.26.10"
          }
        },
        {
          "name": "Acquire the exact compatible signed helper and official Pi",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nroot=\"$RUNNER_TEMP/TEST-pi-macos\"\npython -B scripts/test_pi_macos_helper.py -v\npython -B scripts/pi-macos-helper.py --output \"$root/helper\" --report \"$root/evidence/helper-input.json\" \\\n  > \"$root/evidence/helper-verification.txt\" 2>&1\narch=\"$(go env GOARCH)\"\npi_archive=\"$(python -c 'import json,sys; print(json.load(open(\"scripts/testdata/pi-native/pins.json\"))[\"targets\"][\"darwin/\" + sys.argv[1]][\"archive\"])' \"$arch\")\"\ngh release download v1.4.0 --repo earendil-works/pi --pattern \"$pi_archive\" --dir \"$root/pi-archive\"\npython -B scripts/acquire-pi-native.py --archive \"$root/pi-archive/$pi_archive\" --platform darwin --arch \"$arch\" \\\n  --output \"$root/pi\" --report \"$root/evidence/acquisition.json\"\n"
        },
        {
          "name": "Build the clean pinned candidate through the shared release recipes",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\nroot=\"$RUNNER_TEMP/TEST-pi-macos\"\narch=\"$(go env GOARCH)\"\nset +e\npython -B scripts/pi-candidate-build.py --platform darwin --arch \"$arch\" \\\n  --output \"$root/candidate\" --native-assets \"$root/helper/native\"\nresult=$?\nset -e\ncp \"$root/candidate/build.json\" \"$root/evidence/build.json\"\nexit \"$result\"\n"
        },
        {
          "name": "Exercise the actual installed process modes and owned lifecycle",
          "shell": "bash",
          "run": "set -euo pipefail\nroot=\"$RUNNER_TEMP/TEST-pi-macos\"\narch=\"$(go env GOARCH)\"\npython -B scripts/pi-installed-process-e2e.py \\\n  --candidate \"$root/candidate/stage/claude-notifications-darwin-$arch\" \\\n  --runtime-stage \"$root/candidate/stage\" --package \"$root/candidate/package-A.zip\" \\\n  --replacement-runtime-stage \"$root/candidate/replacement-stage\" \\\n  --updated-package \"$root/candidate/package-B.zip\" --assets-root \"$GITHUB_WORKSPACE\" \\\n  --pi-executable \"$root/pi/pi/pi\" --report \"$root/evidence/process.json\"\n"
        },
        {
          "name": "Preserve exact lane evidence even when an observation is unavailable",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "TEST-c5-pi-macos-process-7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "path": "${{ runner.temp }}/TEST-pi-macos/evidence/*",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == '777genius/agent-notifications' && github.actor == '777genius' && github.triggering_actor == '777genius' && github.ref == 'refs/heads/test/pi-v150-c5-installed' }}"
    }
  }
}
