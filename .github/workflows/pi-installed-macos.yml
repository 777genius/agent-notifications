name: Pi macOS installed process and native product

on:
  pull_request:
    paths:
      - '.github/workflows/pi-installed-macos.yml'
      - 'scripts/pi-installed-desktop-macos.py'
      - 'scripts/test_pi_macos_terminal_fixture.py'
      - 'scripts/pi-candidate-build.py'
      - 'scripts/pi-macos-helper.py'
      - 'scripts/test_pi_macos_helper.py'
      - 'scripts/pi-macos-host.py'
      - 'scripts/test_pi_macos_host.py'
      - 'scripts/testdata/pi-native/macos-helper.json'
      - 'scripts/testdata/pi-native/macos-helper/**'
      - 'tests/integration/pi_installed_desktop_darwin.swift'
      - 'tests/integration/pi_*fixture.py'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable source commit; empty uses the dispatched ref
        type: string
        required: false
      macos_runner:
        description: Existing macOS runner for the complete product qualification; empty uses the configured route
        type: string
        required: false
      prepare_notification_center:
        description: Prepare only the existing Notification Center agent on a verified disposable official macOS 15 ARM host
        type: boolean
        required: false
        default: false
      prepare_notification_presentation:
        description: Allow notifications while mirroring or sharing through the public Settings UI on the admitted fresh TEST host
        type: boolean
        required: false
        default: false
      observer_only:
        description: Compile and observe native permissions before building the product
        type: boolean
        required: false
        default: false
      hosted_observer:
        description: Use official macos-15 only for observer-only diagnostics
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ''
      macos_runner:
        type: string
        required: false
        default: ''
      observer_only:
        type: boolean
        required: false
        default: false
      hosted_observer:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pi-installed-macos-${{ github.event_name }}-${{ inputs.observer_only && 'observer' || github.event_name == 'workflow_dispatch' && 'native' || 'process' }}-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}-${{ inputs.macos_runner || inputs.observer_only && inputs.hosted_observer && 'macos-15' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: ${{ inputs.observer_only && 'macOS native observer prerequisites' || github.event_name == 'workflow_dispatch' && 'Actual installed Pi / macOS native product' || 'Actual installed Pi / macOS process compatibility' }}
    runs-on: ${{ inputs.macos_runner || inputs.observer_only && inputs.hosted_observer && 'macos-15' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Keep the actual asynchronous Pi child attached to native stdin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/TEST-pi-macos/evidence"
          python -B scripts/test_pi_macos_terminal_fixture.py -v 2>&1 | tee "$RUNNER_TEMP/TEST-pi-macos/evidence/terminal-pty.txt"
      - name: Compile the native product observers first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/TEST-pi-macos/evidence"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          source = Path('tests/integration/pi_installed_desktop_darwin.swift')
          root = Path(os.environ['RUNNER_TEMP']) / 'TEST-pi-macos/evidence'
          (root / 'observer-host.json').write_text(json.dumps({
              'source_sha': os.environ['SOURCE_SHA'], 'host_os': platform.system(),
              'host_architecture': platform.machine(), 'host_version': platform.mac_ver()[0],
              'observer_source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'desktop_qualified': False,
          }, indent=2) + '\n')
          PY
          swiftc -parse-as-library tests/integration/pi_installed_desktop_darwin.swift \
            -framework AppKit -framework ApplicationServices -framework AVFoundation \
            -framework CoreAudio -framework CoreMedia -framework ScreenCaptureKit \
            -o "$RUNNER_TEMP/TEST-pi-macos/observer"
          "$RUNNER_TEMP/TEST-pi-macos/observer" test-process-identity > "$RUNNER_TEMP/TEST-pi-macos/evidence/process-identity.json"
      - name: Require native desktop observer prerequisites only for explicit native work
        if: ${{ inputs.observer_only || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          "$RUNNER_TEMP/TEST-pi-macos/observer" preflight > "$RUNNER_TEMP/TEST-pi-macos/evidence/observer-preflight.json"
          python -B scripts/pi-native-preflight.py --execute-test-fixtures --platform darwin \
            --source-sha "$SOURCE_SHA" --report "$RUNNER_TEMP/TEST-pi-macos/evidence/known-cue-preflight.json"
      - name: Prepare the existing official Notification Center agent only when explicitly selected
        if: ${{ inputs.prepare_notification_center }}
        shell: bash
        env:
          PI_MACOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          python -B scripts/test_pi_macos_host.py -v
          python -B scripts/pi-macos-host.py --prepare-notification-center --source-sha "$SOURCE_SHA" \
            --observer "$RUNNER_TEMP/TEST-pi-macos/observer" \
            --report "$RUNNER_TEMP/TEST-pi-macos/evidence/host-preparation.json"
      - name: Require the separate public presentation policy opt-in to use the admitted fresh host route
        if: ${{ inputs.prepare_notification_presentation }}
        shell: bash
        env:
          DISPATCH: ${{ github.event_name }}
          SERVICE_PREPARED: ${{ inputs.prepare_notification_center }}
          OBSERVER_ONLY: ${{ inputs.observer_only }}
          HOSTED_OBSERVER: ${{ inputs.hosted_observer }}
        run: |
          test "$DISPATCH" = workflow_dispatch
          test "$SERVICE_PREPARED" = true
          test "$OBSERVER_ONLY" != true || test "$HOSTED_OBSERVER" = true
      - uses: actions/setup-go@v7
        if: ${{ !inputs.observer_only }}
        with:
          go-version: '1.26.10'
      - name: Inspect public global Notifications settings with the real capture active
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.observer_only && inputs.hosted_observer && inputs.prepare_notification_center && !inputs.prepare_notification_presentation }}
        shell: bash
        run: |
          set -euo pipefail
          python -B - "$RUNNER_TEMP/TEST-pi-macos/observer" "$RUNNER_TEMP/TEST-pi-macos/evidence" <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pi_macos_settings_observer', 'scripts/pi-installed-desktop-macos.py')
          fixture = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixture)
          result = fixture.inspect_global_notification_settings(Path(sys.argv[1]), Path(sys.argv[2]))
          raise SystemExit(0 if result['status'] == 'inspected' and result['owned_capture_collected'] else 1)
          PY
      - name: Prepare only the explicitly selected public sharing presentation policy and dismiss the owned Settings window
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_notification_presentation }}
        shell: bash
        env:
          PI_MACOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PI_MACOS_NOTIFICATION_PRESENTATION_PREPARE: '1'
        run: |
          set -euo pipefail
          python -B - "$RUNNER_TEMP/TEST-pi-macos/observer" "$RUNNER_TEMP/TEST-pi-macos/evidence" <<'PY'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pi_macos_presentation_prepare', 'scripts/pi-installed-desktop-macos.py')
          fixture = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixture)
          result = fixture.inspect_global_notification_settings(Path(sys.argv[1]), Path(sys.argv[2]), prepare_presentation=True)
          raise SystemExit(0 if result['status'] == 'prepared' and result['owned_capture_collected'] else 1)
          PY
      - name: Acquire the exact compatible signed helper and official Pi
        if: ${{ !inputs.observer_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/TEST-pi-macos"
          python -B scripts/test_pi_macos_helper.py -v
          python -B scripts/pi-macos-helper.py --output "$root/helper" --report "$root/evidence/helper-input.json" \
            > "$root/evidence/helper-verification.txt" 2>&1
          arch="$(go env GOARCH)"
          pi_archive="$(python -c 'import json,sys; print(json.load(open("scripts/testdata/pi-native/pins.json"))["targets"]["darwin/" + sys.argv[1]]["archive"])' "$arch")"
          gh release download v1.4.0 --repo earendil-works/pi --pattern "$pi_archive" --dir "$root/pi-archive"
          python -B scripts/acquire-pi-native.py --archive "$root/pi-archive/$pi_archive" --platform darwin --arch "$arch" \
            --output "$root/pi" --report "$root/evidence/acquisition.json"
      - name: Build the clean pinned candidate through the shared release recipes
        if: ${{ !inputs.observer_only }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          root="$RUNNER_TEMP/TEST-pi-macos"
          arch="$(go env GOARCH)"
          set +e
          python -B scripts/pi-candidate-build.py --platform darwin --arch "$arch" \
            --output "$root/candidate" --native-assets "$root/helper/native"
          result=$?
          set -e
          cp "$root/candidate/build.json" "$root/evidence/build.json"
          exit "$result"
      - name: Exercise the actual installed process modes and owned lifecycle
        if: ${{ !inputs.observer_only }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/TEST-pi-macos"
          arch="$(go env GOARCH)"
          python -B scripts/pi-installed-process-e2e.py \
            --candidate "$root/candidate/stage/claude-notifications-darwin-$arch" \
            --runtime-stage "$root/candidate/stage" --package "$root/candidate/package-A.zip" \
            --replacement-runtime-stage "$root/candidate/replacement-stage" \
            --updated-package "$root/candidate/package-B.zip" --assets-root "$GITHUB_WORKSPACE" \
            --pi-executable "$root/pi/pi/pi" --report "$root/evidence/process.json"
      - name: Observe installed product completion question audio and physical click
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.observer_only }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/TEST-pi-macos"
          arch="$(go env GOARCH)"
          python -B scripts/pi-installed-desktop-macos.py \
            --candidate "$root/candidate/stage/claude-notifications-darwin-$arch" --runtime-stage "$root/candidate/stage" \
            --package "$root/candidate/package-A.zip" --assets-root "$GITHUB_WORKSPACE" \
            --pi-executable "$root/pi/pi/pi" --observer "$root/observer" \
            --pi-acquisition "$root/evidence/acquisition.json" \
            --helper-archive "$root/helper/ClaudeNotifier-smoke.app.zip" \
            --helper-input "$root/evidence/helper-input.json" \
            --report "$root/evidence/evidence.json"
      - name: Preserve exact lane evidence even when an observation is unavailable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.observer_only && 'pi-macos-observer' || github.event_name == 'workflow_dispatch' && 'pi-installed-macos' || 'pi-installed-macos-process' }}-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/TEST-pi-macos/evidence/*
          if-no-files-found: error
          retention-days: 14
