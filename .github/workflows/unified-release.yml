name: Unified v1.48.4 draft qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact independently reviewed release source SHA (five versions must be 1.48.4)
        type: string
        required: true
      release_tag:
        description: Stable candidate tag; this bounded operator accepts v1.48.4 only
        type: string
        required: true
        default: v1.48.4
      signing_run:
        description: Completed owner macos-qualification run for this exact source SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: unified-v1484-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_SIGNING_RUN: ${{ inputs.signing_run }}

jobs:
  verify-version:
    name: Verify owner and exact unified candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require owner manual dispatch before candidate execution
        env: {GH_TOKEN: '${{ github.token }}', OWNER: '${{ github.repository_owner }}', TRIGGER: '${{ github.triggering_actor }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$OWNER"
          test "$TRIGGER" = "$OWNER"
          test "$GITHUB_REPOSITORY" = 777genius/agent-notifications
          [[ "$RELEASE_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_SIGNING_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$RELEASE_TAG" = v1.48.4
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_SIGNING_RUN" > "$RUNNER_TEMP/signing-run.json"
          jq -e --arg source "$RELEASE_CANDIDATE_SHA" --arg owner "$OWNER" '
            .head_sha==$source and .conclusion=="success" and .event=="workflow_dispatch" and
            .head_branch=="release/macos-signing" and .path==".github/workflows/macos-qualification.yml" and
            .actor.login==$owner and .triggering_actor.login==$owner' "$RUNNER_TEMP/signing-run.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_CANDIDATE_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          jq -e '.total_count==(.check_runs|length) and
            (.check_runs | group_by(.name) | map(max_by(.id))) as $latest |
            ([$latest[]|select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")]|length)==0 and
            (["Test on Ubuntu (1.25)","Test on Ubuntu (1.26)","Test on Windows (1.25)","Test on Windows (1.26)","Test on macOS (1.25)","Test on macOS (1.26)","Swift notifier tests","Full macOS CI required","Lint","OpenCode plugin bundle"] |
             all(. as $name | any($latest[]; .name==$name and .status=="completed" and .conclusion=="success")))' "$RUNNER_TEMP/checks.json"
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.candidate_sha }}', persist-credentials: false}
      - name: Verify all five version values and changelog
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"
          test "$(sed -n 's/^var ConsumerVersion = "\([^" ]*\)"$/\1/p' internal/config/runtime.go)" = 1.48.4
          test "$(jq -er '.version' .claude-plugin/plugin.json)" = 1.48.4
          test "$(jq -er '.version' .codex-plugin/plugin.json)" = 1.48.4
          test "$(jq -er '.metadata.version' .claude-plugin/marketplace.json)" = 1.48.4
          test "$(jq -er '.plugins[] | select(.name=="claude-notifications-go") | .version' .claude-plugin/marketplace.json)" = 1.48.4
          grep -E '^## \[1\.48\.4\]' CHANGELOG.md
  build-matrix:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify-version
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'ubuntu-22.04' && (vars.CI_LINUX_2204_RUNNER || 'ubuntu-22.04') || matrix.os == 'ubuntu-22.04-arm' && (vars.CI_LINUX_ARM_2204_RUNNER || 'ubuntu-22.04-arm') || matrix.os == 'macos-15' && (vars.CI_MACOS_15_RUNNER || 'macos-15') || matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          # Linux builds - use native runners
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            binary: claude-notifications-linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            binary: claude-notifications-linux-arm64

          # Windows builds - amd64 only (arm64 not supported with CGO)
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: claude-notifications-windows-amd64.exe

    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Compile retained Windows SDK callback asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./native/windows-callback/build.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-callback-release" -EmbedAsset

      - name: Retain Windows callback compile custody evidence
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 repository pin
        with:
          name: windows-callback-build-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/windows-callback-release
          if-no-files-found: error
          retention-days: 14

      - name: Build binaries
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Exact helper bytes compiled above remain inert until installed qualification.
            export GOFLAGS="-tags=windows_callback_asset"
          fi
          echo "Building claude-notifications..."
          go build -ldflags="-s -w" -trimpath -o "dist/${{ matrix.binary }}" ./cmd/claude-notifications
          echo "Building sound-preview..."
          SOUND_PREVIEW_BINARY="${{ matrix.binary }}"
          SOUND_PREVIEW_BINARY="${SOUND_PREVIEW_BINARY//claude-notifications/sound-preview}"
          go build -ldflags="-s -w" -trimpath -o "dist/$SOUND_PREVIEW_BINARY" ./cmd/sound-preview
          echo "Building list-devices..."
          LIST_DEVICES_BINARY="${{ matrix.binary }}"
          LIST_DEVICES_BINARY="${LIST_DEVICES_BINARY//claude-notifications/list-devices}"
          go build -ldflags="-s -w" -trimpath -o "dist/$LIST_DEVICES_BINARY" ./cmd/list-devices
          echo "Building list-sounds..."
          LIST_SOUNDS_BINARY="${{ matrix.binary }}"
          LIST_SOUNDS_BINARY="${LIST_SOUNDS_BINARY//claude-notifications/list-sounds}"
          go build -ldflags="-s -w" -trimpath -o "dist/$LIST_SOUNDS_BINARY" ./cmd/list-sounds
          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "Building claude-notifications focus-handler (GUI subsystem, no console flash on toast click)..."
            FOCUS_BINARY="${{ matrix.binary }}"
            FOCUS_BINARY="${FOCUS_BINARY%.exe}-focus.exe"
            go build -ldflags="-s -w -H=windowsgui" -trimpath -o "dist/$FOCUS_BINARY" ./cmd/claude-notifications
          fi

      - name: Verify Windows release embeds exact trusted helper bytes
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./native/windows-callback/verify-embedded.ps1 -Executable "dist/${{ matrix.binary }}" -Helper "$env:RUNNER_TEMP\windows-callback-release\helper.exe"

      - name: Build version-bound portable package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          zip_name="agent-notify-portable-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          go run ./cmd/build-portable-package \
            -version "$version" \
            -os "${{ matrix.platform }}" \
            -arch "${{ matrix.arch }}" \
            -executable "dist/${{ matrix.binary }}" \
            -output "dist/$zip_name" \
            -workdir "${RUNNER_TEMP}/portable-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 14


  import-darwin:
    name: Import same-source signed Darwin custody
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix: {arch: [arm64, amd64]}
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run }}
          name: macos-candidate-${{ matrix.arch }}-${{ inputs.candidate_sha }}
          path: signed
      - name: Check source/version and every signed-run leaf
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat signed/source-sha.txt)" = "$RELEASE_CANDIDATE_SHA"
          test "$(cat signed/candidate-version.txt)" = "$RELEASE_TAG"
          (cd signed && sha256sum -c SHA256SUMS)
          mkdir dist
          for name in claude-notifications sound-preview list-devices list-sounds; do
            cp "signed/$name-darwin-${{ matrix.arch }}" dist/
          done
          cp "signed/agent-notify-portable-darwin-${{ matrix.arch }}.zip" dist/
      - uses: actions/upload-artifact@v7
        with: {name: 'binaries-darwin-${{ matrix.arch }}', path: 'dist/*', if-no-files-found: error, retention-days: 14}

  prepare-opencode-inputs:
    name: Seal five-target same-source eleven-cell custody
    needs: [build-matrix, import-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      parent_sha256: ${{ steps.seal.outputs.parent_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.candidate_sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', path: operator, persist-credentials: false}
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v8
        with: {pattern: 'binaries-*', merge-multiple: true, path: source/dist}
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run }}
          name: macos-candidate-amd64-${{ inputs.candidate_sha }}
          path: source/.task-tools/artifacts/signed-amd64
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run }}
          name: macos-candidate-arm64-${{ inputs.candidate_sha }}
          path: source/.task-tools/artifacts/signed-arm64
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run }}
          name: ClaudeNotifier-smoke
          path: source/.task-tools/artifacts/signed
      - name: Fetch complete current build and signing provenance
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_SIGNING_RUN" > source/.task-tools/artifacts/signing-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > source/.task-tools/artifacts/custody-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > source/.task-tools/artifacts/custody-jobs.json
      - name: Prefetch locked dependencies and verify identical observer rebuild
        working-directory: source/opencode-plugin
        shell: bash
        run: |
          set -euo pipefail
          cp ../internal/opencodeplugin/dist/agent-notifications.js ../.task-tools/artifacts/original-observer.js
          npm ci --ignore-scripts
          npm run check:candidate
          npm run build
          cmp ../.task-tools/artifacts/original-observer.js ../internal/opencodeplugin/dist/agent-notifications.js
          cp ../internal/opencodeplugin/dist/agent-notifications.js ../.task-tools/artifacts/rebuilt-observer.js
      - name: Typecheck explicit external operator and seal all eleven cells
        id: seal
        env:
          OPERATOR_SHA: ${{ github.sha }}
          OPERATOR_ROOT: ${{ github.workspace }}/operator
          CANDIDATE_ROOT: ${{ github.workspace }}/source
        shell: bash
        run: |
          set -euo pipefail
          source/opencode-plugin/node_modules/.bin/tsc --strict --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --types node --typeRoots source/opencode-plugin/node_modules/@types operator/scripts/unified-release-qualification.mts
          node operator/scripts/unified-release-qualification.mts prepare
      - uses: actions/upload-artifact@v7
        with:
          name: unified-inputs-${{ inputs.candidate_sha }}
          path: source/.task-tools/artifacts/release-opencode-inputs.tar.gz
          if-no-files-found: error
          retention-days: 14

  qualify-opencode:
    name: Observe installed business ${{ matrix.platform }}/${{ matrix.arch }} ${{ matrix.version }}
    needs: prepare-opencode-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: amd64, runner: ubuntu-22.04, version: '1.18.33'}
          - {platform: linux, arch: amd64, runner: ubuntu-22.04, version: '2.0.21'}
          - {platform: linux, arch: arm64, runner: ubuntu-22.04-arm, version: '1.18.33'}
          - {platform: linux, arch: arm64, runner: ubuntu-22.04-arm, version: '2.0.21'}
          - {platform: windows, arch: amd64, runner: windows-latest, version: '1.18.33'}
          - {platform: windows, arch: amd64, runner: windows-latest, version: '2.0.21'}
          - {platform: darwin, arch: arm64, runner: macos-15, version: '1.18.33'}
          - {platform: darwin, arch: arm64, runner: macos-15, version: '2.0.21'}
          - {platform: darwin, arch: amd64, runner: macos-15-intel, version: '1.18.33'}
          - {platform: darwin, arch: amd64, runner: macos-15-intel, version: '2.0.21'}
          - {platform: linux, arch: amd64, runner: ubuntu-22.04, version: '1.18.34'}
    env:
      AN_OS: ${{ matrix.platform }}
      AN_ARCH: ${{ matrix.arch }}
      AN_VERSION: ${{ matrix.version }}
      AN_EVIDENCE_SHA256: ${{ needs.prepare-opencode-inputs.outputs.parent_sha256 }}
      OPERATOR_SHA: ${{ github.sha }}
      OPERATOR_ROOT: ${{ github.workspace }}/operator
      CANDIDATE_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Preserve exact LF source on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.candidate_sha }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', path: operator, persist-credentials: false}
      - uses: actions/setup-go@v7
        with: {go-version: '${{ matrix.platform == ''darwin'' && ''1.26'' || ''1.27.1'' }}', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v8
        with: {pattern: 'binaries-*', merge-multiple: true, path: source/dist}
      - uses: actions/download-artifact@v8
        with:
          name: unified-inputs-${{ inputs.candidate_sha }}
          path: source/.task-tools/artifacts/custody
      - name: Initialize fail-closed report and prefetch modules before isolation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,pathlib; p=pathlib.Path(".task-tools/artifacts/native-report.json"); p.write_text(json.dumps({"status":"unqualified","businessPhasesStarted":False,"fullNativeQualified":False})+"\n")'
          go mod download
          go mod verify
          (cd opencode-plugin && npm ci --ignore-scripts)
      - name: Linux private bus prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev dbus iproute2
      - name: Observe fresh primitives and unchanged installed business oracles once
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AN_OS" = linux ]; then
            export AN_HOST_NETNS="$(readlink /proc/self/ns/net)"
            sudo --preserve-env=PATH,AN_HOST_NETNS,AN_OS,AN_ARCH,AN_VERSION,AN_EVIDENCE_SHA256,OPERATOR_SHA,OPERATOR_ROOT,CANDIDATE_ROOT,RELEASE_CANDIDATE_SHA,RELEASE_TAG,RELEASE_SIGNING_RUN,GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP unshare --net -- bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid "$1" --regid "$2" --init-groups -- env HOME="$3" USER="$4" LOGNAME="$4" node "$5/scripts/unified-release-qualification.mts" execute
            ' bash "$(id -u)" "$(id -g)" "$HOME" "$(id -un)" "$OPERATOR_ROOT"
          else
            node "$OPERATOR_ROOT/scripts/unified-release-qualification.mts" execute
          fi
      - name: Preserve bounded reports and custody even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-business-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.version }}
          path: |
            source/.task-tools/artifacts/native-report.json
            source/.task-tools/artifacts/clock.json
            source/.task-tools/artifacts/reader.json
            source/.task-tools/artifacts/sealed-business
            source/.task-tools/artifacts/business-diagnostic.json
            source/.task-tools/artifacts/business-v2-startup-preparations.json
            source/.task-tools/artifacts/business-v2-startup-adaptation.json
            source/.task-tools/artifacts/windows-acl-preparation.json
            source/.task-tools/artifacts/macos-tools/configuration.json
            source/.task-tools/artifacts/macos-tools/artifact-version-preflight.json
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Prepare complete draft after five artifacts and eleven business reports
    needs: [test-binaries, qualify-opencode, prepare-opencode-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/download-artifact@v8
        with: {pattern: 'binaries-*', merge-multiple: true, path: dist}
      - uses: actions/download-artifact@v8
        with: {pattern: 'unified-business-*', path: reports}
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signing_run }}
          name: ClaudeNotifier-smoke
          path: signed-helper
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.candidate_sha }}', path: source, persist-credentials: false}
      - name: Validate all eleven exact-source reports and complete public asset set
        env:
          AN_EVIDENCE_SHA256: ${{ needs.prepare-opencode-inputs.outputs.parent_sha256 }}
        shell: bash
        run: node scripts/unified-release-reports.mts reports dist signed-helper source
      - name: Create immutable tag and complete draft, never publish or promote Latest
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          cp signed-helper/ClaudeNotifier-smoke.app.zip dist/ClaudeNotifier.app.zip
          cp source/internal/thirdpartynotices/THIRD_PARTY_NOTICES.txt dist/
          (cd dist && sha256sum -- * > checksums.txt)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/unified-tag.json" 2> "$RUNNER_TEMP/unified-tag-private.stderr"; then
            jq -e --arg sha "$RELEASE_CANDIDATE_SHA" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/unified-tag.json"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_CANDIDATE_SHA" > "$RUNNER_TEMP/unified-tag.json"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/unified-release.json" 2> "$RUNNER_TEMP/unified-release-private.stderr"; then
            echo 'Existing release requires explicit recovery; no overwrite or uncertain upload retry.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease=false --latest=false --title "$RELEASE_TAG" --notes 'All-platform draft; installed business qualification only. Full native clock/source-epoch and visible delivery remain separately scoped.' dist/*
  test-binaries:
    name: Test ${{ matrix.platform }} ${{ matrix.arch }} binary
    needs: [build-matrix, import-darwin]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'ubuntu-latest' && (vars.CI_LINUX_RUNNER || 'ubuntu-latest') || matrix.os == 'ubuntu-24.04-arm' && (vars.CI_LINUX_ARM_RUNNER || 'ubuntu-24.04-arm') || matrix.os == 'macos-26' && (vars.CI_MACOS_26_RUNNER || 'macos-26') || matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary: claude-notifications-linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: claude-notifications-linux-arm64
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: claude-notifications-windows-amd64.exe
          - os: macos-15
            platform: darwin
            arch: arm64
            binary: claude-notifications-darwin-arm64
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            binary: claude-notifications-darwin-amd64

    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout artifact qualification tests
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Set up Go for artifact identity and private Windows roots
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.platform == 'darwin' && '1.26' || '1.27.1' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist

      - name: Verify artifact set
        env:
          MAIN_BINARY: ${{ matrix.binary }}
        run: |
          for prefix in claude-notifications sound-preview list-devices list-sounds; do
            binary="${MAIN_BINARY/claude-notifications/$prefix}"
            if [ ! -s "dist/$binary" ]; then
              echo "Missing or empty artifact: $binary"
              exit 1
            fi
          done
          if [ "${{ matrix.platform }}" = "windows" ]; then
            focus_binary="${MAIN_BINARY%.exe}-focus.exe"
            if [ ! -s "dist/$focus_binary" ]; then
              echo "Missing or empty artifact: $focus_binary"
              exit 1
            fi
          fi
          portable_zip="agent-notify-portable-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          if [ ! -s "dist/$portable_zip" ]; then
            echo "Missing or empty artifact: $portable_zip"
            exit 1
          fi
        shell: bash

      - name: Make binaries executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist/*

      - name: Test main binary version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          output="$("./dist/${{ matrix.binary }}" version)"
          expected="claude-notifications $RELEASE_TAG"
          if [ "$output" != "$expected" ]; then
            echo "Unexpected version output: '$output' (expected '$expected')"
            exit 1
          fi
        shell: bash

      - name: Smoke-test companion binaries
        env:
          MAIN_BINARY: ${{ matrix.binary }}
        run: |
          sound_preview="${MAIN_BINARY/claude-notifications/sound-preview}"
          list_sounds="${MAIN_BINARY/claude-notifications/list-sounds}"
          "./dist/$sound_preview" --help
          "./dist/$list_sounds" --help
        shell: bash

      - name: Qualify configuration and notification delivery
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/release-artifact-e2e.py --binary "dist/${{ matrix.binary }}" --version "$RELEASE_TAG"
        shell: bash
