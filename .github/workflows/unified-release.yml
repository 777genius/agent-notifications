# Install only as .github/workflows/unified-release.yml on the fixed recovery branch.
# Preserve the original failed run and sealed assets; no build, reseal or publication.
name: Recover two unchanged Windows business cells
on: workflow_dispatch
permissions: {contents: read, actions: read}
concurrency: {group: unified-v1484-windows-recovery, cancel-in-progress: false}
env:
  RELEASE_CANDIDATE_SHA: 6a67f084eca6e424a8e72602463f34814c451210
  RELEASE_TAG: v1.48.4
  RELEASE_SIGNING_RUN: '37762717929'
  OPERATOR_SHA: f8231b21751744806a7e333903ad7029cf307711
  ORIGINAL_SEAL_RUN: '37773996005'
  AN_EVIDENCE_SHA256: 869507bfba78e1bed5f1b749f7efb5b3638caef7e4a84906451d4512592ad0ec
jobs:
  verify-original-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require owner dispatch and original successful asset custody
        env: {GH_TOKEN: '${{ github.token }}', OWNER: '${{ github.repository_owner }}', TRIGGER: '${{ github.triggering_actor }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = 777genius/agent-notifications
          test "$OWNER" = 777genius
          test "$GITHUB_ACTOR" = "$OWNER"
          test "$TRIGGER" = "$OWNER"
          test "$GITHUB_REF" = refs/heads/chore/unified-release-windows-recovery
          test "$GITHUB_WORKFLOW_REF" = 777genius/agent-notifications/.github/workflows/unified-release.yml@refs/heads/chore/unified-release-windows-recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_SEAL_RUN" > "$RUNNER_TEMP/original-run.json"
          jq -e --arg operator "$OPERATOR_SHA" '.id==37773996005 and .head_sha==$operator and .run_attempt==1 and .status=="completed" and .conclusion=="failure" and .event=="workflow_dispatch" and .head_branch=="main" and .path==".github/workflows/unified-release.yml" and .actor.login=="777genius" and .triggering_actor.login=="777genius"' "$RUNNER_TEMP/original-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_SEAL_RUN/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/original-jobs.json"
          jq -e --arg operator "$OPERATOR_SHA" '.jobs as $jobs | .total_count==($jobs|length) and (["Verify owner and exact unified candidate","Build linux amd64","Build linux arm64","Build windows amd64","Import same-source signed Darwin custody (amd64)","Import same-source signed Darwin custody (arm64)","Test linux amd64 binary","Test linux arm64 binary","Test windows amd64 binary","Test darwin amd64 binary","Test darwin arm64 binary","Seal five-target same-source eleven-cell custody"] | all(. as $name | ([$jobs[]|select(.name==$name and .run_id==37773996005 and .head_sha==$operator and .status=="completed" and .conclusion=="success")]|length)==1)) and (["Observe installed business windows/amd64 1.18.33","Observe installed business windows/amd64 2.0.21"] | all(. as $name | ([$jobs[]|select(.name==$name and .status=="completed" and .conclusion=="failure")]|length)==1))' "$RUNNER_TEMP/original-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_SEAL_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/original-artifacts.json"
          jq -e --arg operator "$OPERATOR_SHA" --arg candidate "$RELEASE_CANDIDATE_SHA" '.artifacts as $assets | .total_count==($assets|length) and ([$assets[]|select(.name|startswith("binaries-"))|.name]|sort)==(["binaries-linux-amd64","binaries-linux-arm64","binaries-windows-amd64","binaries-darwin-amd64","binaries-darwin-arm64"]|sort) and (["binaries-linux-amd64","binaries-linux-arm64","binaries-windows-amd64","binaries-darwin-amd64","binaries-darwin-arm64",("unified-inputs-"+$candidate)] | all(. as $name | ([$assets[]|select(.name==$name and .expired==false and .size_in_bytes>0 and .workflow_run.id==37773996005 and .workflow_run.head_sha==$operator)]|length)==1))' "$RUNNER_TEMP/original-artifacts.json"
  recover-windows:
    name: Recover installed business windows/amd64 ${{ matrix.version }}
    needs: verify-original-custody
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {version: ['1.18.33', '2.0.21']}
    env:
      AN_OS: windows
      AN_ARCH: amd64
      AN_VERSION: ${{ matrix.version }}
      OPERATOR_ROOT: ${{ github.workspace }}/operator
      CANDIDATE_ROOT: ${{ github.workspace }}/source
    steps:
      - name: Preserve literal Git bytes before both fresh checkouts
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with: {ref: '${{ env.RELEASE_CANDIDATE_SHA }}', path: source, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: '${{ env.OPERATOR_SHA }}', path: operator, persist-credentials: false}
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prove unchanged raw operator bytes and record actual recovery identity
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          # The unchanged Windows clock driver requires a literal short C:\ base.
          # Keep the actual GitHub runner temp in custody; adapt only tool staging.
          runner_temp=os.environ['RUNNER_TEMP']; staging_base=pathlib.Path(r'C:\AN1484W')
          assert not staging_base.exists(), 'preexisting_short_staging_base'
          for path in (staging_base,*staging_base.parents):
              assert not path.is_symlink() and not path.is_junction(), 'nonliteral_short_staging_base'
          staging_base.mkdir()
          assert staging_base.resolve(strict=True)==staging_base, 'noncanonical_short_staging_base'
          root=pathlib.Path('operator'); revision=os.environ['OPERATOR_SHA']; rows=[]
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==revision
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='source',text=True).strip()==os.environ['RELEASE_CANDIDATE_SHA']
          for name in ('scripts/unified-release-qualification.mts','scripts/macos-release-reader.mts'):
              actual=(root/name).read_bytes(); original=subprocess.check_output(['git','show',revision+':'+name],cwd=root)
              assert actual==original, 'raw_operator_source_changed:'+name
              rows.append({'path':name,'sha256':hashlib.sha256(actual).hexdigest(),'rawGitEquality':True})
          evidence={key:os.environ[key] for key in ('RELEASE_CANDIDATE_SHA','OPERATOR_SHA','RELEASE_SIGNING_RUN','ORIGINAL_SEAL_RUN','AN_EVIDENCE_SHA256','AN_VERSION','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF')}
          evidence.update(scope='two_fresh_Windows_business_cells_original_assets_no_reseal',operatorSources=rows,
                          actualRunnerTemp=runner_temp,requestedClockStagingBase=str(staging_base),
                          shortStagingBaseFresh=True,shortStagingBaseCanonical=True,
                          privateChildDACLAuthority='unchanged_candidate_clock_driver')
          target=pathlib.Path('source/.task-tools/artifacts/windows-recovery-custody.json'); target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(evidence,sort_keys=True)+'\n',encoding='utf8')
      - uses: actions/download-artifact@v8
        with: {github-token: '${{ github.token }}', run-id: '37773996005', pattern: 'binaries-*', merge-multiple: true, path: source/dist}
      - uses: actions/download-artifact@v8
        with: {github-token: '${{ github.token }}', run-id: '37773996005', name: 'unified-inputs-6a67f084eca6e424a8e72602463f34814c451210', path: source/.task-tools/artifacts/custody}
      - name: Initialize fail-closed report and prefetch the same locked inputs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,pathlib; p=pathlib.Path(".task-tools/artifacts/native-report.json"); p.write_text(json.dumps({"status":"unqualified","businessPhasesStarted":False,"fullNativeQualified":False})+"\n")'
          go mod download
          go mod verify
          (cd opencode-plugin && npm ci --ignore-scripts)
      - name: Execute the unchanged operator once in fresh owned Windows profiles
        shell: bash
        run: RUNNER_TEMP='C:\AN1484W' node "$OPERATOR_ROOT/scripts/unified-release-qualification.mts" execute
      - name: Preserve original report paths and recovery custody even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-business-windows-amd64-${{ matrix.version }}
          path: |
            source/.task-tools/artifacts/native-report.json
            source/.task-tools/artifacts/clock.json
            source/.task-tools/artifacts/reader.json
            source/.task-tools/artifacts/sealed-business
            source/.task-tools/artifacts/business-diagnostic.json
            source/.task-tools/artifacts/business-v2-startup-preparations.json
            source/.task-tools/artifacts/business-v2-startup-adaptation.json
            source/.task-tools/artifacts/windows-acl-preparation.json
            source/.task-tools/artifacts/macos-tools/configuration.json
            source/.task-tools/artifacts/macos-tools/artifact-version-preflight.json
            source/.task-tools/artifacts/windows-recovery-custody.json
          if-no-files-found: error
          retention-days: 14
