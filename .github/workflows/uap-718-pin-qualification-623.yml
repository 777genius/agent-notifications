# Temporary, branch-scoped checksum qualification for UAP #718 -> host #623.
# Delete after authentic Go proxy/sumdb checksums have been committed.
name: UAP 718 SDK pin qualification (temporary)
on:
  push:
    branches:
      - fix/group-known-targets-595-20261105
    paths:
      - .github/workflows/uap-718-pin-qualification-623.yml
permissions:
  contents: read
jobs:
  sums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
      - name: Download signed Go module versions
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go mod download -json 'github.com/777genius/plugin-kit-ai/install/integrationctl@v0.1.1-0.20261105211404-b4ac53c35714'
          go mod download -json 'github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins@v0.0.0-20261105211404-b4ac53c35714'
