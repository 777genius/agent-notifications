name: One-shot Windows 11 ARM QUNS_APP SearchHost ESC differential
on:
  push:
    branches: [ci/windows-shell-search-esc-diff-20261102]
    paths: ['.github/workflows/windows-shell-oobe-one-shot.yml']
permissions:
  contents: read
jobs:
  census:
    if: ${{ github.repository == '777genius/agent-notifications' && github.run_attempt == 1 && github.ref == 'refs/heads/ci/windows-shell-search-esc-diff-20261102' && github.event.head_commit.message == 'probe-quns-app-search-esc-only-v15' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 79
    env:
      TEST_INSTALLED_ADMISSION: one-fresh-disposable-installed-callback
      TEST_INSTALLED_PHASE: installed
    steps:
      - name: Dismiss only verified first-logon foreground WWAHost in disposable TEST VM
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This is disposable test-host preparation, before any signed archive
          # deployment/installation/Show. Never act on an operator's Windows VM,
          # an arbitrary process, or a process without exact OS-image identity.
          if ($env:GITHUB_ACTIONS -cne 'true' -or
              $env:GITHUB_REPOSITORY -cne '777genius/agent-notifications' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:TEST_INSTALLED_ADMISSION -cne 'one-fresh-disposable-installed-callback' -or
              $env:TEST_INSTALLED_PHASE -cne 'installed') {
            throw 'not an admitted fresh disposable installed TEST host'
          }
          $os = Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000) {
            throw 'only Windows 11 Client may have the first-login TEST overlay dismissed'
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class TestOnlyForegroundWindow {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
          }
          '@
          $foreground = [TestOnlyForegroundWindow]::GetForegroundWindow()
          [uint32]$foregroundProcessId = 0
          if ($foreground -eq [IntPtr]::Zero -or
              [TestOnlyForegroundWindow]::GetWindowThreadProcessId($foreground, [ref]$foregroundProcessId) -eq 0 -or
              $foregroundProcessId -eq 0) {
            throw 'interactive foreground identity unavailable; no TEST cleanup'
          }
          $process = [Diagnostics.Process]::GetProcessById([int]$foregroundProcessId)
          try {
            if ($process.ProcessName -cne 'WWAHost') {
              Write-Output 'TEST_FIRST_LOGON_OVERLAY_DISMISSED=0;reason=other_foreground'
            } else {
              $image = [string]$process.MainModule.FileName
              $systemRoot = [string]$env:WINDIR
              $sameSession = $process.SessionId -eq [Diagnostics.Process]::GetCurrentProcess().SessionId
              $systemImage = $image.StartsWith($systemRoot + '\', [StringComparison]::OrdinalIgnoreCase) -and
                             [IO.Path]::GetFileName($image) -ieq 'WWAHost.exe'
              if (-not $sameSession -or -not $systemImage) {
                throw 'foreign or unverified foreground WWAHost; refusing TEST cleanup'
              }
              # One exact, already-held OS process only; never sweep, retry or
              # mutate a product/client registration, package, user policy or toast.
              $process.Kill()
              if (-not $process.WaitForExit(10000)) { throw 'OOBE process exit not collected' }
              Write-Output 'TEST_FIRST_LOGON_OVERLAY_DISMISSED=1'
            }
          } finally { $process.Dispose() }
      - name: Read-only quiet-expiry and foreground identity census (no install or Show)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class TestOnlyQuietForeground {
            [DllImport("shell32.dll")] public static extern int SHQueryUserNotificationState(out int state);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr window, out uint pid);
          }
          '@
          $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
          function CurrentForegroundClass {
            $window = [TestOnlyQuietForeground]::GetForegroundWindow()
            if ($window -eq [IntPtr]::Zero) { return 'no_foreground' }
            [uint32]$processId = 0
            if ([TestOnlyQuietForeground]::GetWindowThreadProcessId($window, [ref]$processId) -eq 0 -or $processId -eq 0) {
              return 'foreground_owner_unknown'
            }
            try {
              $process = [Diagnostics.Process]::GetProcessById([int]$processId)
              try {
                if ($process.SessionId -ne $session) { return 'foreign_session' }
                $name = [string]$process.ProcessName
                if ($name -cmatch '^[A-Za-z0-9_-]{1,64}$') { return $name }
                return 'nonascii_process_name'
              } finally { $process.Dispose() }
            } catch { return 'foreground_process_exited' }
          }
          function SessionAppCensus {
            $names = @('WWAHost','UserOOBEBroker','ApplicationFrameHost','RuntimeBroker',
                       'StartMenuExperienceHost','ShellExperienceHost','SystemSettings','WindowsTerminal')
            $out = [ordered]@{}
            foreach ($name in $names) {
              $out[$name] = @(Get-Process -Name $name -ErrorAction SilentlyContinue |
                             Where-Object { $_.SessionId -eq $session }).Count
            }
            return ($out | ConvertTo-Json -Compress)
          }
          Write-Output 'TEST_SCOPE=one_shot_disposable_read_only_after_verified_WWAHost;no_product;no_install;no_Show;no_UIA_Invoke'
          for ($slot = 0; $slot -le 440; $slot++) {
            [int]$state = 0
            $hr = [TestOnlyQuietForeground]::SHQueryUserNotificationState([ref]$state)
            if ($hr -ne 0) { throw 'notification state query failed; no effects' }
            if ($state -ne 6) {
              Write-Output ("TEST_TERMINAL_NOTIFICATION_STATE=" + $state + ";elapsed_slots=" + $slot)
              Write-Output ("TEST_TERMINAL_FOREGROUND_CLASS=" + (CurrentForegroundClass))
              Write-Output ("TEST_TERMINAL_SAME_SESSION_APP_CENSUS=" + (SessionAppCensus))
              Write-Output 'TEST_DIAGNOSTIC_ONLY=1;installed_callback_qualified=false'
              if ($state -ne 5 -and $state -ne 7) {
                throw 'unexpected blocked notification state; no product attempted'
              }
              exit 0
            }
            if (($slot % 30) -eq 0) {
              Write-Output ("TEST_QUIET_TIME_6;elapsed_slots=" + $slot)
            }
            if ($slot -eq 440) { throw 'bounded first-login quiet interval did not expire' }
            Start-Sleep -Seconds 10
          }

      - name: OS-only identity-gated SearchHost ESC differential after quiet expiry
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Diagnostic only, no package, Show, UIA, policy mutations or callback evidence.
          # Tests whether a single ESC alone dismisses verified Windows Search.
          if ($env:GITHUB_ACTIONS -cne 'true' -or
              $env:GITHUB_REPOSITORY -cne '777genius/agent-notifications' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:TEST_INSTALLED_ADMISSION -cne 'one-fresh-disposable-installed-callback') {
            throw 'not an admitted fresh disposable TEST host'
          }
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000) { throw 'Windows 11 Client required' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class TestOnlySearchEsc {
            [DllImport("shell32.dll")] public static extern int SHQueryUserNotificationState(out int state);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr window, out uint pid);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
          }
          '@
          function NotificationState {
            [int]$result = 0
            $hr = [TestOnlySearchEsc]::SHQueryUserNotificationState([ref]$result)
            if ($hr -ne 0) { throw 'SHQueryUserNotificationState failed' }
            return $result
          }
          Write-Output 'TEST_SCOPE=OS_SearchHost_only_ESC_differential;policy_changes=0;no_product;no_install;no_Show;no_UIA_Invoke;callback_qualified=false'
          $before = NotificationState
          Write-Output "TEST_PRE_ESC_NOTIFICATION_STATE=$before"
          if ($before -ne 7) {
            Write-Output 'TEST_ESC_SKIPPED=not_QUNS_APP7'
            exit 0
          }
          $window = [TestOnlySearchEsc]::GetForegroundWindow()
          [uint32]$pid = 0
          if ($window -eq [IntPtr]::Zero -or
              [TestOnlySearchEsc]::GetWindowThreadProcessId($window, [ref]$pid) -eq 0 -or
              $pid -eq 0) {
            Write-Output 'TEST_ESC_SKIPPED=no_known_foreground'
            exit 0
          }
          $target = [Diagnostics.Process]::GetProcessById([int]$pid)
          try {
            $expected = [IO.Path]::GetFullPath((Join-Path $env:WINDIR 'SystemApps\MicrosoftWindows.Client.CBS_cw5n1h2txyewy\SearchHost.exe'))
            $sameSession = $target.SessionId -eq [Diagnostics.Process]::GetCurrentProcess().SessionId
            $sameImage = [String]::Equals([string]$target.MainModule.FileName, $expected,
                                          [StringComparison]::OrdinalIgnoreCase)
            Write-Output ('TEST_FOREGROUND_PROCESS_CLASS=' + $target.ProcessName)
            Write-Output ('TEST_VERIFIED_SEARCHHOST_OS_IMAGE=' + $sameImage)
            if (-not $sameSession -or $target.ProcessName -cne 'SearchHost' -or -not $sameImage) {
              Write-Output 'TEST_ESC_SKIPPED=unverified_foreground'
              exit 0
            }
            [uint32]$confirmPid = 0
            $confirmWindow = [TestOnlySearchEsc]::GetForegroundWindow()
            if ($confirmWindow -ne $window -or
                [TestOnlySearchEsc]::GetWindowThreadProcessId($confirmWindow, [ref]$confirmPid) -eq 0 -or
                $confirmPid -ne $pid -or $target.HasExited) {
              Write-Output 'TEST_ESC_SKIPPED=foreground_changed'
              exit 0
            }
            # Exactly one ESC keydown/up to foreground OS Search, never a toast click.
            [TestOnlySearchEsc]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)
            [TestOnlySearchEsc]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)
            Write-Output 'TEST_SEARCHHOST_ESC_SENT=1'
          } finally { $target.Dispose() }
          Start-Sleep -Seconds 2
          Write-Output ('TEST_POST_ESC_2S_NOTIFICATION_STATE=' + (NotificationState))
          Start-Sleep -Seconds 10
          Write-Output ('TEST_POST_ESC_12S_NOTIFICATION_STATE=' + (NotificationState))
          Write-Output 'TEST_DIAGNOSTIC_ONLY=1;installed_callback_qualified=false'
