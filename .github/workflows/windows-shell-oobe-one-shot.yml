name: TEST-only Windows 11 ARM first-logon Shell overlay probe
on:
  push:
    branches: [ci/windows-shell-oobe-probe-20261101]
    paths: ['.github/workflows/windows-shell-oobe-one-shot.yml']
permissions:
  contents: read
jobs:
  shell-overlay:
    if: ${{ github.repository == '777genius/agent-notifications' && github.run_attempt == 1 && github.event.head_commit.message == 'probe-windows-arm-notification-state-v10' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 8
    steps:
      - name: Inspect and dismiss only known first-logon overlay, then probe the Shell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $code = @'
          using System;
          using System.Runtime.InteropServices;
          public static class TestOnlyShellProbe {
            [StructLayout(LayoutKind.Sequential)]
            public struct Key { public ushort vk, scan; public uint flags, time; public IntPtr extra; }
            [StructLayout(LayoutKind.Explicit, Size=40)]
            public struct Input { [FieldOffset(0)] public uint type; [FieldOffset(8)] public Key key; }
            [DllImport("user32.dll", SetLastError=true)]
            public static extern uint SendInput(uint n, [In] Input[] data, int size);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("shell32.dll")] public static extern int SHQueryUserNotificationState(out int state);
            public static string NotificationState() { int state; int hr=SHQueryUserNotificationState(out state); return hr==0 ? state.ToString() : "hresult"; }
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hwnd, int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            public static uint ForegroundPid() {
              uint pid; GetWindowThreadProcessId(GetForegroundWindow(), out pid); return pid;
            }
            public static uint OpenOnce(ushort shortcut) {
              var input = new Input[4];
              for (int i=0;i<4;i++) input[i].type=1;
              input[0].key.vk=0x5b; input[1].key.vk=shortcut;
              input[2].key.vk=shortcut; input[2].key.flags=2;
              input[3].key.vk=0x5b; input[3].key.flags=2;
              return SendInput(4,input,Marshal.SizeOf(typeof(Input)));
            }
          }
          '@
          Add-Type -TypeDefinition $code
          function KnownProcess([uint32]$processId) {
            if ($processId -eq 0) { return 'none' }
            try {
              $p = [System.Diagnostics.Process]::GetProcessById([int]$processId)
              if ($p.SessionId -ne [System.Diagnostics.Process]::GetCurrentProcess().SessionId) { return 'other_session' }
              if ($p.ProcessName -in @('WWAHost','UserOOBEBroker','StartMenuExperienceHost','SystemPropertiesPerformance','WindowsTerminal','OpenConsole','explorer','pwsh','powershell','wsl')) {
                return $p.ProcessName
              }
              return 'other'
            } catch { return 'exited' }
          }
          function Census {
            $names = @('WWAHost','UserOOBEBroker','StartMenuExperienceHost','SystemPropertiesPerformance','WindowsTerminal','OpenConsole','wsl')
            $rows = @{}
            $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
            foreach ($name in $names) {
              $matches = @(Get-Process -Name $name -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $session })
              $rows[$name] = $matches.Count
            }
            return $rows
          }
          function Capture {
            $image = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try { $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size) }
            finally { $graphics.Dispose() }
            return $image
          }
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          if ($bounds.Width -lt 640 -or $bounds.Height -lt 480) { throw 'insufficient desktop geometry' }
          $notificationStateBefore = [TestOnlyShellProbe]::NotificationState()
          $before = Census
          $foregroundBefore = KnownProcess ([TestOnlyShellProbe]::ForegroundPid())
          $brokerFound = $before['UserOOBEBroker'] -gt 0
          $foregroundId = [TestOnlyShellProbe]::ForegroundPid()
          $stopped = 0
          $refused = 0
          # Proven image-build mitigation on a disposable CI image, not operator OS:
          # https://github.com/actions/runner-images/pull/14673
          $privacy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $privacy -Force | Out-Null
          Set-ItemProperty -Path $privacy -Name DisablePrivacyExperience -Type DWord -Value 1
          $engagement = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\UserProfileEngagement'
          New-Item -Path $engagement -Force | Out-Null
          Set-ItemProperty -Path $engagement -Name ScoobeSystemSettingEnabled -Type DWord -Value 0
          # The GitHub-hosted VM is disposable. Never touch any non-OOBE app,
          # product installation, notification, foreign profile or consent.
          foreach ($name in @('UserOOBEBroker','WWAHost')) {
            foreach ($p in @(Get-Process -Name $name -ErrorAction SilentlyContinue)) {
              if ($p.SessionId -ne $session) { continue }
              $title = [string]$p.MainWindowTitle
              $isPrivacyWindow = $name -eq 'WWAHost' -and ($title -match '(?i)choose privacy settings|privacy settings for your device' -or $p.Id -eq $foregroundId)
              if ($name -eq 'WWAHost' -and -not ($brokerFound -or $isPrivacyWindow)) { continue }
              try { $path = [string]$p.Path } catch { $path = '' }
              if (-not $path.StartsWith($env:WINDIR + '\', [StringComparison]::OrdinalIgnoreCase)) {
                $refused++; continue
              }
              Stop-Process -Id $p.Id -Force -ErrorAction Stop
              $stopped++
            }
          }
          # Minimize only the known Microsoft first-logon System Properties dialog;
          # do not sweep arbitrary windows or touch the product/UIA authority.
          $systemDialogMinimized = 0
          foreach ($p in @(Get-Process -Name SystemPropertiesPerformance -ErrorAction SilentlyContinue)) {
            if ($p.SessionId -ne $session -or $p.MainWindowHandle -eq [IntPtr]::Zero) { continue }
            try { $sysPath = [string]$p.Path } catch { $sysPath = '' }
            if ($sysPath.StartsWith($env:WINDIR + '\', [StringComparison]::OrdinalIgnoreCase)) {
              [void][TestOnlyShellProbe]::ShowWindow($p.MainWindowHandle,6)
              $systemDialogMinimized++
            }
          }
          # Dismiss any first-logon Start overlay, without terminating the shell.
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Milliseconds 1200
          $notificationStateAfterCleanup = [TestOnlyShellProbe]::NotificationState()
          $after = Census
          $foregroundAfterCleanup = KnownProcess ([TestOnlyShellProbe]::ForegroundPid())
          # Establish and close one Quick Settings shell surface first (inert UI preflight).
          $firstQuick = [TestOnlyShellProbe]::OpenOnce(0x41)
          Start-Sleep -Milliseconds 1200
          $secondQuick = [TestOnlyShellProbe]::OpenOnce(0x41)
          Start-Sleep -Milliseconds 1200
          if ($firstQuick -ne 4 -or $secondQuick -ne 4) { throw 'quick settings priming refused' }
          $imageBefore = Capture
          try {
            $inserted = [TestOnlyShellProbe]::OpenOnce(0x4e)
            if ($inserted -ne 4) { throw 'failed to insert exactly one Win+N sequence' }
            Start-Sleep -Milliseconds 1400
            $imageAfter = Capture
            try {
              $count = 0; $changed = 0
              $startX = [int]($bounds.Width*2/3)
              for ($y=0;$y -lt $bounds.Height;$y+=8) {
                for ($x=$startX;$x -lt $bounds.Width;$x+=8) {
                  $count++
                  if ($imageBefore.GetPixel($x,$y).ToArgb() -ne $imageAfter.GetPixel($x,$y).ToArgb()) { $changed++ }
                }
              }
            } finally { $imageAfter.Dispose() }
          } finally { $imageBefore.Dispose() }
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $rootUIA = [System.Windows.Automation.AutomationElement]::RootElement
          $walker = [System.Windows.Automation.TreeWalker]::RawViewWalker
          $stack = New-Object 'System.Collections.Generic.Stack[System.Windows.Automation.AutomationElement]'
          $stack.Push($rootUIA)
          $nodes = 0; $centerNames = 0; $clockNames = 0; $shellNames = 0; $onScreen = 0; $exactCenter = 0; $dndHints = 0; $centerOwnerShell = 0; $centerOwnerOther = 0
          while ($stack.Count -gt 0 -and $nodes -lt 1000) {
            $el = $stack.Pop()
            $nodes++
            try {
              $c = $el.Current
              $name = [string]$c.Name
              $automation = [string]$c.AutomationId
              $offscreen = [bool]$c.IsOffscreen
              if (-not $offscreen) { $onScreen++ }
              if ($name -match '(?i)notification center|clear all notifications|do not disturb') {
                $centerNames++
                if ($name -match '(?i)notification center|clear all notifications') {
                  $exactCenter++
                  try {
                    $owner = [System.Diagnostics.Process]::GetProcessById($c.ProcessId)
                    if ($owner.ProcessName -in @('explorer','ShellExperienceHost','SystemSettings','ShellHost')) { $centerOwnerShell++ }
                    else { $centerOwnerOther++ }
                  } catch { $centerOwnerOther++ }
                }
                if ($name -match '(?i)do not disturb') { $dndHints++ }
              }
              if ($name -match '(?i)calendar|clock|date and time') { $clockNames++ }
              if ($automation -match '(?i)notification|clock|calendar') { $shellNames++ }
              $ch = $walker.GetFirstChild($el)
              $local = 0
              while ($null -ne $ch -and $local -lt 80 -and $nodes + $stack.Count -lt 1100) {
                $stack.Push($ch)
                $local++
                $ch = $walker.GetNextSibling($ch)
              }
            } catch { continue }
          }
          $appxServiceFound = @(Get-Service -Name 'AppXSvc' -ErrorAction SilentlyContinue).Count
          $packageManagerTypeFound = $false
          try {
            $packageManagerTypeFound = [bool]([Windows.Management.Deployment.PackageManager,Windows.Management.Deployment,ContentType=WindowsRuntime])
          } catch { $packageManagerTypeFound = $false }
          $notificationStateAfterShortcut = [TestOnlyShellProbe]::NotificationState()
          $report = [ordered]@{
            notificationStateBefore = $notificationStateBefore
            notificationStateAfterCleanup = $notificationStateAfterCleanup
            notificationStateAfterShortcut = $notificationStateAfterShortcut
            shellShortcut = 'Win+A_twice_then_Win+N_notification_center'
            priorQuickSettingsInputEvents = $firstQuick + $secondQuick
            scope = 'one_shot_disposable_no_product_notification_overlay_diagnostic'
            session = $session
            overlayProcessCountsBefore = $before
            foregroundBefore = $foregroundBefore
            oobeBrokerFound = $brokerFound
            privacyPolicyConfiguredInDisposableVm = $true
            systemDialogMinimized = $systemDialogMinimized
            selectedOobeProcessesStopped = $stopped
            unexpectedOobePathsRefused = $refused
            overlayProcessCountsAfter = $after
            foregroundAfterCleanup = $foregroundAfterCleanup
            foregroundAfterWinShortcut = (KnownProcess ([TestOnlyShellProbe]::ForegroundPid()))
            inputKeyEvents = $inserted
            sampledRightThirdPixels = $count
            changedRightThirdSamples = $changed
            uiaNodes = $nodes
            uiaOnScreen = $onScreen
            uiaNotificationNameHints = $centerNames
            uiaExactNotificationCenterNames = $exactCenter
            uiaDoNotDisturbNames = $dndHints
            uiaNotificationCenterShellOwner = $centerOwnerShell
            uiaNotificationCenterOtherOwner = $centerOwnerOther
            appxDeploymentServiceFound = $appxServiceFound
            packageManagerWinRTAvailable = $packageManagerTypeFound
            uiaClockNameHints = $clockNames
            uiaShellAutomationIdHints = $shellNames
            screenshotsSaved = $false
            productToastSent = $false
            shellUIAInvokeQualified = $false
            installedCallbackQualified = $false
          }
          Write-Output ('OOBE_SHELL_PREFLIGHT=' + ($report | ConvertTo-Json -Compress -Depth 4))
