name: Install reboot recovery E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      use_github_runner:
        description: Use GitHub-hosted runners for native macOS checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Supersede only older checks for this PR; dispatch runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}

jobs:
  # Body/title edits create no canonical check names and cannot cancel full CI.
  scope:
    if: ${{ !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (scope)' || 'Classify macOS CI scope' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.release-scope.outputs.mode || steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative classification and installer mode contracts
        run: |
          python3 scripts/ci_macos_scope_test.py
          python3 -B tools/ci_release_scope_test.py
          bash bin/install_e2e_mode_test.sh
      - name: Classify exact PR revision (errors retain full CI)
        id: classify
        run: python3 scripts/ci_macos_scope.py classify
      - name: Classify release tooling only when native scope is full
        id: release-scope
        if: steps.classify.outputs.mode == 'full'
        run: python3 -B tools/ci_release_scope.py classify

  recovery:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'release-tools' && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && format('Metadata edit ignored (recovery {0})', matrix.os) || format('Offline recovery ({0}, native Go 1.26)', matrix.os) }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_github_runner && matrix.os == 'macos-15' && matrix.os || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'ubuntu-latest' && (vars.CI_LINUX_RUNNER || 'ubuntu-latest') || matrix.os == 'macos-15' && (vars.CI_MACOS_15_RUNNER || 'macos-15') || matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Keep Linux recovery coverage for cheap intermediate prose/Windows heads.
        os: ${{ fromJSON((needs.scope.outputs.mode == 'docs' || needs.scope.outputs.mode == 'windows-only') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-15"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare pinned modules and sandbox
        shell: bash
        run: |
          sandbox=$(mktemp -d "$RUNNER_TEMP/an-install-recovery-XXXXXX")
          source bin/test-env.sh
          test_env_setup "$sandbox"
          export GOMODCACHE="$sandbox/gomod" GOCACHE="$sandbox/gocache" GOTOOLCHAIN=local GOTELEMETRY=off
          go mod download
          go mod verify
          mkdir -p "$sandbox/baseline"
          git archive 27ea07236aa5ce7f939d8bd153c2a1ae19f99c1c | tar -x -C "$sandbox/baseline"
          cp bin/e2e_backoff_test.sh "$sandbox/baseline/bin/"
          cp internal/installruntime/renumber_e2e{,_darwin}_test.go "$sandbox/baseline/internal/installruntime/"
          # The fixed historical baseline retains its own pinned dependency versions.
          (cd "$sandbox/baseline"; go mod download; go mod verify)
          printf 'RECOVERY_SANDBOX=%s\n' "$sandbox" >> "$GITHUB_ENV"
      - name: Focused Go and shell integration (offline, isolated)
        shell: bash
        run: |
          source bin/test-env.sh
          test_env_setup "$RECOVERY_SANDBOX"
          mkdir -p "$RECOVERY_SANDBOX/evidence"
          env -i PATH="$PATH" HOME="$HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" \
            XDG_STATE_HOME="$XDG_STATE_HOME" XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            TMPDIR="$TMPDIR" CLAUDE_CONFIG_DIR="$CLAUDE_CONFIG_DIR" CODEX_HOME="$CODEX_HOME" \
            GOMODCACHE="$RECOVERY_SANDBOX/gomod" GOCACHE="$RECOVERY_SANDBOX/gocache" \
            GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOTELEMETRY=off \
            GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" \
            EVIDENCE="$RECOVERY_SANDBOX/evidence" BASELINE="$RECOVERY_SANDBOX/baseline" bash --noprofile --norc -c '
              set -uo pipefail
              status=0
              check() {
                local name=$1; shift
                "$@" 2>&1 | tee "$EVIDENCE/$name.log"
                local result=${PIPESTATUS[0]}
                if [ "$result" != 0 ]; then status=1; fi
                printf "%s exit=%s\n" "$name" "$result" | tee -a "$EVIDENCE/results.log"
              }
              go version
              # A baseline compile error is not regression proof. Require the
              # independently observed behavior diagnostic from the old source.
              (cd "$BASELINE"; bash bin/e2e_backoff_test.sh sequential_failure) > "$EVIDENCE/base-backoff.log" 2>&1
              result=$?
              cat "$EVIDENCE/base-backoff.log"
              if [ "$result" != 0 ] && grep -q "20 hooks made 20 installs; expected 1" "$EVIDENCE/base-backoff.log"; then
                echo "PASS: baseline repeated-install red proof"
              else
                echo "FAIL: baseline repeated-install regression was not demonstrated"; status=1
              fi
              if [ "$(uname -s)" = Darwin ]; then
                (cd "$BASELINE"; go test ./internal/installruntime -run "^TestRenumberE2EDarwinFlows$" -count=1 -timeout=6m -v) > "$EVIDENCE/base-renumber.log" 2>&1
                result=$?
                cat "$EVIDENCE/base-renumber.log"
                if [ "$result" != 0 ] && grep -q "native directory inode changed" "$EVIDENCE/base-renumber.log"; then
                  echo "PASS: baseline Darwin persisted-device red proof"
                else
                  echo "FAIL: baseline Darwin regression was not demonstrated"; status=1
                fi
              else
                echo "SKIP: Darwin APFS renumber, recovery and mount behavior require the ephemeral macos-15 job"
              fi
              # One package run includes the new Darwin renumber tests on macOS.
              check go go test ./internal/installruntime ./internal/agentnotify/setup -count=1 -timeout=12m -v
              check native-vet go vet ./internal/installruntime ./internal/agentnotify/setup
              # Local consumer integration tests import host CGo adapters.
              # Cross-vet production files; native CI vets the platform tests.
              cross_vet() {
                local target=$1 file
                local -a files=()
                while IFS= read -r file; do
                  [ -n "$file" ] && files+=("internal/installruntime/$file")
                done < <(env GOOS="$target" go list -f "{{range .GoFiles}}{{println .}}{{end}}" ./internal/installruntime)
                [ "${#files[@]}" -gt 0 ] || return 1
                env GOOS="$target" go vet "${files[@]}"
              }
              check windows-vet cross_vet windows
              check darwin-vet cross_vet darwin
              check install-transaction bash bin/install_transaction_test.sh
              check codex-wrapper bash bin/codex-hook-wrapper_test.sh
              check backoff bash bin/e2e_backoff_test.sh
              check launchservices bash bin/e2e_launchservices_macos_test.sh
              exit "$status"
            '
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-recovery-${{ matrix.os }}
          path: ${{ env.RECOVERY_SANDBOX }}/evidence
          if-no-files-found: warn
      - name: Remove owned sandbox
        if: always()
        shell: bash
        run: |
          case "$RECOVERY_SANDBOX" in "$RUNNER_TEMP"/an-install-recovery-*)
            # Downloaded module directories are read-only. Change only this
            # owned sandbox cache before removing its test artifacts.
            if [ -d "$RECOVERY_SANDBOX/gomod" ]; then
              chmod -R u+w "$RECOVERY_SANDBOX/gomod"
            fi
            rm -rf "$RECOVERY_SANDBOX"
          ;; esac

  full-ci:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (full recovery gate)' || 'Full install recovery required' }}
    needs: [scope, recovery]
    if: ${{ always() && needs.scope.outputs.mode != 'release-tools' && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require actual full native success on this revision
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_macos_scope.py gate recovery
