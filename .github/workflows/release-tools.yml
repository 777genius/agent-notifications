name: Release tooling contracts
on:
  pull_request:
    paths: ['scripts/release-*', 'scripts/basic-release-assets*', 'scripts/basic-release-assets/**', 'scripts/testdata/release-public-verify/**', 'scripts/testdata/release-canary/**', 'tools/ci_release_scope*', 'tools/ci_native_evidence*', 'tools/ci_ubuntu_*', 'tools/ci_windows_shards*', 'scripts/release-artifact-e2e.py', 'scripts/ci-ubuntu-go-shard.sh', 'docs/RELEASE.md', 'docs/RELEASE_SPEED.md', 'scripts/codex-offline-release-smoke/**', 'scripts/codex-release-gate*', 'scripts/stage-released-loader*', '.github/workflows/basic-release.yml', '.github/workflows/release-tools.yml', 'Makefile']
  push:
    branches: [main]
    paths: ['scripts/release-*', 'scripts/basic-release-assets*', 'scripts/basic-release-assets/**', 'scripts/testdata/release-public-verify/**', 'scripts/testdata/release-canary/**', 'tools/ci_release_scope*', 'tools/ci_native_evidence*', 'tools/ci_ubuntu_*', 'tools/ci_windows_shards*', 'scripts/release-artifact-e2e.py', 'scripts/ci-ubuntu-go-shard.sh', 'docs/RELEASE.md', 'docs/RELEASE_SPEED.md', 'scripts/codex-offline-release-smoke/**', 'scripts/codex-release-gate*', 'scripts/stage-released-loader*', '.github/workflows/basic-release.yml', '.github/workflows/release-tools.yml', 'Makefile']
permissions:
  contents: read
jobs:
  contracts:
    name: Release tooling contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix scripts/codex-offline-release-smoke ci
      - run: make release-tools-check
      - run: make release-preflight
