name: Notifier Signing Smoke Test

on:
  workflow_call:
    inputs:
      use_github_runner:
        required: false
        default: false
        type: boolean
      skip_notarize:
        description: Skip notarization and only validate Developer ID signing
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "smoke-notary-*"
  workflow_dispatch:
    inputs:
      use_github_runner:
        description: "Use GitHub hosted macOS when the configured runner is unavailable"
        required: false
        default: false
        type: boolean
      skip_notarize:
        description: "Skip notarization and only validate Developer ID signing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke-notifier:
    name: Build, Sign, Optionally Notarize ClaudeNotifier.app
    runs-on: ${{ inputs.use_github_runner && 'macos-15' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15' }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Apple signing credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test "${APPLE_TEAM_ID:-}" = "86399583GS" || { echo "Unexpected APPLE_TEAM_ID" >&2; exit 1; }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
          if [ "${{ inputs.skip_notarize }}" != "true" ]; then
            for name in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
            done
          fi

      - name: Prepare Apple notarization API key
        if: ${{ inputs.skip_notarize != true }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os, pathlib
          key = base64.b64decode(os.environ['APPLE_API_KEY_BASE64'], validate=True)
          if not key:
              raise SystemExit('Apple notarization API key is empty')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apple-notary-key.p8'
          with path.open('wb') as stream:
              os.fchmod(stream.fileno(), 0o600)
              stream.write(key)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'APPLE_API_KEY={path}\n')
          PYTHON

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          if ! echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            echo -n "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            if [ -n "$keychain" ]; then
              EXISTING_KEYCHAINS+=("$keychain")
            fi
          done < <(security list-keychains -d user)

          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

      - name: Build, sign, and optionally notarize ClaudeNotifier.app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd swift-notifier
          if [ "${{ inputs.skip_notarize }}" = "true" ]; then
            bash scripts/build-app.sh --ci --skip-notarize --no-register
          else
            bash scripts/build-app.sh --ci --no-register
          fi

      - name: Verify signature metadata
        run: |
          bash swift-notifier/scripts/verify-signing.sh swift-notifier/ClaudeNotifier.app
          codesign --verify --deep --strict -R '=identifier "com.777genius.agent-notifications"' swift-notifier/ClaudeNotifier.app
          codesign --display --entitlements :- swift-notifier/ClaudeNotifier.app

      - name: Create zip artifact
        run: |
          cd swift-notifier
          test -f ClaudeNotifier.app.managed-runtime.json
          ditto -c -k --keepParent ClaudeNotifier.app ClaudeNotifier-smoke.app.zip
          zip -u ClaudeNotifier-smoke.app.zip ClaudeNotifier.app.managed-runtime.json
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, plistlib, subprocess, zipfile
          app = pathlib.Path('ClaudeNotifier.app')
          executable = app / 'Contents/MacOS/terminal-notifier-modern'
          archive = pathlib.Path('ClaudeNotifier-smoke.app.zip')
          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
              return value.hexdigest()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA'], 'checkout source mismatch'
          assert source == os.environ['GITHUB_WORKFLOW_SHA'], 'workflow source mismatch'
          metadata = subprocess.run(['codesign', '-dv', '--verbose=4', str(app)], check=True, capture_output=True, text=True).stderr
          fields = dict(line.split('=', 1) for line in metadata.splitlines() if '=' in line)
          team = fields.get('TeamIdentifier', '')
          assert team == '86399583GS', 'unexpected Developer ID team'
          with (app / 'Contents/Info.plist').open('rb') as stream:
              bundle_id = plistlib.load(stream)['CFBundleIdentifier']
          assert fields.get('Identifier') == bundle_id == 'com.777genius.agent-notifications'
          executable_sha = digest(executable)
          sidecar = pathlib.Path('ClaudeNotifier.app.managed-runtime.json')
          assert json.loads(sidecar.read_text()) == dict(SchemaVersion=1, ProtocolVersion=1, DecoderFloor=1, ExecutableSHA256=executable_sha)
          with zipfile.ZipFile(archive) as packaged:
              assert packaged.read(sidecar.name) == sidecar.read_bytes(), 'packaged attestation mismatch'
              assert hashlib.sha256(packaged.read(str(executable))).hexdigest() == executable_sha, 'packaged executable mismatch'
          report = dict(schemaVersion=1, sourceSHA=source, workflowRef=os.environ['GITHUB_WORKFLOW_REF'], workflowSHA=os.environ['GITHUB_WORKFLOW_SHA'],
                        runID=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        archiveSHA256=digest(archive), executableSHA256=executable_sha, attestationSHA256=digest(sidecar),
                        bundleID=bundle_id, signingTeam=team, signatureVerified=True)
          with pathlib.Path('ClaudeNotifier-smoke.custody.json').open('x') as stream:
              json.dump(report, stream, sort_keys=True, separators=(',', ':'))
              stream.write('\n')
          PYTHON

      - name: Verify transported notifier app
        run: |
          set -euo pipefail
          extract_root="$(mktemp -d "$RUNNER_TEMP/notifier-archive.XXXXXX")"
          trap 'rm -rf "$extract_root"' EXIT
          ditto -x -k swift-notifier/ClaudeNotifier-smoke.app.zip "$extract_root"
          shopt -s nullglob
          bundles=("$extract_root"/*.app)
          test "${#bundles[@]}" -eq 1
          test "${bundles[0]}" = "$extract_root/ClaudeNotifier.app"
          test -d "${bundles[0]}" && test ! -L "${bundles[0]}"
          if [ "${{ inputs.skip_notarize }}" = "true" ]; then
            bash swift-notifier/scripts/verify-signing.sh "${bundles[0]}"
          else
            bash swift-notifier/scripts/verify-signing.sh "${bundles[0]}" --notarized
          fi

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeNotifier-smoke
          path: |
            swift-notifier/ClaudeNotifier-smoke.app.zip
            swift-notifier/ClaudeNotifier-smoke.custody.json
          retention-days: 3
