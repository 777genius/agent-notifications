name: Navigation Windows App SDK compile prerequisite
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-windows-appsdk-build.yml'
      - 'tests/integration/windows_appsdk_build/**'
      - 'opencode-plugin/package.json'
      - 'opencode-plugin/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-only:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, repository pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, repository pin
        with:
          node-version: '24.21.0'
      - name: Locked verification tooling
        shell: pwsh
        run: |
          npm ci --prefix opencode-plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'locked tooling install failed' }
          & ./opencode-plugin/node_modules/.bin/tsc.cmd --ignoreConfig --noEmit --strict --target ES2023 --module ESNext --moduleResolution bundler --types node --typeRoots ./opencode-plugin/node_modules/@types tests/integration/windows_appsdk_build/verify-runtime-package.ts
          if ($LASTEXITCODE -ne 0) { throw 'package verification typecheck failed' }
      - name: Restore graph and compile only
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'source mismatch' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio absent' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          $project = 'tests\integration\windows_appsdk_build\SDKContract.vcxproj'
          $out = Join-Path $env:RUNNER_TEMP 'TEST-windows-appsdk-build'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $packages = Join-Path $env:RUNNER_TEMP 'TEST-windows-appsdk-packages'
          New-Item -ItemType Directory -Path $packages -ErrorAction Stop | Out-Null
          $env:NUGET_PACKAGES = $packages
          & $msbuild $project /t:Restore /p:Configuration=Release /p:Platform=ARM64 "/p:RestorePackagesPath=$packages" "/p:OutDir=$out\" "/p:IntDir=$out\obj\" /verbosity:minimal "/bl:$out\restore.binlog"
          if ($LASTEXITCODE -ne 0) { throw 'SDK restore prerequisite failed' }
          $lock = 'tests\integration\windows_appsdk_build\packages.lock.json'
          if (!(Test-Path -LiteralPath $lock)) { throw 'resolved dependency lock missing' }
          Copy-Item -LiteralPath $lock -Destination (Join-Path $out 'packages.lock.json')
          $evidence = @{sourceSHA=$env:SOURCE_SHA; image=$env:ImageVersion; executedBinary=$false;
            packageLockSHA256=(Get-FileHash -LiteralPath $lock -Algorithm SHA256).Hash.ToLowerInvariant()}
          $evidence | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'build-evidence.json') -Encoding utf8
          $dotnet = ''
          $found = Get-Command dotnet -CommandType Application -ErrorAction SilentlyContinue
          if ($found) { $dotnet = $found.Source }
          node --experimental-strip-types tests/integration/windows_appsdk_build/verify-runtime-package.ts $out $packages $lock $dotnet
          if ($LASTEXITCODE -ne 0) { throw 'restored runtime content/signature verification failed or unavailable' }
          & $msbuild $project /t:Build /p:Configuration=Release /p:Platform=ARM64 "/p:RestorePackagesPath=$packages" "/p:OutDir=$out\" "/p:IntDir=$out\obj\" /verbosity:minimal "/bl:$out\build.binlog"
          if ($LASTEXITCODE -ne 0) { throw 'SDK build prerequisite failed; restored lock retained' }
      - name: Preserve build graph and diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, repository pin
        with:
          name: windows-appsdk-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-windows-appsdk-build
          if-no-files-found: error
          retention-days: 14
