{
  "name": "TEST C5 installed Pi windows process compatibility",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "TEST-c5-pi-windows-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "build-process": {
      "name": "Actual installed Pi / Windows process compatibility",
      "runs-on": "windows-2025",
      "timeout-minutes": 25,
      "env": {
        "GOWORK": "off",
        "GOTOOLCHAIN": "local",
        "CGO_ENABLED": "1",
        "SOURCE_SHA": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a"
      },
      "steps": [
        {
          "name": "Preserve canonical source bytes",
          "shell": "pwsh",
          "run": "git config --global core.autocrlf false"
        },
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-go@v7",
          "with": {
            "go-version": "1.27.1"
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Parse owner-only Terminal preparation without executing system changes",
          "shell": "pwsh",
          "run": "$tokens = $null; $errors = $null\n$null = [Management.Automation.Language.Parser]::ParseFile('scripts/pi-windows-host.ps1', [ref]$tokens, [ref]$errors)\nif ($errors.Count) { $errors | Format-List; throw 'Owner-only Terminal preparation syntax invalid' }\n"
        },
        {
          "name": "Compile the Windows desktop and host observers without native effects",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\npython -B scripts/test_pi_windows_audio_fixture.py -v\nif ($LASTEXITCODE) { throw 'Explicit audio fixture contracts failed' }\n$vs = & \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products '*' -property installationPath\nif (!$vs) { throw 'Native compiler unavailable' }\n$setup = '\"' + $vs + '\\Common7\\Tools\\VsDevCmd.bat\" -arch=x64 -host_arch=x64 >nul'\n$out = \"$env:RUNNER_TEMP/TEST-pi-observer-compile\"\nNew-Item -ItemType Directory -Path $out -Force | Out-Null\ncmd.exe /d /s /c ($setup + ' && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE tests/integration/pi_installed_desktop_windows.cpp /Fe:\"' + $out + '/observer.exe\" /Fo:\"' + $out + '/observer.obj\" /link ole32.lib oleaut32.lib user32.lib uuid.lib winmm.lib wtsapi32.lib uiautomationcore.lib advapi32.lib bcrypt.lib gdi32.lib mfplat.lib mfreadwrite.lib mfuuid.lib propsys.lib cfgmgr32.lib')\nif ($LASTEXITCODE) { throw 'Desktop observer compile failed' }\n& \"$out/observer.exe\" test-process-identity\nif ($LASTEXITCODE) { throw 'Native held-handle process cleanup guards failed' }\n\"PI_WINDOWS_OBSERVER_TEST_PATH=$out/observer.exe\" >> $env:GITHUB_ENV\ncmd.exe /d /s /c ($setup + ' && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE tests/integration/pi_windows_host.cpp /Fe:\"' + $out + '/host.exe\" /Fo:\"' + $out + '/host.obj\" /link ole32.lib oleaut32.lib user32.lib uuid.lib propsys.lib advapi32.lib cfgmgr32.lib')\nif ($LASTEXITCODE) { throw 'Host observer compile failed' }\n"
        },
        {
          "name": "Build exact shipped amd64 callback main utilities and focus companion",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\npython -B scripts/test_pi_installed_desktop_windows.py -v\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\npython -B scripts/test_pi_installed_fixture.py -v\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\npython -B scripts/pi-candidate-build.py --platform windows --arch amd64 --output \"$env:RUNNER_TEMP/TEST-pi-windows-candidate\"\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\n"
        },
        {
          "name": "Acquire the immutable standalone and run actual common setup lifecycle",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$root = \"$env:RUNNER_TEMP/TEST-pi-windows-candidate\"\n$evidence = \"$env:RUNNER_TEMP/pi-installed-windows-process\"\npython -B scripts/acquire-pi-native.py --download --platform windows --arch amd64 --output \"$env:RUNNER_TEMP/TEST-pi-host\" --report \"$evidence/acquisition.json\"\nif ($LASTEXITCODE) { exit $LASTEXITCODE }\npython -B scripts/pi-installed-process-e2e.py --candidate \"$root/stage/claude-notifications-windows-amd64.exe\" --runtime-stage \"$root/stage\" --package \"$root/package-A.zip\" --updated-package \"$root/package-B.zip\" --replacement-runtime-stage \"$root/replacement-stage\" --assets-root \"$env:GITHUB_WORKSPACE\" --pi-executable \"$env:RUNNER_TEMP/TEST-pi-host/pi/pi.exe\" --report \"$evidence/process.json\"\nexit $LASTEXITCODE\n"
        },
        {
          "name": "Preserve process-only evidence and the exact candidate for Client execution",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "TEST-c5-pi-windows-process-7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "path": "${{ runner.temp }}/TEST-pi-windows-candidate/build.json\n${{ runner.temp }}/TEST-pi-windows-candidate/stage/**\n${{ runner.temp }}/TEST-pi-windows-candidate/package-A.zip\n${{ runner.temp }}/TEST-pi-windows-candidate/package-B.zip\n${{ runner.temp }}/TEST-pi-windows-candidate/replacement-stage/**\n${{ runner.temp }}/pi-installed-windows-process/*.json\n",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == '777genius/agent-notifications' && github.actor == '777genius' && github.triggering_actor == '777genius' && github.ref == 'refs/heads/test/pi-v150-c5-installed' }}"
    }
  }
}
