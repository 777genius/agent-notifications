name: Navigation Windows official package metadata TEST
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-windows-vendor-metadata.yml'
      - 'tests/integration/navigation_windows_vendor_metadata.ts'
      - 'tests/integration/navigation_windows_native_probe.cpp'
      - 'opencode-plugin/package.json'
      - 'opencode-plugin/package-lock.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Default read-only; vendor_uri_native explicitly installs, targets one synthetic URI, and removes'
        type: choice
        default: syntax_only
        options:
          - syntax_only
          - inspect_metadata
          - manifest_fixture
          - vendor_uri_native
permissions:
  contents: read
jobs:
  vendor-metadata:
    permissions:
      contents: read
      actions: read
    runs-on: windows-11-vs2026-arm
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'vendor_uri_native' && 20 || 10 }}
    env:
      NAVIGATION_WINDOWS_VENDOR_METADATA_E2E: '1'
      NAVIGATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NAVIGATION_VENDOR_INSPECT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect_metadata' && '1' || '0' }}
      NAVIGATION_MANIFEST_FIXTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'manifest_fixture' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, existing repository pin
        with:
          node-version: '24.21.0'
      - name: Exact source and locked tooling
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:NAVIGATION_SOURCE_SHA) { throw 'checkout SHA mismatch' }
          Write-Host "Source=$env:NAVIGATION_SOURCE_SHA Image=$env:ImageVersion"
          npm ci --prefix opencode-plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'locked tooling install failed' }
          & ./opencode-plugin/node_modules/.bin/tsc.cmd --ignoreConfig --noEmit --strict --target ES2023 --module ESNext --moduleResolution bundler --types node --typeRoots ./opencode-plugin/node_modules/@types tests/integration/navigation_windows_vendor_metadata.ts tests/integration/navigation_windows_native_e2e.ts
          if ($LASTEXITCODE -ne 0) { throw 'harness typecheck failed' }
      - name: Compile native TEST probe with image SDK
        if: env.NAVIGATION_MANIFEST_FIXTURE != '1'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio prerequisite unavailable' }
          $out = Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\navigation_windows_native_probe.cpp'
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64 && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE "' + $source + '" /Fe:"' + $out + '" /Fo:"' + $env:RUNNER_TEMP + '\navigation-native-probe.obj" /link windowsapp.lib ole32.lib oleaut32.lib shell32.lib propsys.lib advapi32.lib user32.lib uuid.lib uiautomationcore.lib'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'native probe compile failed' }
      - name: Inspect only selected explicit metadata mode
        id: probe
        if: env.NAVIGATION_MANIFEST_FIXTURE != '1'
        shell: pwsh
        env:
          NAVIGATION_WINDOWS_VENDOR_NATIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'vendor_uri_native' && '1' || '0' }}
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $versions = @(Get-ChildItem -LiteralPath $sdk -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending)
          $signtool = $null
          foreach ($version in $versions) {
            $candidate = Join-Path $version.FullName 'arm64\signtool.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $signtool = $candidate; break }
          }
          if (!$signtool) { throw 'image ARM64 SDK signature tool unavailable' }
          $env:NAVIGATION_DIAGNOSTIC_PWSH = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          $args = @('--experimental-strip-types', 'tests/integration/navigation_windows_vendor_metadata.ts', (Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe'), $signtool)
          if ($env:NAVIGATION_WINDOWS_VENDOR_NATIVE_TEST -eq '1') {
            $args = @('--experimental-strip-types', 'tests/integration/navigation_windows_vendor_metadata.ts', '--vendor-uri-native', (Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe'), $signtool)
          } elseif ($env:NAVIGATION_VENDOR_INSPECT -ne '1') { $args += '--syntax-only' }
          & node @args
          if ($LASTEXITCODE -ne 0) { throw 'metadata inspection failed; inspect bounded evidence' }
      - name: Project only the retained failed manifest fixture
        id: fixture
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'manifest_fixture'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAVIGATION_WINDOWS_MANIFEST_DIAGNOSTIC: '1'
        run: |
          $env:NAVIGATION_DIAGNOSTIC_PWSH = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          & node --experimental-strip-types tests/integration/navigation_windows_vendor_metadata.ts --manifest-fixture-only
          if ($LASTEXITCODE -ne 0) { throw 'retained manifest diagnostic failed; inspect bounded evidence' }
      - name: Preserve bounded diagnostic evidence without package bytes
        if: always() && steps.probe.outputs.evidence_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-windows-vendor-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence_root }}/.owned-test-root
            ${{ steps.probe.outputs.evidence_root }}/navigation-native-probe.exe
            ${{ steps.probe.outputs.evidence_root }}/vendor-evidence.json
            ${{ steps.probe.outputs.evidence_root }}/package-metadata.json
            ${{ steps.probe.outputs.evidence_root }}/vendor-manifest.xml
            ${{ steps.probe.outputs.evidence_root }}/vendor-*.proof
            ${{ steps.probe.outputs.evidence_root }}/vendor-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve only the small retained fixture diagnostic
        if: always() && steps.fixture.outputs.evidence_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-windows-manifest-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.fixture.outputs.evidence_root }}/.owned-test-root
            ${{ steps.fixture.outputs.evidence_root }}/vendor-evidence.json
            ${{ steps.fixture.outputs.evidence_root }}/vendor-manifest.xml
            ${{ steps.fixture.outputs.evidence_root }}/dtd-negative-TEST/vendor-manifest.xml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
