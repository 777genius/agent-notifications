name: UAP #726 Go module pin qualification (temporary)
on:
  push:
    branches:
      - fix/group-known-targets-595-20261105
    paths:
      - .github/workflows/uap-726-pin-qualification-623.yml

permissions:
  contents: read

jobs:
  sums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: false
      - name: Verify official Go module versions and checksums
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go version
          go mod download -json 'github.com/777genius/plugin-kit-ai/install/integrationctl@v0.1.1-0.20261106015201-791cf6f7f01a'
          go mod download -json 'github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins@v0.0.0-20261106015201-791cf6f7f01a'
