name: Navigation Windows client native TEST callback
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-windows-native-e2e.yml'
      - 'tests/integration/navigation_windows_native_probe.cpp'
      - 'tests/integration/navigation_windows_native_e2e.ts'
      - 'opencode-plugin/package.json'
      - 'opencode-plugin/package-lock.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight/taskbar/desktop/OOBE census, single Win+N diagnostic, or native callback'
        type: choice
        default: policy_preflight
        options:
          - policy_preflight
          - center_surface
          - taskbar_uia
          - desktop_capture
          - oobe_preflight
          - native_callback
permissions:
  contents: read
jobs:
  native-client:
    # Official client GA: actions/runner-images#14592. Server runners cannot qualify this contract.
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 12
    env:
      AGENT_NOTIFY_NAVIGATION_WINDOWS_E2E: '1'
      NAVIGATION_WINDOWS_RUNNER: windows-11-vs2026-arm
      NAVIGATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NAVIGATION_WINDOWS_PREFLIGHT_ONLY: ${{ inputs.mode == 'native_callback' && '0' || '1' }}
      NAVIGATION_WINDOWS_CENTER_SURFACE: ${{ inputs.mode == 'center_surface' && '1' || '0' }}
      NAVIGATION_WINDOWS_TASKBAR_UIA: ${{ inputs.mode == 'taskbar_uia' && '1' || '0' }}
      NAVIGATION_WINDOWS_DESKTOP_CAPTURE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'desktop_capture' && '1' || '0' }}
      NAVIGATION_WINDOWS_OOBE_PREFLIGHT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'oobe_preflight' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, existing repository pin
        with:
          node-version: '24.21.0'
      - name: Exact source and image evidence
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:NAVIGATION_SOURCE_SHA) { throw 'checkout SHA mismatch' }
          Write-Host "Source=$head"
          Write-Host "Image=$env:ImageVersion Node=$(node --version)"
          if ((node --version) -notmatch '^v24\.') { throw 'Node 24 prerequisite unavailable' }
      - name: Existing pinned TypeScript tooling
        shell: pwsh
        run: |
          npm ci --prefix opencode-plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'locked tooling install failed' }
          & ./opencode-plugin/node_modules/.bin/tsc.cmd --ignoreConfig --noEmit --strict --target ES2023 --module ESNext --moduleResolution bundler --types node --typeRoots ./opencode-plugin/node_modules/@types tests/integration/navigation_windows_native_e2e.ts
          if ($LASTEXITCODE -ne 0) { throw 'native harness typecheck failed' }
      - name: Compile native TEST probe with image SDK
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio prerequisite unavailable' }
          $out = Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\navigation_windows_native_probe.cpp'
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64 && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE "' + $source + '" /Fe:"' + $out + '" /Fo:"' + $env:RUNNER_TEMP + '\navigation-native-probe.obj" /link windowsapp.lib ole32.lib oleaut32.lib shell32.lib propsys.lib advapi32.lib user32.lib uuid.lib uiautomationcore.lib'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'native probe compile failed' }
      - name: Selected TEST preflight or single native callback attempt
        if: github.event_name == 'workflow_dispatch'
        id: probe
        shell: pwsh
        run: |
          node --experimental-strip-types tests/integration/navigation_windows_native_e2e.ts (Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'native callback unavailable or failed; inspect evidence' }
      - name: Preserve partial native evidence
        if: always() && steps.probe.outputs.evidence_root != '' && inputs.mode != 'desktop_capture' && inputs.mode != 'oobe_preflight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.evidence_root }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve only bounded disposable desktop capture
        if: always() && steps.probe.outputs.evidence_root != '' && github.event_name == 'workflow_dispatch' && inputs.mode == 'desktop_capture'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-windows-desktop-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence_root }}/.owned-test-root
            ${{ steps.probe.outputs.evidence_root }}/evidence.json
            ${{ steps.probe.outputs.evidence_root }}/center-policy.json
            ${{ steps.probe.outputs.evidence_root }}/preflight.json
            ${{ steps.probe.outputs.evidence_root }}/capture-preflight.json
            ${{ steps.probe.outputs.evidence_root }}/capture-after-preflight.json
            ${{ steps.probe.outputs.evidence_root }}/desktop-capture-intent.json
            ${{ steps.probe.outputs.evidence_root }}/desktop-capture.json
            ${{ steps.probe.outputs.evidence_root }}/desktop-capture.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve only bounded disposable foreground OOBE census
        if: always() && steps.probe.outputs.evidence_root != '' && github.event_name == 'workflow_dispatch' && inputs.mode == 'oobe_preflight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-windows-oobe-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe.outputs.evidence_root }}/.owned-test-root
            ${{ steps.probe.outputs.evidence_root }}/evidence.json
            ${{ steps.probe.outputs.evidence_root }}/center-policy.json
            ${{ steps.probe.outputs.evidence_root }}/preflight.json
            ${{ steps.probe.outputs.evidence_root }}/oobe-preflight.json
            ${{ steps.probe.outputs.evidence_root }}/oobe-after-preflight.json
            ${{ steps.probe.outputs.evidence_root }}/oobe-intent.json
            ${{ steps.probe.outputs.evidence_root }}/oobe-uia.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
