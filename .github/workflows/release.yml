name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v1.48.4'

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare tag and version sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          release_version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$release_version" =~ $release_version_re ]]; then
            echo "Release tag '$RELEASE_TAG' must use the stable vX.Y.Z format"
            exit 1
          fi

          check_version() {
            label="$1"
            actual="$2"
            if [ "$actual" != "$release_version" ]; then
              echo "$label version '$actual' does not match tag '$release_version'"
              exit 1
            fi
          }

          check_version "Go binary" "$(sed -n 's/^var ConsumerVersion = "\([^"]*\)"$/\1/p' internal/config/runtime.go)"
          check_version "Plugin manifest" "$(jq -er '.version' .claude-plugin/plugin.json)"
          check_version "Codex plugin manifest" "$(jq -er '.version' .codex-plugin/plugin.json)"
          check_version "Marketplace metadata" "$(jq -er '.metadata.version' .claude-plugin/marketplace.json)"
          check_version "Marketplace plugin" "$(jq -er '.plugins[] | select(.name == "claude-notifications-go") | .version' .claude-plugin/marketplace.json)"

          if ! awk -v heading="## [$release_version]" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1 }
            END { exit(found ? 0 : 1) }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $release_version"
            exit 1
          fi

  build-matrix:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify-version
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'ubuntu-22.04' && (vars.CI_LINUX_2204_RUNNER || 'ubuntu-22.04') || matrix.os == 'ubuntu-22.04-arm' && (vars.CI_LINUX_ARM_2204_RUNNER || 'ubuntu-22.04-arm') || matrix.os == 'macos-15' && (vars.CI_MACOS_15_RUNNER || 'macos-15') || matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          # Linux builds - use native runners
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            binary: claude-notifications-linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            binary: claude-notifications-linux-arm64

          # Windows builds - amd64 only (arm64 not supported with CGO)
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: claude-notifications-windows-amd64.exe

    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Compile retained Windows SDK callback asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./native/windows-callback/build.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-callback-release" -EmbedAsset

      - name: Retain Windows callback compile custody evidence
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 repository pin
        with:
          name: windows-callback-build-${{ github.sha }}
          path: ${{ runner.temp }}/windows-callback-release
          if-no-files-found: error
          retention-days: 14

      - name: Build binaries
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Exact helper bytes compiled above remain inert until installed qualification.
            export GOFLAGS="-tags=windows_callback_asset"
          fi
          echo "Building claude-notifications..."
          go build -ldflags="-s -w" -trimpath -o "dist/${{ matrix.binary }}" ./cmd/claude-notifications
          echo "Building sound-preview..."
          SOUND_PREVIEW_BINARY="${{ matrix.binary }}"
          SOUND_PREVIEW_BINARY="${SOUND_PREVIEW_BINARY//claude-notifications/sound-preview}"
          go build -ldflags="-s -w" -trimpath -o "dist/$SOUND_PREVIEW_BINARY" ./cmd/sound-preview
          echo "Building list-devices..."
          LIST_DEVICES_BINARY="${{ matrix.binary }}"
          LIST_DEVICES_BINARY="${LIST_DEVICES_BINARY//claude-notifications/list-devices}"
          go build -ldflags="-s -w" -trimpath -o "dist/$LIST_DEVICES_BINARY" ./cmd/list-devices
          echo "Building list-sounds..."
          LIST_SOUNDS_BINARY="${{ matrix.binary }}"
          LIST_SOUNDS_BINARY="${LIST_SOUNDS_BINARY//claude-notifications/list-sounds}"
          go build -ldflags="-s -w" -trimpath -o "dist/$LIST_SOUNDS_BINARY" ./cmd/list-sounds
          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "Building claude-notifications focus-handler (GUI subsystem, no console flash on toast click)..."
            FOCUS_BINARY="${{ matrix.binary }}"
            FOCUS_BINARY="${FOCUS_BINARY%.exe}-focus.exe"
            go build -ldflags="-s -w -H=windowsgui" -trimpath -o "dist/$FOCUS_BINARY" ./cmd/claude-notifications
          fi

      - name: Verify Windows release embeds exact trusted helper bytes
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./native/windows-callback/verify-embedded.ps1 -Executable "dist/${{ matrix.binary }}" -Helper "$env:RUNNER_TEMP\windows-callback-release\helper.exe"

      - name: Build version-bound portable package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          zip_name="agent-notify-portable-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          go run ./cmd/build-portable-package \
            -version "$version" \
            -os "${{ matrix.platform }}" \
            -arch "${{ matrix.arch }}" \
            -executable "dist/${{ matrix.binary }}" \
            -output "dist/$zip_name" \
            -workdir "${RUNNER_TEMP}/portable-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

  create-release:
    name: Prepare draft GitHub Release
    needs: [build-matrix, test-binaries, qualify-opencode]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-artifacts

      - name: Organize binaries
        run: |
          mkdir -p dist
          find dist-artifacts -type f -exec cp {} dist/ \;
          cp internal/thirdpartynotices/THIRD_PARTY_NOTICES.txt dist/
          ls -lh dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-binaries:
    name: Test ${{ matrix.platform }} ${{ matrix.arch }} binary
    needs: build-matrix
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'ubuntu-latest' && (vars.CI_LINUX_RUNNER || 'ubuntu-latest') || matrix.os == 'ubuntu-24.04-arm' && (vars.CI_LINUX_ARM_RUNNER || 'ubuntu-24.04-arm') || matrix.os == 'macos-26' && (vars.CI_MACOS_26_RUNNER || 'macos-26') || matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary: claude-notifications-linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: claude-notifications-linux-arm64
          - os: windows-latest
            platform: windows
            arch: amd64
            binary: claude-notifications-windows-amd64.exe

    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout artifact qualification tests
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go for artifact identity and private Windows roots
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist

      - name: Verify artifact set
        env:
          MAIN_BINARY: ${{ matrix.binary }}
        run: |
          for prefix in claude-notifications sound-preview list-devices list-sounds; do
            binary="${MAIN_BINARY/claude-notifications/$prefix}"
            if [ ! -s "dist/$binary" ]; then
              echo "Missing or empty artifact: $binary"
              exit 1
            fi
          done
          if [ "${{ matrix.platform }}" = "windows" ]; then
            focus_binary="${MAIN_BINARY%.exe}-focus.exe"
            if [ ! -s "dist/$focus_binary" ]; then
              echo "Missing or empty artifact: $focus_binary"
              exit 1
            fi
          fi
          portable_zip="agent-notify-portable-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          if [ ! -s "dist/$portable_zip" ]; then
            echo "Missing or empty artifact: $portable_zip"
            exit 1
          fi
        shell: bash

      - name: Make binaries executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist/*

      - name: Test main binary version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          output="$("./dist/${{ matrix.binary }}" version)"
          expected="claude-notifications $RELEASE_TAG"
          if [ "$output" != "$expected" ]; then
            echo "Unexpected version output: '$output' (expected '$expected')"
            exit 1
          fi
        shell: bash

      - name: Smoke-test companion binaries
        env:
          MAIN_BINARY: ${{ matrix.binary }}
        run: |
          sound_preview="${MAIN_BINARY/claude-notifications/sound-preview}"
          list_sounds="${MAIN_BINARY/claude-notifications/list-sounds}"
          "./dist/$sound_preview" --help
          "./dist/$list_sounds" --help
        shell: bash

      - name: Qualify configuration and notification delivery
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release-artifact-e2e.py --binary "dist/${{ matrix.binary }}" --version "$RELEASE_TAG"
        shell: bash


  prepare-opencode-inputs:
    name: Seal same-run OpenCode release inputs
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Rebuild and verify the exact self-contained observer
        working-directory: opencode-plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.task-tools/artifacts
          cp ../internal/opencodeplugin/dist/agent-notifications.js ../.task-tools/artifacts/original-observer.js
          npm ci --ignore-scripts
          npm run check:candidate
          npm run build
          cmp ../.task-tools/artifacts/original-observer.js ../internal/opencodeplugin/dist/agent-notifications.js
          cp ../internal/opencodeplugin/dist/agent-notifications.js ../.task-tools/artifacts/rebuilt-observer.js
      - name: Seal actual reviewed source bytes and exact release binary custody
        id: seal
        run: python -B scripts/release-opencode-inputs.py --scope linux-windows --rebuilt .task-tools/artifacts/rebuilt-observer.js
      - uses: actions/upload-artifact@v7
        with:
          name: release-opencode-inputs-${{ github.sha }}
          path: .task-tools/artifacts/release-opencode-inputs.tar.gz
          if-no-files-found: error
          retention-days: 14

  qualify-opencode:
    name: Qualify release OpenCode ${{ matrix.target.platform }}/${{ matrix.target.arch }} ${{ matrix.version }}
    needs: [build-matrix, prepare-opencode-inputs]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.33', '2.0.21']
        target:
          - {runner: ubuntu-22.04, platform: linux, arch: amd64, binary: claude-notifications-linux-amd64}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64, binary: claude-notifications-linux-arm64}
          - {runner: windows-latest, platform: windows, arch: amd64, binary: claude-notifications-windows-amd64.exe}
        include:
          - version: '1.18.34'
            target: {runner: ubuntu-22.04, platform: linux, arch: amd64, binary: claude-notifications-linux-amd64}
    env:
      AN_EVIDENCE_ARCHIVE: .task-tools/artifacts/custody/release-opencode-inputs.tar.gz
      AN_EVIDENCE_SHA256: ${{ needs.prepare-opencode-inputs.outputs.sha256 }}
      AN_OS: ${{ matrix.target.platform }}
      AN_ARCH: ${{ matrix.target.arch }}
      AN_VERSION: ${{ matrix.version }}
      MAIN_BINARY: ${{ matrix.target.binary }}
    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Initialize unqualified report
        shell: bash
        run: |
          mkdir -p .task-tools/artifacts
          python -c 'import json,pathlib; p=pathlib.Path(".task-tools/artifacts/native-report.json"); p.write_text(json.dumps({"status":"unqualified","businessPhasesStarted":False,"firstFailedPrerequisite":"release_inputs_not_verified"})+"\n"); p.chmod(0o600)'
      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist
      - name: Download same-run sealed release custody
        uses: actions/download-artifact@v8
        with:
          name: release-opencode-inputs-${{ github.sha }}
          path: .task-tools/artifacts/custody
      - name: Make normal release binary executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "dist/$MAIN_BINARY"
      - name: Linux private bus prerequisites
        if: matrix.target.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev dbus iproute2
      - name: Verify and stage same-run parent archive
        id: parent
        shell: bash
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --stage-evidence
      - name: Bind parent manifest to the normal release artifacts
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: |
          python -B - <<'PY'
          import importlib.util, os, pathlib
          path = pathlib.Path('scripts/testdata/opencode-native-e2e/ci_inputs.py').resolve()
          spec = importlib.util.spec_from_file_location('release_inputs', path)
          inputs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(inputs)
          r = inputs.r
          try:
              m, cell, files, binary, archive = r.load_manifest(
                  pathlib.Path(os.environ['AN_MANIFEST']), os.environ['AN_OS'],
                  os.environ['AN_ARCH'], os.environ['AN_VERSION'], os.environ['AN_MANIFEST_SHA256'])
              expected = (inputs.repo / 'dist' / os.environ['MAIN_BINARY']).resolve(strict=True)
              r.require(binary == expected, 'normal_release_binary_required')
          except Exception as error:
              r.write_json(inputs.artifacts / 'native-report.json', {
                  'status': 'unqualified', 'businessPhasesStarted': False,
                  'firstFailedPrerequisite': str(error) if isinstance(error, r.Unqualified) else type(error).__name__})
              raise
          PY
      - name: Verify exact source/build custody and build the private receiver
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py
      - name: Execute reviewed installed lifecycle fixture
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: |
          set -euo pipefail
          export AN_SUITE=smoke
          if [ "$AN_OS/$AN_ARCH" = linux/amd64 ]; then export AN_SUITE=full; fi
          if [ "$AN_OS" = linux ]; then
            # Create the private network as root, then keep checkout/artifact
            # ownership and Git source verification under the runner identity.
            export AN_HOST_NETNS="$(readlink /proc/self/ns/net)"
            sudo --preserve-env=PATH,AN_MANIFEST,AN_MANIFEST_SHA256,AN_OS,AN_ARCH,AN_VERSION,AN_SUITE,AN_HOST_NETNS unshare --net -- bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid "$1" --regid "$2" --init-groups -- env HOME="$3" USER="$4" LOGNAME="$4" python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --execute
            ' bash "$(id -u)" "$(id -g)" "$HOME" "$(id -un)"
          else
            python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --execute
          fi
      - name: Upload safe OpenCode release qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-release-e2e-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.version }}
          path: .task-tools/artifacts/native-report.json
          if-no-files-found: error
          retention-days: 14
