          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1<<20),b''): h.update(chunk)
              return h.hexdigest()


          def tracked():
              result = []
              for raw in run(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  p = pathlib.Path(os.fsdecode(raw)); f = p.lstat()
                  link = os.readlink(p) if p.is_symlink() else None
                  result.append({'path':str(p),'mode':f.st_mode,'link':link,
                                 'sha256':hashlib.sha256(os.fsencode(link)).hexdigest() if link is not None else digest(p)})
              return result


          def uid1000_access(member, needed):
              facts = member.lstat()
              assert stat.S_ISDIR(facts.st_mode) or stat.S_ISREG(facts.st_mode), 'unknown prerequisite object'
              try:
                  os.getxattr(member, 'system.posix_acl_access', follow_symlinks=False)
              except OSError as error:
                  assert error.errno == errno.ENODATA, 'unknown prerequisite ACL'
              else:
                  raise AssertionError('non-mode prerequisite ACL requires qualification')
              shift = 6 if facts.st_uid == 1000 else 3 if facts.st_gid == 1000 else 0
              assert ((facts.st_mode >> shift) & needed) == needed, 'UID1000 emptygroups cannot read/search: '+str(member)
              identity = (facts.st_dev, facts.st_ino, facts.st_mode, facts.st_uid, facts.st_gid,
                          facts.st_nlink, facts.st_size, facts.st_mtime_ns, facts.st_ctime_ns)
              again = member.lstat()
              assert identity == (again.st_dev, again.st_ino, again.st_mode, again.st_uid, again.st_gid,
                                  again.st_nlink, again.st_size, again.st_mtime_ns, again.st_ctime_ns), 'prerequisite changed'
              return {'path':str(member), 'identity':identity}


