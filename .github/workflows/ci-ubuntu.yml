              finally:
                  os.close(case)


          def export_evidence(temp_fd, destination_fd, uid, gid, report):
              """Copy existing evidence only; links are inventory metadata, never followed."""
              inventory, errors = [], []
              totals = {'bytes': 0, 'entries': 0}
              fd = os.open('case-evidence.tar.gz', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                           0o600, dir_fd=destination_fd)
              os.fchown(fd, uid, gid)  # The new owned copy, never any source object.
              with os.fdopen(fd, 'wb') as output, tarfile.open(fileobj=output, mode='w|gz') as archive:
                  def add(path, raw, facts=None):
                      assert totals['entries'] < ENTRY_LIMIT and len(raw) <= FILE_LIMIT and totals['bytes'] + len(raw) <= TOTAL_LIMIT
                      totals['entries'] += 1
                      totals['bytes'] += len(raw)
                      info = tarfile.TarInfo(path)
                      info.size = len(raw)
                      info.mode = stat.S_IMODE(facts.st_mode) if facts else 0o600
                      info.uid, info.gid = (facts.st_uid, facts.st_gid) if facts else (uid, gid)
                      archive.addfile(info, io.BytesIO(raw))
                  def copy(parent, name, path, depth):
                      assert depth <= 64 and len(inventory) < ENTRY_LIMIT, 'export tree bound'
                      facts = os.stat(name, dir_fd=parent, follow_symlinks=False)
                      item = {'path': path, 'identity': identity(facts)}
                      inventory.append(item)
                      if stat.S_ISLNK(facts.st_mode):
                          item['rawLink'] = os.readlink(name, dir_fd=parent)
                          assert identity(facts) == identity(os.stat(name, dir_fd=parent, follow_symlinks=False))
                          item['disposition'] = 'link metadata only; target never read or archived'
                      elif stat.S_ISDIR(facts.st_mode):
                          child = open_directory(parent, name)
                          try:
                              entries = os.listdir(child)
                              assert len(entries) <= ENTRY_LIMIT, 'export directory entry bound'
                              for entry in sorted(entries):
                                  if len(inventory) >= ENTRY_LIMIT:
                                      errors.append({'path': path, 'error': 'export total entry bound'})
                                      break
                                  try:
                                      copy(child, entry, path + '/' + entry, depth + 1)
                                  except (OSError, AssertionError) as error:
                                      errors.append({'path': path + '/' + entry, 'error': type(error).__name__ + ':' + str(error)[:240]})
                              assert identity(facts) == identity(os.fstat(child)), 'export directory mutated'
                          finally:
                              os.close(child)
                      else:
                          assert totals['bytes'] + facts.st_size <= TOTAL_LIMIT - FILE_LIMIT, 'export aggregate bound'
                          raw = read_at(parent, name)
                          item['sha256'] = hashlib.sha256(raw).hexdigest()
                          add(path, raw, facts)
                  for root, names in (('TEST-cursor-installed-one', ('evidence', 'recipe')),
                                      ('TEST-cursor-installed-preparation', PREPARATION)):
                      try:
                          parent = open_directory(temp_fd, root)
                      except (OSError, AssertionError) as error:
                          errors.append({'path': root, 'error': type(error).__name__ + ':' + str(error)[:240]})
                          continue
                      try:
                          for name in names:
                              try:
                                  copy(parent, name, root + '/' + name, 0)
                              except (OSError, AssertionError) as error:
                                  errors.append({'path': root + '/' + name, 'error': type(error).__name__ + ':' + str(error)[:240]})
                      finally:
                          os.close(parent)
                  if report['status'] == 'PASS' and errors:
                      report.update(status='FAIL', reason='incomplete evidence export')
                  manifest = {'inventory': inventory, 'errors': errors, 'totals': totals.copy(),
                              'resultGate': report, 'linksDereferenced': False}
                  add('export-manifest.json', (json.dumps(manifest, indent=2) + '\n').encode())
              return manifest


          def main(args):
              runner_temp = pathlib.Path(args.runner_temp)
              assert runner_temp.is_absolute() and runner_temp.resolve(strict=True) == runner_temp
              temp_fd = os.open(runner_temp, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  try:
                      report = result_gate(temp_fd, args.source_sha, runner_temp)
                  except Exception as error:  # Any failed/unknown gate still exports existing evidence.
                      report = {'status': 'FAIL', 'sourceSHA256': args.source_sha,
                                'reason': type(error).__name__ + ':' + str(error)[:240]}
                  if args.destination:
                      destination = pathlib.Path(args.destination)
                      assert destination.parent == runner_temp and destination.name.startswith('TEST-cursor-evidence-export-')
                      dest_fd = open_directory(temp_fd, destination.name)
                      try:
                          assert os.fstat(dest_fd).st_uid == args.uid and os.fstat(dest_fd).st_gid == args.gid
                          exported = export_evidence(temp_fd, dest_fd, args.uid, args.gid, report)
                          # Missing partial preparation files are explicitly retained in
                          # the export manifest; failure cannot erase available evidence.
                          if report['status'] == 'PASS' and exported['errors']:
                              report = {**report, 'status': 'FAIL', 'reason': 'incomplete evidence export'}
                      finally:
                          os.close(dest_fd)
                  print(json.dumps(report, indent=2))
                  return 0 if report['status'] == 'PASS' else 1
              finally:
                  os.close(temp_fd)


          if __name__ == '__main__':
              parser = argparse.ArgumentParser()
              parser.add_argument('--runner-temp', required=True)
              parser.add_argument('--source-sha', required=True)
              parser.add_argument('--destination')
              parser.add_argument('--uid', type=int)
              parser.add_argument('--gid', type=int)
              raise SystemExit(main(parser.parse_args()))
          PY_EVIDENCE
          sudo /usr/bin/python3 -B -S "$export_dir/case_evidence.py" --runner-temp "$CURSOR_CASE_PARENT" --source-sha 48c68740e838176dd7eda67ab7227b80a34d046095a0307121d40e43f5eb5ed5 --destination "$export_dir" --uid "$(id -u)" --gid "$(id -g)"
      - name: Always retain SAME-case TEST evidence and bounded preparation records
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cursor-installed-one-evidence
          path: ${{ env.CURSOR_EVIDENCE_EXPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
  opencode-plugin:
    if: github.event_name != 'workflow_dispatch'
    name: OpenCode plugin bundle
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: TEST-opencode-plugin-ci
    steps:
      - uses: actions/checkout@v7
        with:
          path: TEST-opencode-plugin-ci
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TEST-opencode-plugin-ci/opencode-plugin/package-lock.json
      - run: npm ci
        working-directory: TEST-opencode-plugin-ci/opencode-plugin
      - run: npm run check
        working-directory: TEST-opencode-plugin-ci/opencode-plugin
      - run: git diff --exit-code -- internal/opencodeplugin/dist/agent-notifications.js

  test:
    if: github.event_name != 'workflow_dispatch'
    name: Test on Ubuntu
    # Go 1.26 runs the frozen Cursor physical Ubuntu/kernel qualification.
    runs-on: ${{ matrix.go == '1.26' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Display Go version
        run: go version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check Linux handoff pure contracts (no native effects)
        if: matrix.go == '1.26'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-client-callback.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-native-chain.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-server-surface.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-runtime-stage.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-handoff-frame.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-client-activation-trace.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-navigation-linux-sender-manifest.py
          python3 -c "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in (Path('scripts/navigation-linux-handoff-host-controller.py'), Path('tests/integration/navigation_linux_handoff_bootstrap_test.py'))]"
          python3 -c "from pathlib import Path; [compile(p.read_text(), str(p), 'exec') for p in (Path('tests/integration/navigation_linux_client_sender_test.py'), Path('tests/integration/navigation_linux_guest_pointer_entry_test.py'), Path('tests/integration/navigation_linux_client_handoff_guest_test.py'))]"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Require qualified Cursor installed physical contracts
        if: matrix.go == '1.26'
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          umask 077
          evidence=$(mktemp -d "$RUNNER_TEMP/TEST-cursor-physical-XXXXXX")
          printf 'CURSOR_PHYSICAL_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          mkdir "$evidence/tmp"
          export TMPDIR="$evidence/tmp"
          {
            uname -r
            cat /etc/os-release
            stat -f -c '%T' / "$PWD" "$TMPDIR"
          } | tee "$evidence/host.log"
          go test -count=1 -timeout=3m -v \
            github.com/777genius/plugin-kit-ai/install/integrationctl/adapters/directoryidentity \
            github.com/777genius/plugin-kit-ai/install/integrationctl/adapters/dirswap \
            2>&1 | tee "$evidence/native.log"
          for marker in \
            'ACTUAL_IOCTL=SUCCESS; fd_tuple=SUPPORTED;' \
            'QUALIFICATION=SUPPORTED; same-byte replacement denied' \
            'QUALIFICATION=SUPPORTED; substituted ancestor denied with unchanged child' \
            'FRESH_PROCESS_REVALIDATED'; do
            grep -F "$marker" "$evidence/native.log"
          done
          go test -count=1 -timeout=3m -v ./internal/copilotvscodeinstall \
            -run '^TestCursor' 2>&1 | tee "$evidence/cursor.log"
          if grep -F 'NOT_RUN positive' "$evidence/cursor.log"; then
            exit 1
          fi
          grep -F 'ACTUAL_TEST_PHYSICAL_HOST: tuple=linux/amd64' "$evidence/cursor.log"
          grep -F 'P1_ORIGINAL_TOKEN_REVALIDATED=true; PUBLIC_SELECTED_ACK_PROJECTION_DATA_ADMISSION=true' "$evidence/cursor.log"
          grep -F 'SIBLING_R2_SELECTED_R1_POSITIVE=true' "$evidence/cursor.log"
          go test -count=1 -timeout=3m -v ./internal/agentnotify/portablesetup \
            -run '^TestMaterializerSelectedCursorPublicProjectionAndAcknowledgement$' 2>&1 | tee "$evidence/materializer.log"
          if grep -F 'NOT_RUN positive materializer' "$evidence/materializer.log"; then
            exit 1
          fi
          grep -F 'QUALIFIED_TEST_MATERIALIZER_SELECTED_PROJECTION_ACK_DATA_ORIGINAL_TOKEN=true' "$evidence/materializer.log"
          grep -F -- '--- PASS: TestMaterializerSelectedCursorPublicProjectionAndAcknowledgement ' "$evidence/materializer.log"
          go test -count=1 -timeout=3m -v ./cmd/claude-notifications \
            -run '^(TestCursorCallerAcknowledgedTokenAndMatchingPendingRetry|TestCursorCallerFirstHandoffMissingToken|TestCursorCallerMissingPackageRefusalAndOwnedCleanup|TestCursorConfirmationReachesWizardAdmissionWithFrozenOptOut)$' 2>&1 | tee "$evidence/caller.log"
          if grep -F 'NOT_RUN positive caller/P1/resume' "$evidence/caller.log"; then
            exit 1
          fi
          grep -F 'QUALIFIED_TEST_CALLER_ORIGINAL_TOKEN_AND_MATCHING_RESUME=true' "$evidence/caller.log"
          grep -F 'QUALIFIED_TEST_FIRST_HANDOFF=true' "$evidence/caller.log"
          grep -F 'QUALIFIED_TEST_PENDING_A_TO_B=true' "$evidence/caller.log"
          grep -F -- '--- PASS: TestCursorCallerFirstHandoffMissingToken ' "$evidence/caller.log"
          grep -F -- '--- PASS: TestCursorCallerMissingPackageRefusalAndOwnedCleanup ' "$evidence/caller.log"
          grep -F -- '--- PASS: TestCursorConfirmationReachesWizardAdmissionWithFrozenOptOut ' "$evidence/caller.log"
          go test -count=1 -timeout=3m -v ./internal/agentnotify/setupwizard \
            -run '^TestPackageCompositionCleanupPreservesSharedAndPendingSource$' 2>&1 | tee "$evidence/caller-package.log"
          grep -F -- '--- PASS: TestPackageCompositionCleanupPreservesSharedAndPendingSource ' "$evidence/caller-package.log"

      - name: Preserve Cursor physical qualification
        if: always() && matrix.go == '1.26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cursor-installed-physical-go-${{ matrix.go }}
          path: ${{ env.CURSOR_PHYSICAL_EVIDENCE }}/*.log
          if-no-files-found: warn

      - name: Run tests
        run: |
          set -euo pipefail
          go test -timeout 20m -v -race -coverprofile=coverage-cmd.txt -covermode=atomic ./cmd/claude-notifications
          packages=$(go list ./...)
          remaining_packages=$(printf '%s\n' "$packages" | grep -Fvx 'github.com/777genius/agent-notifications/cmd/claude-notifications')
          mapfile -t remaining <<< "$remaining_packages"
          go test -timeout 20m -v -race -coverprofile=coverage-ubuntu-rest.txt -covermode=atomic "${remaining[@]}"
          { head -n 1 coverage-ubuntu-rest.txt; tail -n +2 coverage-ubuntu-rest.txt; tail -n +2 coverage-cmd.txt; } > coverage.txt

      - name: Upload coverage to Codecov
        if: matrix.go == '1.26'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build binary
        run: go build -ldflags="-s -w" -trimpath -o bin/claude-notifications ./cmd/claude-notifications

      - name: Test binary execution (help)
        run: ./bin/claude-notifications help

      - name: Qualify native selector bootstrap E2E (isolated, offline)
        id: selector-e2e
        if: matrix.go == '1.26'
        run: bash scripts/selector_e2e.sh "$RUNNER_TEMP/TEST-selector-e2e"

      - name: Upload selector bootstrap evidence
        if: always() && matrix.go == '1.26' && steps.selector-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selector-e2e-${{ runner.os }}
          path: ${{ runner.temp }}/TEST-selector-e2e
          if-no-files-found: error

      - name: Test one-line setup loader (isolated, offline)
        run: bash bin/setup_test.sh

      - name: Test platform channels and cache recovery (isolated)
        run: |
          bash bin/release_channel_test.sh
          bash bin/release_channel_native_test.sh

      - name: Test python/node installer runtime fallback (isolated, offline)
        run: bash bin/installer_runtime_fallback_e2e_test.sh

      - name: Qualify interpreter-free artifact lifecycle
        if: matrix.go == '1.26'
        run: |
          bash bin/install_no_interpreters_test.sh "$PWD/bin/claude-notifications"
          bash bin/install_no_interpreters_lifecycle_test.sh "$PWD/bin/claude-notifications"

      - name: Run install.sh unit tests
        run: bash bin/install_test.sh

      - name: Qualify real Go config and setup installers (isolated, offline)
        run: python3 scripts/config_e2e_test.py

      - name: Run config diagnostic and path safety regressions
        run: bash bin/shell_review_test.sh

      - name: Test Codex release gate selection
        run: sh scripts/codex-release-gate_test.sh

      - name: Run install.sh E2E tests (offline + mock)
        run: bash bin/install_e2e_test.sh

      - name: Run install.sh E2E diagnostics (real network)
        if: matrix.go == '1.26'
        run: bash bin/install_e2e_test.sh --real-network
        timeout-minutes: 5
        continue-on-error: true

  lint:
    if: github.event_name != 'workflow_dispatch'
    name: Lint
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m --max-same-issues=0
