                      output.write(chunk)
              archive.chmod(0o644)
              assert total == ARCHIVE_SIZE and digest(archive) == ARCHIVE_SHA
              dist = base/'cursor-dist';dist.mkdir(mode=0o755)
              dist.chmod(0o755)
              with tarfile.open(archive) as opened:
                  members = opened.getmembers()
                  assert len(members) == 580 and len({m.name for m in members}) == 580
                  for m in members:
                      parts = pathlib.PurePosixPath(m.name).parts
                      assert parts and not m.name.startswith('/') and '..' not in parts and '\\' not in m.name and (m.isfile() or m.isdir())
                  files = [m for m in members if m.isfile()]
                  paths = [pathlib.PurePosixPath(m.name).parts for m in files]
                  strip = 1 if len({p[0] for p in paths}) == 1 and all(len(p)>1 for p in paths) else 0
                  total = 0
                  for m in files:
                      target = dist.joinpath(*pathlib.PurePosixPath(m.name).parts[strip:])
                      directory = dist
                      for part in target.relative_to(dist).parts[:-1]:
                          directory = directory/part
                          if not directory.exists():
                              directory.mkdir(mode=0o755)
                              directory.chmod(0o755)
                      assert not target.exists() and 0 <= m.size <= 256<<20
                      stream = opened.extractfile(m)
                      body = stream.read(m.size+1)
                      assert len(body) == m.size
                      total += m.size;assert total <= 1<<30
                      target.write_bytes(body);target.chmod(m.mode & 0o777)
              tools = {}
              packages = {'strace':'strace','dbus-daemon':'dbus-daemon','dbus-monitor':'dbus-bin','dbus-send':'dbus-bin',
                          'dunst':'dunst','Xvfb':'xvfb','xauth':'xauth','nsenter':'util-linux','setpriv':'util-linux'}
              for name,package_name in packages.items():
                  path = pathlib.Path('/usr/bin')/name
                  assert path.resolve(strict=True) == path and stat.S_ISREG(path.stat().st_mode) and os.access(path,os.X_OK)
                  owner = run(['/usr/bin/dpkg-query','--search',str(path)]).decode().splitlines()
                  assert owner == [package_name+': '+str(path)], 'official standard package ownership'
                  metadata = run(['/usr/bin/dpkg-query','--show','--showformat=${binary:Package}\t${Version}\t${db:Status-Status}\n',package_name])
                  fields = metadata.decode().strip().split('\t')
                  assert len(fields) == 3 and fields[0] == package_name and fields[2] == 'installed'
                  tools[name] = {'path':str(path),'sha256':digest(path),'package':package_name,'version':fields[1],
                                 'installedMetadataSHA256':hashlib.sha256(metadata).hexdigest()}
              assert tools['strace']['version'] == '6.8-0ubuntu2'
              data = {'sourceSHA':SOURCE,'root':str(base.parent/'TEST-cursor-installed-one'),'artifact':str(dist),'stage':str(stage),
                      'package':str(package),'cursorArchive':str(archive),'buildInfo':str(build_info),
                      'machineID':pathlib.Path('/etc/machine-id').read_text().strip(),
                      'sha256':{name:digest(path) for name,path in (('primary',primary),('package',package),('buildInfo',build_info),('readbackHelper',helper),('readbackBuildInfo',bridge_info))},
                      'tools':tools,'displayNumber':99,'readbackHelper':str(helper),'readbackBuildInfo':str(bridge_info)}
              assert len(data) == 13 and not pathlib.Path(data['root']).exists()
              output = base/'execution-inputs.json';output.write_text(json.dumps(data,indent=2)+'\n');output.chmod(0o644)
              assert tracked() == before and run(['git','status','--porcelain=v1']) == b''
              (base/'tracked-protection.json').write_text(json.dumps(before,indent=2)+'\n')
              # Import only authenticated inert definitions. This calls input/source/FS
              # checks; it never calls main, native_run, CLI, a provider, or a session.
              import importlib.util
              spec = importlib.util.spec_from_file_location('exact_input_contract',carrier)
              module = importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
