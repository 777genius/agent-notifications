          """Proposed SAME-runner build/acquisition preparation. Not run in this job.

          Never starts Cursor, a notification/session service, the product CLI or the case.
          The only executed source-built helper is the existing package archive builder.
          """
          import ast
          import errno
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import tarfile
          import urllib.request

          SOURCE = '9f014e72af510783d58d00ad3d2db455a2f8117b'
          ARCHIVE_URL = 'https://downloads.cursor.com/lab/2026.09.28-64d2043/linux/x64/agent-cli-package.tar.gz'
          ARCHIVE_SHA = '6e4cd936a4866b8a77c50ff51a564460d715772fabc477a01aa0f0455d9559f0'
          ARCHIVE_SIZE = 182618248


          def run(argv, **kwargs):
              return subprocess.check_output(argv,timeout=300,**kwargs)


          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1<<20),b''): h.update(chunk)
              return h.hexdigest()


          def tracked():
              result = []
              for raw in run(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  p = pathlib.Path(os.fsdecode(raw)); f = p.lstat()
                  link = os.readlink(p) if p.is_symlink() else None
                  result.append({'path':str(p),'mode':f.st_mode,'link':link,
                                 'sha256':hashlib.sha256(os.fsencode(link)).hexdigest() if link is not None else digest(p)})
              return result


          def uid1000_access(member, needed):
              facts = member.lstat()
              assert stat.S_ISDIR(facts.st_mode) or stat.S_ISREG(facts.st_mode), 'unknown prerequisite object'
              try:
                  os.getxattr(member, 'system.posix_acl_access', follow_symlinks=False)
              except OSError as error:
                  assert error.errno == errno.ENODATA, 'unknown prerequisite ACL'
              else:
                  raise AssertionError('non-mode prerequisite ACL requires qualification')
              shift = 6 if facts.st_uid == 1000 else 3 if facts.st_gid == 1000 else 0
              assert ((facts.st_mode >> shift) & needed) == needed, 'UID1000 emptygroups cannot read/search: '+str(member)
              identity = (facts.st_dev, facts.st_ino, facts.st_mode, facts.st_uid, facts.st_gid,
                          facts.st_nlink, facts.st_size, facts.st_mtime_ns, facts.st_ctime_ns)
              again = member.lstat()
              assert identity == (again.st_dev, again.st_ino, again.st_mode, again.st_uid, again.st_gid,
                                  again.st_nlink, again.st_size, again.st_mtime_ns, again.st_ctime_ns), 'prerequisite changed'
              return {'path':str(member), 'identity':identity}


          def uid1000_readable(path, executable=False):
              """Conservative DAC prerequisite, not a privilege/namespace/exec probe."""
              path = pathlib.Path(path)
              assert path.is_absolute() and path.resolve(strict=True) == path, 'nonphysical prerequisite'
              rows = []
              for member in [*reversed(path.parents), path]:
                  directory = stat.S_ISDIR(member.lstat().st_mode)
                  assert directory or member == path, 'nondirectory prerequisite ancestor'
                  needed = 5 if directory or executable and member == path else 4
                  rows.append(uid1000_access(member, needed))
              return rows


          def readable_inputs(data, output, carrier):
              """All thirteen inputs retain their source/hash/authority contracts."""
              paths = {pathlib.Path(output):False, pathlib.Path(carrier):False,
                       pathlib.Path(data['root']).parent:False}
              for key in ('package','cursorArchive','buildInfo','readbackHelper','readbackBuildInfo'):
                  paths[pathlib.Path(data[key])] = key == 'readbackHelper'
              for key in ('artifact', 'stage'):
                  root = pathlib.Path(data[key])
                  members = [root, *root.rglob('*')]
                  assert len(members) <= 2048, 'bounded prerequisite tree'
                  for path in members:
                      paths[path] = path.is_file() and bool(path.lstat().st_mode & 0o111)
              for tool in data['tools'].values():
                  paths[pathlib.Path(tool['path'])] = True
              for binary in ('python3','bash','unshare','chown','dpkg-query'):
                  paths[(pathlib.Path('/usr/bin')/binary).resolve(strict=True)] = True
              # Native/session services also depend on standard dynamic libraries and
              # Python stdlib. Their runtime availability remains an actual launch gate.
              rows = {str(path):uid1000_readable(path, execute) for path,execute in sorted(paths.items())}
              assert not os.path.lexists(data['root']), 'fresh execution leaf required'
              return {'uid':1000, 'gid':1000, 'groups':[], 'paths':rows,
                      'claim':'current DAC metadata only; no execution, full authority or E proof'}


          def prepare(carrier, bridge_sha):
              assert run(['git','rev-parse','HEAD']).decode().strip() == SOURCE
              assert run(['git','status','--porcelain=v1']) == b''
              before = tracked()
              carrier = pathlib.Path(carrier).resolve(strict=True)
              tree = ast.parse(carrier.read_bytes())
              literal = next(n.value.args[0].value for n in tree.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id == 'READBACK_SOURCE_BYTES')
              import base64
              bridge = base64.b64decode(literal,validate=True)
              assert hashlib.sha256(bridge).hexdigest() == bridge_sha
              relative = '.research/tmp/TEST-cursor-readback-build'
              source_dir = pathlib.Path(relative)
              assert not os.path.lexists(source_dir)
              assert run(['git','ls-files','--',relative]) == b''
              # The only local exclusion is the exact authenticated operator build path.
              # Output and inputs live outside checkout. Preserve actual Go VCS stamping.
              exclude = pathlib.Path(run(['git','rev-parse','--git-path','info/exclude']).decode().strip())
              old = exclude.read_bytes() if exclude.exists() else b''
              assert b'\0' not in old
              marker = b'/'+relative.encode()+b'/\n'
              if marker not in old.splitlines(keepends=True):
                  exclude.write_bytes(old+(b'\n' if old and not old.endswith(b'\n') else b'')+marker)
              source_dir.mkdir(mode=0o700,parents=True)
              (source_dir/'authoritative_readback.go').write_bytes(bridge)
              assert tracked() == before and run(['git','status','--porcelain=v1']) == b''
              parent = pathlib.Path(os.environ['CURSOR_CASE_PARENT'])
              assert parent.parent == pathlib.Path('/tmp') and parent.name.startswith('TEST-cursor-installed-packet-')
              assert parent.resolve(strict=True) == parent and stat.S_IMODE(parent.stat().st_mode) == 0o1777
              assert parent.stat().st_uid == 0 and parent.stat().st_gid == 0
              uid1000_readable(parent)
              base = parent/'TEST-cursor-installed-preparation'
              assert not os.path.lexists(base)
              base.mkdir(mode=0o755)
              base.chmod(0o755)
              (base/'tracked-protection-before.json').write_text(json.dumps(before,indent=2)+'\n')
              stage = base/'stage';stage.mkdir(mode=0o755)
              stage.chmod(0o755)
              primary = stage/'claude-notifications-linux-amd64'
              helper = base/'authoritative-readback'
              builder = base/'build-portable-package'
              build_info = base/'primary-build-info.txt'
              bridge_info = base/'readback-build-info.txt'
              env = {**os.environ,'GOWORK':'off','CGO_ENABLED':'1'}
              for output,package,extra in ((primary,'./cmd/claude-notifications',['-ldflags','-s -w','-trimpath']),
                                         (helper,'./'+relative,['-ldflags','-X main.packetSourceSHA256='+bridge_sha]),
                                         (builder,'./cmd/build-portable-package',[])):
                  run(['go','build','-mod=readonly',*extra,'-o',str(output),package],env=env)
                  output.chmod(0o755)
                  if output in (primary,helper):
                      info = build_info if output == primary else bridge_info
                      info.write_bytes(run(['go','version','-m',str(output)]))
                      info.chmod(0o644)
