                  receipt = notifications['receipts'][0]
                  reply = receipt['reply']
                  assert reply['type'] == 2 and reply['signature'] == 'u' and reply['body'] == [receipt['notificationID']]
                  assert type(receipt['notificationID']) is int and 0 <= receipt['notificationID'] <= 4294967295
                  assert reply['header']['5'] == receipt['callSerial'] and reply['header']['6'] == receipt['sender']
                  assert reply['header']['7'] == notifications['owner']
                  webhook = load('webhook-actual.json')
