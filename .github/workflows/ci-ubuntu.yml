                  p.chmod(0o644)
                  data = p.read_bytes()
                  assert len(data) <= 65536 and ('vcs.revision='+SOURCE).encode() in data and b'vcs.modified=false' in data and b'=>\t' not in data
              package = base/'agent-notify-portable-linux-amd64.zip'
              run([str(builder),'-os','linux','-arch','amd64','-executable',str(primary),'-output',str(package),'-workdir',str(base/'portable-package')])
              package.chmod(0o644)
              archive = base/'agent-cli-package.tar.gz'
              request = urllib.request.Request(ARCHIVE_URL,headers={'User-Agent':'R363-exact-public-input-preparation'})
              with urllib.request.urlopen(request,timeout=30) as response, archive.open('xb') as output:
                  assert response.status == 200 and response.geturl() == ARCHIVE_URL, 'unexpected fixed archive redirect/status'
                  total = 0
                  while True:
                      chunk = response.read(1<<20)
                      if not chunk: break
                      total += len(chunk)
