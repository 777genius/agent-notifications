name: Ubuntu CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

# Only a newer run for the same PR supersedes its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opencode-plugin:
    name: OpenCode plugin bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: TEST-opencode-plugin-ci
    steps:
      - uses: actions/checkout@v7
        with:
          path: TEST-opencode-plugin-ci
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TEST-opencode-plugin-ci/opencode-plugin/package-lock.json
      - run: npm ci
        working-directory: TEST-opencode-plugin-ci/opencode-plugin
      - run: npm run check
        working-directory: TEST-opencode-plugin-ci/opencode-plugin
      - run: git diff --exit-code -- internal/opencodeplugin/dist/agent-notifications.js

  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Display Go version
        run: go version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          go test -timeout 20m -v -race -coverprofile=coverage-cmd.txt -covermode=atomic ./cmd/claude-notifications
          packages=$(go list ./...)
          remaining_packages=$(printf '%s\n' "$packages" | grep -Fvx 'github.com/777genius/agent-notifications/cmd/claude-notifications')
          mapfile -t remaining <<< "$remaining_packages"
          go test -timeout 20m -v -race -coverprofile=coverage-ubuntu-rest.txt -covermode=atomic "${remaining[@]}"
          { head -n 1 coverage-ubuntu-rest.txt; tail -n +2 coverage-ubuntu-rest.txt; tail -n +2 coverage-cmd.txt; } > coverage.txt

      - name: Upload coverage to Codecov
        if: matrix.go == '1.26'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build binary
        run: go build -o bin/claude-notifications ./cmd/claude-notifications

      - name: Test binary execution (help)
        run: ./bin/claude-notifications help

      - name: Qualify native selector bootstrap E2E (isolated, offline)
        id: selector-e2e
        if: matrix.go == '1.26'
        run: bash scripts/selector_e2e.sh "$RUNNER_TEMP/TEST-selector-e2e"

      - name: Upload selector bootstrap evidence
        if: always() && matrix.go == '1.26' && steps.selector-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selector-e2e-${{ runner.os }}
          path: ${{ runner.temp }}/TEST-selector-e2e
          if-no-files-found: error

      - name: Test one-line setup loader (isolated, offline)
        run: bash bin/setup_test.sh

      - name: Test python/node installer runtime fallback (isolated, offline)
        run: bash bin/installer_runtime_fallback_e2e_test.sh

      - name: Qualify interpreter-free artifact lifecycle
        if: matrix.go == '1.26'
        run: |
          bash bin/install_no_interpreters_test.sh "$PWD/bin/claude-notifications"
          bash bin/install_no_interpreters_lifecycle_test.sh "$PWD/bin/claude-notifications"

      - name: Run install.sh unit tests
        run: bash bin/install_test.sh

      - name: Qualify real Go config and setup installers (isolated, offline)
        run: python3 scripts/config_e2e_test.py

      - name: Run config diagnostic and path safety regressions
        run: bash bin/shell_review_test.sh

      - name: Test Codex release gate selection
        run: sh scripts/codex-release-gate_test.sh

      - name: Run install.sh E2E tests (offline + mock)
        run: bash bin/install_e2e_test.sh

      - name: Run install.sh E2E diagnostics (real network)
        if: matrix.go == '1.26'
        run: bash bin/install_e2e_test.sh --real-network
        timeout-minutes: 5
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m --max-same-issues=0
