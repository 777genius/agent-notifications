                      if phase == 'removed':
                          assert observed['mode'] == 'absent' and 'selected' not in observed
                          continue
                      assert observed['mode'] == ('remove-plan' if phase == 'pre-remove' else 'live')
                      assert observed['originalAuthority'] == authority and observed['originalNamespace'] == frozen['originalNamespace']
                      selected = observed['selected']
                      assert selected['profile_authority'] == authority and selected['profile_namespace'] == frozen['originalNamespace']
                      assert not selected.get('pending_native_intent') and not selected.get('native_activation_attempt')
                      expected = phase in ('enabled', 'native-enabled', 'duplicate')
                      assert observed['channels'] == {'Desktop': expected, 'Webhook': expected}
                      raw = load(phase + '-readback.json')
                      ledger_key = 'home/.config/agent-notifications/ownership.json'
                      ledger = strict_json(base64.b64decode(raw[ledger_key], validate=True))
                      assert not ledger.get('PendingMutation') and ledger['Generation'] == observed['consumerBinding']['Generation']
                  removal = load('removal-full-membership.json')
                  assert removal['unknownRemainders'] == [] and removal['objects'] and removal['stateMembership']
                  membership = removal['consumerMembership']
                  assert membership['selectedRemoved'] in membership['before'] and membership['selectedRemoved'] not in membership['after']
                  remove = load('remove.stdout')
                  inspect = load('removed-inspect.stdout')
                  assert remove['action'] == 'uninstall' and remove['outcome'] == 'completed' and not remove.get('nextActions')
                  selected = [r for r in inspect['targets'] if r['client'] == 'cursor' and r['unit'] == 'agent-notify']
                  assert inspect['outcome'] == 'completed' and len(selected) == 1 and selected[0]['outcome'] == 'absent' and not inspect.get('nextActions')
                  assert load('trace-readiness.json') and load('session-readiness.json') and load('session-controls.json')
                  notifications = load('notifications-actual.json')
