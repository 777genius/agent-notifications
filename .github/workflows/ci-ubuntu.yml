          SOURCE = '9f014e72af510783d58d00ad3d2db455a2f8117b'
          BRIDGE = '77030250348f8af0ee99878627b59c39cc7d658974c11adca67f7d98a4d4c8fc'
          FILE_LIMIT = 16 << 20
          TOTAL_LIMIT = 1 << 30
          ENTRY_LIMIT = 16384
          PREPARATION = ('execution-inputs.json', 'primary-build-info.txt',
                         'readback-build-info.txt', 'tracked-protection-before.json',
                         'tracked-protection.json', 'uid1000-readability.json')


          def strict_json(raw):
              def pairs(values):
                  value = dict(values)
                  assert len(value) == len(values), 'duplicate evidence JSON key'
                  return value
              return json.loads(raw.decode('utf-8'), object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError('nonfinite evidence JSON')))


          def identity(facts):
              return (facts.st_dev, facts.st_ino, facts.st_mode, facts.st_uid, facts.st_gid,
                      facts.st_nlink, facts.st_size, facts.st_mtime_ns, facts.st_ctime_ns)


          def open_directory(parent, name):
              assert name and '/' not in name and name not in ('.', '..')
              before = os.stat(name, dir_fd=parent, follow_symlinks=False)
              fd = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)
              try:
                  assert identity(before) == identity(os.fstat(fd)), 'directory changed during open'
              except BaseException:
                  os.close(fd)
                  raise
              return fd


          def read_at(parent, name):
              before = os.stat(name, dir_fd=parent, follow_symlinks=False)
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1, 'nonregular/linked evidence'
              assert 0 <= before.st_size <= FILE_LIMIT, 'evidence file bound'
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)
              with os.fdopen(fd, 'rb') as stream:
                  assert identity(before) == identity(os.fstat(stream.fileno())), 'evidence replacement'
                  raw = stream.read(before.st_size + 1)
                  assert len(raw) == before.st_size
                  assert identity(before) == identity(os.fstat(stream.fileno())), 'evidence changed during read'
              assert identity(before) == identity(os.stat(name, dir_fd=parent, follow_symlinks=False))
              return raw


          def read_path(parent, path):
              parts = pathlib.PurePosixPath(path).parts
              assert parts and not path.startswith('/') and all(p not in ('.', '..') for p in parts)
              fd = os.dup(parent)
              try:
                  for part in parts[:-1]:
                      child = open_directory(fd, part)
                      os.close(fd)
                      fd = child
                  return read_at(fd, parts[-1])
              finally:
                  os.close(fd)


          def result_gate(temp_fd, source_sha, runner_temp):
              """Require the existing actual final result, both phases, and readbacks."""
              inputs = strict_json(read_path(temp_fd, 'TEST-cursor-installed-preparation/execution-inputs.json'))
              assert inputs['sourceSHA'] == SOURCE
              case = open_directory(temp_fd, 'TEST-cursor-installed-one')
              try:
                  assert inputs['root'] == str(pathlib.Path(runner_temp) / 'TEST-cursor-installed-one')
                  assert hashlib.sha256(read_path(case, 'recipe/native_case.py')).hexdigest() == source_sha
                  assert hashlib.sha256(read_path(case, 'recipe/authoritative_readback.go')).hexdigest() == BRIDGE
                  load = lambda path: strict_json(read_path(case, 'evidence/' + path))
                  joined = load('namespace-join.json')
                  assert type(joined['outerExit']) is int and joined['outerExit'] == 0, 'outer exit failure'
                  assert joined['namespaceJoined'] is True and joined['forcedContainment'] is False, 'non-natural namespace join'
                  result = load('result.json')
                  assert result['status'] == 'PASS' and result.get('failure') is None
                  assert result['entry'] == 'installed-USER' and len(result['phases']) == 2
                  native_ids = []
                  for index, phase in enumerate(('enabled-native', 'disabled-restart')):
                      observed = load(phase + '/result.json')
                      assert observed == result['phases'][index] and observed['status'] == 'PASS' and observed['failure'] is None
                      assert type(observed['nativeExit']) is int and observed['nativeExit'] == 0
                      for field in ('parentNaturalExit', 'ownedNamespaceDescendantsJoined', 'nativeStopAck', 'nativeExecClose', 'terminalSent'):
                          assert observed[field] is True, 'missing native phase completion: ' + field
                      run = observed['actualNativeRun']
                      native_ids.append((run['conversation'], run['generation']))
                      assert all(type(v) is str and v for v in native_ids[-1])
                      raw = read_path(case, 'evidence/' + phase + '/native-consumed-stdin.json')
                      assert 0 < len(raw) <= 1 << 20
                      assert raw == read_path(case, 'evidence/' + phase + '/native-outer-consumed-stdin.bin')
                      hashed = hashlib.sha256(raw).hexdigest().encode() + b'\n'
                      for name in ('native-consumed-stdin.sha256', 'native-outer-consumed-stdin.sha256'):
                          assert read_path(case, 'evidence/' + phase + '/' + name) == hashed
                      stop = strict_json(raw)
                      assert (stop['conversation_id'], stop['generation_id']) == native_ids[-1]
                      for name in ('stdin-alias-trace.json', 'cleanup-process-snapshot.json', 'native-retained-object-boundaries.json', 'protocol.json', 'command.json'):
                          assert load(phase + '/' + name) is not None, 'missing phase evidence'
                  assert native_ids[0][0] != native_ids[1][0] and native_ids[0][1] != native_ids[1][1]
                  frozen = load('original-profile-authority.json')
                  authority = frozen['originalAuthority']
                  assert set(authority) == {'version', 'canonical_root', 'ancestry'} and authority['version'] == 1
                  assert authority['ancestry'] and all(set(a) == {'canonical_path', 'scheme', 'volume_id', 'object_id'} for a in authority['ancestry'])
                  binding = None
                  for phase in ('enabled', 'native-enabled', 'duplicate', 'disabled', 'updated', 'restarted', 'pre-remove', 'removed'):
