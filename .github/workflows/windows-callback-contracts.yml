name: Windows config sharing regression verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnostic only / native config preparation
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Verify bounded native sharing retries on private TEST inputs
        shell: pwsh
        run: |
          go test -race -run '^TestWindowsPrepare(WaitsForNativeSharingGap|NativeSharingGapHonorsDeadline)$' -v ./internal/config
          exit $LASTEXITCODE
      - name: Observe concurrent preparation with safe stage and errno
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'TEST-config-prepare-diagnostic'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          @{ scope = 'native-config-preparation-diagnostic'; sourceSHA = $env:GITHUB_SHA; fullNativeQualified = $false; releaseQualified = $false } | ConvertTo-Json | Set-Content (Join-Path $root 'scope.json')
          go test -race -failfast -count=100 -run 'TestStoreKilledLockOwner|TestPrepareTwoProcess' -v ./internal/config 2>&1 | Tee-Object -FilePath (Join-Path $root 'stress.log')
          exit $LASTEXITCODE
      - name: Verify complete config contract
        shell: pwsh
        run: |
          go test -race ./internal/config
          exit $LASTEXITCODE
      - name: Retain diagnostic result without granting qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-prepare-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/TEST-config-prepare-diagnostic
          if-no-files-found: error
          retention-days: 14
