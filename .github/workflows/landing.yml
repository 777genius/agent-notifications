name: Landing

on:
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml', 'scripts/stage-released-loader*', 'scripts/release-preflight*', 'README.md', 'docs/PLATFORM_RELEASE_CHANNELS.md', 'release-channels.tsv', 'bin/setup.sh', 'bin/release-channel.sh']
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml', 'scripts/stage-released-loader*', 'scripts/release-preflight*', 'README.md', 'docs/PLATFORM_RELEASE_CHANNELS.md', 'release-channels.tsv', 'bin/setup.sh', 'bin/release-channel.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize main deploys across push and manual dispatch; only supersede PR checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify published channel documentation before dependency installation
        run: node --experimental-strip-types ../scripts/release-preflight.mts --mode snapshot --root ..
      - name: Test release preflight contracts
        run: node --experimental-strip-types --test ../scripts/release-preflight.test.mts
      - run: npm ci
      - name: Typecheck release preflight tooling
        run: npx tsc --ignoreConfig --noEmit --strict --target es2023 --module nodenext --moduleResolution nodenext --allowImportingTsExtensions --types node --typeRoots node_modules/@types ../scripts/release-preflight.mts ../scripts/release-preflight.test.mts
      - run: npm run typecheck
      - run: npm run test
      - name: Verify release loader staging contract
        run: python3 ../scripts/stage-released-loader-test.py
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Keep public installer compatible with the published release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../scripts/stage-released-loader.py .output/public/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: notification-landing
          path: landing/.output/public
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: landing-test-results
          path: landing/test-results

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: notification-landing
          path: site
      - name: Rebuild legacy Markdown routes
        uses: actions/jekyll-build-pages@v1
        with:
          source: published
          destination: legacy-output
      - name: Preserve existing Pages content
        run: |
          test -f site/index.html
          mkdir artifact
          rsync -a --exclude='.git' published/ artifact/
          cp -a legacy-output/. artifact/
          cp -a site/. artifact/
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          for source in Path('published').rglob('*'):
              rel = source.relative_to('published')
              if '.git' in rel.parts or not source.is_file():
                  continue
              target = Path('artifact') / rel
              assert target.is_file(), f'Missing legacy path: {rel}'
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest(), f'Legacy path changed: {rel}'
          for source in Path('legacy-output').rglob('*'):
              rel = source.relative_to('legacy-output')
              if not source.is_file() or (Path('site') / rel).exists():
                  continue
              target = Path('artifact') / rel
              assert target.is_file() and source.read_bytes() == target.read_bytes(), f'Legacy rendered path changed: {rel}'
          PYTHON
          touch artifact/.nojekyll
      # Rerunning a failed deploy preserves artifacts from previous attempts.
      # Give each attempt its own Pages artifact and select it explicitly.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact
          include-hidden-files: true
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Smoke test the deployed Pages and retained installer
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PYTHON'
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          opener = build_opener(NoRedirect())
          paths = {
              '': 'Agent Notifications',
              'llms.txt': '# Agent Notifications',
              'auth.md': '# Authentication and permissions',
              'agents.md': '# Using Agent Notifications',
              'install.sh': '#!/usr/bin/env bash',
          }
          for attempt in range(24):
              try:
                  for path, marker in paths.items():
                      request = Request(base + path, headers={'User-Agent': 'agent-notifications-pages-e2e'})
                      with opener.open(request, timeout=10) as response:
                          assert response.status == 200, f'{path}: HTTP {response.status}'
                          media_type = response.headers.get_content_type()
                          if path in {'llms.txt', 'auth.md', 'agents.md'}:
                              assert media_type.startswith('text/') and media_type != 'text/html', f'{path}: {media_type}'
                          content = response.read(1048576).decode('utf-8', errors='replace')
                          assert marker in content, f'{path}: missing expected content'
                  print('Live Pages E2E passed:', base, ', '.join(paths))
                  break
              except (AssertionError, HTTPError, URLError, TimeoutError) as exc:
                  if attempt == 23:
                      raise SystemExit(f'Live Pages E2E failed after bounded retries: {exc}') from exc
                  time.sleep(5)
          PYTHON
