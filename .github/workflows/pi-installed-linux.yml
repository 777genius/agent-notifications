{
  "name": "TEST C5 installed Pi linux desktop and lifecycle",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "TEST-c5-pi-linux-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "linux": {
      "name": "Actual installed Pi / Linux desktop and lifecycle",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "env": {
        "GOWORK": "off",
        "GOTOOLCHAIN": "local",
        "CGO_ENABLED": "1",
        "SOURCE_SHA": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-go@v7",
          "with": {
            "go-version": "1.27.1"
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install existing native desktop and release build dependencies",
          "run": "sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev dbus-daemon dbus-bin dunst xvfb openbox xterm xdotool tmux pulseaudio pulseaudio-utils alsa-utils libasound2-plugins libnotify-bin ffmpeg fonts-dejavu-core"
        },
        {
          "name": "Validate qualification evidence guards",
          "run": "python -B scripts/test_pi_candidate_build.py -v\npython -B scripts/test_pi_qualification_aggregate.py -v\npython -B scripts/test_pi_installed_fixture.py -v\npython -B scripts/test_pi_loopback_fixture.py -v\npython -B scripts/test_pi_linux_lifecycle.py -v\ntest \"$(git rev-parse HEAD)\" = \"$SOURCE_SHA\"\n"
        },
        {
          "name": "Build exact clean pinned release candidate",
          "run": "python -B scripts/pi-candidate-build.py --platform linux --arch amd64 --output \"$RUNNER_TEMP/TEST-pi-candidate\"\nmkdir -p \"$RUNNER_TEMP/pi-installed-linux\"\ncp \"$RUNNER_TEMP/TEST-pi-candidate/build.json\" \"$RUNNER_TEMP/pi-installed-linux/build.json\"\n"
        },
        {
          "name": "Acquire immutable official Pi standalone",
          "run": "python -B scripts/acquire-pi-native.py --download --platform linux --arch amd64 \\\n  --output \"$RUNNER_TEMP/TEST-pi-host\" --report \"$RUNNER_TEMP/pi-installed-linux/acquisition.json\"\n"
        },
        {
          "name": "Actual normal setup native events and live lifecycle",
          "run": "python -B scripts/pi-installed-process-e2e.py \\\n  --candidate \"$RUNNER_TEMP/TEST-pi-candidate/stage/claude-notifications-linux-amd64\" \\\n  --runtime-stage \"$RUNNER_TEMP/TEST-pi-candidate/stage\" \\\n  --package \"$RUNNER_TEMP/TEST-pi-candidate/package-A.zip\" \\\n  --updated-package \"$RUNNER_TEMP/TEST-pi-candidate/package-B.zip\" \\\n  --replacement-runtime-stage \"$RUNNER_TEMP/TEST-pi-candidate/replacement-stage\" \\\n  --assets-root \"$GITHUB_WORKSPACE\" --pi-executable \"$RUNNER_TEMP/TEST-pi-host/pi/pi\" \\\n  --report \"$RUNNER_TEMP/pi-installed-linux/process.json\"\n"
        },
        {
          "name": "Actual TUI banners audio physical clicks and negative cases",
          "run": "python -B scripts/pi-installed-desktop-linux.py \\\n  --candidate \"$RUNNER_TEMP/TEST-pi-candidate/stage/claude-notifications-linux-amd64\" \\\n  --runtime-stage \"$RUNNER_TEMP/TEST-pi-candidate/stage\" \\\n  --package \"$RUNNER_TEMP/TEST-pi-candidate/package-A.zip\" \\\n  --assets-root \"$GITHUB_WORKSPACE\" --pi-executable \"$RUNNER_TEMP/TEST-pi-host/pi/pi\" \\\n  --report \"$RUNNER_TEMP/pi-installed-linux/desktop.json\"\n"
        },
        {
          "name": "Preserve actual candidate and native evidence on failure too",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "TEST-c5-pi-linux-installed-linux-7da3329d625eae9cdb29ce665f413e9fb9d03d3a",
            "path": "${{ runner.temp }}/TEST-pi-candidate/build.json\n${{ runner.temp }}/pi-installed-linux/**\n",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' && github.repository == '777genius/agent-notifications' && github.actor == '777genius' && github.triggering_actor == '777genius' && github.ref == 'refs/heads/test/pi-v150-c5-installed' }}"
    }
  }
}
