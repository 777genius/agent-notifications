name: Pi installed Linux product

on:
  pull_request:
    paths:
      - '.github/workflows/pi-installed-linux.yml'
      - 'scripts/pi-*'
      - 'scripts/test_pi_*'
      - 'tests/integration/pi_*'
      - 'cmd/claude-notifications/**'
      - 'internal/agentnotify/**'
      - 'internal/pievent/**'
      - 'internal/pisource/**'
      - 'internal/notifier/**'
      - 'portable-package/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pi-installed-linux-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Actual installed Pi / Linux
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing native desktop and release build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev dbus-daemon dbus-bin dunst xvfb openbox xterm xdotool pulseaudio pulseaudio-utils alsa-utils libasound2-plugins libnotify-bin ffmpeg fonts-dejavu-core
      - name: Validate qualification evidence guards
        run: |
          python -B scripts/test_pi_candidate_build.py -v
          python -B scripts/test_pi_qualification_aggregate.py -v
          python -B scripts/test_pi_installed_fixture.py -v
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build exact clean pinned release candidate
        run: |
          python -B scripts/pi-candidate-build.py --platform linux --arch amd64 --output "$RUNNER_TEMP/TEST-pi-candidate"
          mkdir -p "$RUNNER_TEMP/pi-installed-linux"
          cp "$RUNNER_TEMP/TEST-pi-candidate/build.json" "$RUNNER_TEMP/pi-installed-linux/build.json"
      - name: Acquire immutable official Pi standalone
        run: |
          python -B scripts/acquire-pi-native.py --download --platform linux --arch amd64 \
            --output "$RUNNER_TEMP/TEST-pi-host" --report "$RUNNER_TEMP/pi-installed-linux/acquisition.json"
      - name: Actual normal setup native events and live lifecycle
        run: |
          python -B scripts/pi-installed-process-e2e.py \
            --candidate "$RUNNER_TEMP/TEST-pi-candidate/stage/claude-notifications-linux-amd64" \
            --runtime-stage "$RUNNER_TEMP/TEST-pi-candidate/stage" \
            --package "$RUNNER_TEMP/TEST-pi-candidate/package-A.zip" \
            --updated-package "$RUNNER_TEMP/TEST-pi-candidate/package-B.zip" \
            --assets-root "$GITHUB_WORKSPACE" --pi-executable "$RUNNER_TEMP/TEST-pi-host/pi/pi" \
            --report "$RUNNER_TEMP/pi-installed-linux/process.json"
      - name: Actual TUI banners audio physical clicks and negative cases
        run: |
          python -B scripts/pi-installed-desktop-linux.py \
            --candidate "$RUNNER_TEMP/TEST-pi-candidate/stage/claude-notifications-linux-amd64" \
            --runtime-stage "$RUNNER_TEMP/TEST-pi-candidate/stage" \
            --package "$RUNNER_TEMP/TEST-pi-candidate/package-A.zip" \
            --assets-root "$GITHUB_WORKSPACE" --pi-executable "$RUNNER_TEMP/TEST-pi-host/pi/pi" \
            --report "$RUNNER_TEMP/pi-installed-linux/desktop.json"
      - name: Preserve actual candidate and native evidence on failure too
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-installed-linux-${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/TEST-pi-candidate/build.json
            ${{ runner.temp }}/pi-installed-linux/**
          if-no-files-found: error
          retention-days: 14
