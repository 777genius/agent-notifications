name: macOS CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      use_github_runner:
        description: Use GitHub-hosted runners for native macOS checks
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]

# Only a newer run for the same PR supersedes its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}

jobs:
  # Body/title edits create no canonical check names and cannot cancel full CI.
  scope:
    if: ${{ !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (scope)' || 'Classify macOS CI scope' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.release-scope.outputs.mode || steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative classification and installer mode contracts
        run: |
          python3 scripts/ci_macos_scope_test.py
          python3 -B tools/ci_release_scope_test.py
          bash bin/install_e2e_mode_test.sh
      - name: Classify exact PR revision (errors retain full CI)
        id: classify
        run: python3 scripts/ci_macos_scope.py classify
      - name: Classify release tooling only when native scope is full
        id: release-scope
        if: steps.classify.outputs.mode == 'full'
        run: python3 -B tools/ci_release_scope.py classify

  release-tools:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (release tools)' || 'Release tools scoped contract (macOS)' }}
    needs: scope
    if: needs.scope.outputs.mode == 'release-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix scripts/codex-offline-release-smoke ci
      - run: make release-tools-check
      - run: make release-preflight

  test:
    needs: scope
    if: ${{ !cancelled() && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'windows-only' && needs.scope.outputs.mode != 'release-tools' }}
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && format('Metadata edit ignored (macOS {0})', matrix.go) || format('Test on macOS ({0})', matrix.go) }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_github_runner && matrix.os || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'macos-15' && (vars.CI_MACOS_15_RUNNER || 'macos-15') || matrix.os == 'macos-26' && (vars.CI_MACOS_26_RUNNER || 'macos-26') || matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25'
            os: macos-15
          - go: '1.26'
            os: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Display Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Build binary
        run: go build -o bin/claude-notifications ./cmd/claude-notifications

      # Build first so installer units retain their wrapper presence assertion.
      # Their helpers use private sandboxes and ephemeral HTTP ports, while
      # test-env.sh preserves prepared Go caches. Wait for both suites before help.
      - parallel:
          - name: Run tests
            run: |
              skip_args=()
              if [ '${{ matrix.go }}' = '1.25' ]; then
                # Audited portable tests still run in the full Go 1.26 cell.
                # Exact names leave every unknown/new test enabled; all packages
                # and test files still compile in this single race-enabled run.
                skip_args=(-skip '^(TestWizardInstallOrUpdateBootstrapE2E|TestSetupWizardRepairMixedRevisionsKeepsSiblingE2E|TestSetupWizardTTYMixedRepairPlanShowsPerBindingDigestsE2E|TestGeminiEventTransportTotalBudget|TestWizardTTYAddSecondClientKeepProposesNewDefaults|TestWizardTTYKeepBoundMixedCancels)$')
              fi
              go test -timeout 20m -v -race -coverprofile=coverage.txt -covermode=atomic "${skip_args[@]}" ./...
          - name: Run install.sh unit tests
            run: bash bin/install_test.sh

      - name: Test binary execution (help)
        run: ./bin/claude-notifications help

      - name: Qualify native selector bootstrap E2E (isolated, offline)
        id: selector-e2e
        if: matrix.go == '1.26'
        run: bash scripts/selector_e2e.sh "$RUNNER_TEMP/TEST-selector-e2e"

      - name: Upload selector bootstrap evidence
        if: always() && matrix.go == '1.26' && steps.selector-e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selector-e2e-${{ runner.os }}
          path: ${{ runner.temp }}/TEST-selector-e2e
          if-no-files-found: error

      - name: Test python/node installer runtime fallback (isolated, offline)
        run: bash bin/installer_runtime_fallback_e2e_test.sh

      - name: Build sound preview binary
        run: go build -o bin/sound-preview ./cmd/sound-preview

      - name: Build list-sounds binary
        run: go build -o bin/list-sounds ./cmd/list-sounds

      - name: Check for system sounds
        run: |
          if [ -d "/System/Library/Sounds" ]; then
            echo "✓ System sounds directory found"
            find /System/Library/Sounds -maxdepth 1 -type f -name '*.aiff' -print | sed -n '1,3p'
          else
            echo "⚠ System sounds directory not found (expected on macOS)"
          fi

      # Both suites re-enter env -i with private HOME/XDG/TMPDIR. Only the
      # installer binds 18888; the loader uses curl stubs and no network port.
      # Native parallel waits for both children and propagates either failure.
      - parallel:
          - name: Test one-line setup loader (isolated, offline)
            run: bash bin/setup_test.sh
          - name: Run install.sh E2E tests (offline + mock)
            run: bash bin/install_e2e_test.sh

      - name: Run install.sh E2E diagnostics (real network)
        if: matrix.go == '1.26'
        run: bash bin/install_e2e_test.sh --real-network-only
        timeout-minutes: 5
        continue-on-error: true

  swift-test:
    needs: scope
    if: ${{ !cancelled() && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'windows-only' && needs.scope.outputs.mode != 'release-tools' }}
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (Swift)' || 'Swift notifier tests' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_github_runner && 'macos-15' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: swift test --package-path swift-notifier

  full-ci:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && 'Metadata edit ignored (full macOS gate)' || 'Full macOS CI required' }}
    needs: [scope, test, swift-test]
    if: ${{ always() && needs.scope.outputs.mode != 'release-tools' && !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require actual full native success on this revision
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_macos_scope.py gate test swift-test
