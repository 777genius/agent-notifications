name: Temporary UAP merged SDK checksum proof
on:
  push:
    branches: [fix/pin-merged-uap-group-sdk-20261106]
    paths: [.github/workflows/temporary-uap-merge-sums.yml]
permissions:
  contents: read
jobs:
  verified-module-sums:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.8'
          cache: false
      - name: Resolve immutable squash-merge modules from Go proxy and checksum database
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl@v0.1.1-0.20261106113838-982e7a619b32
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins@v0.0.0-20261106113838-982e7a619b32
