name: OpenCode 2.2.6 native source prequalification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/opencode-v226-source-e2e.py'
      - 'scripts/opencode-v226-clock-e0.mjs'
      - 'scripts/opencode-v226-darwin-abi-e0.mjs'
      - '.github/workflows/opencode-v226-source-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-v226-source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-source:
    # Do not execute code from untrusted forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify immutable official OpenCode 2.2.6
        id: official
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64-2.2.6.tar.gz"
          curl --fail --location --silent --show-error --max-time 120 --max-filesize 160000000 \
            'https://github.com/anomalyco/opencode/releases/download/v2.2.6/opencode-linux-x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' '08bb21d6326ce740d91cce7ebe88a6536933f6e1e30353b91a06b01f25da306c' "$archive" | sha256sum --check --status
      - name: Observe real native V2 source without delivery grants
        shell: bash
        run: |
          python -B scripts/opencode-v226-source-e2e.py \
            --archive "$RUNNER_TEMP/opencode-linux-x64-2.2.6.tar.gz" \
            --report "$RUNNER_TEMP/opencode-v226-source-safe.json"
      - name: Preserve only SHA-verified public archive for offline E2E analysis
        if: always() && steps.official.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-public-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-linux-x64-2.2.6.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Package the exact tracked source for offline native analysis
        if: steps.official.outcome == 'success'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git archive --format=tar.gz -o "$RUNNER_TEMP/agent-notifications-source.tar.gz" HEAD
      - name: Upload public source snapshot (non-release)
        if: steps.official.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: an-v226-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/agent-notifications-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Prepare pinned Go compiler for disposable test binary
        if: steps.official.outcome == 'success'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build exact-source unreleased Linux receiver
        if: steps.official.outcome == 'success'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CGO_ENABLED: '1'
          GOWORK: off
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/an-qualification-unreleased" ./cmd/claude-notifications
          go version -m "$RUNNER_TEMP/an-qualification-unreleased" | grep -F "vcs.revision=$EXPECTED_HEAD"
          go version -m "$RUNNER_TEMP/an-qualification-unreleased" | grep -F "vcs.modified=false"
      - name: Upload unreleased native test candidate (no qualification grant)
        if: steps.official.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: an-v226-unreleased-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/an-qualification-unreleased
          if-no-files-found: error
          retention-days: 1
      - name: Verify installed managed V2 refusal (never grant delivery)
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/opencode-v226-source-e2e.py \
            --archive "$RUNNER_TEMP/opencode-linux-x64-2.2.6.tar.gz" \
            --receiver "$RUNNER_TEMP/an-qualification-unreleased" \
            --report "$RUNNER_TEMP/opencode-v226-denied-safe.json"
      - name: Upload only sanitized installed-denial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-denied-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-denied-safe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe stock OpenCode 2.2.6 Bun/Go clock E0 without qualification grants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/TEST-opencode-v226-clock"
          python - <<'PY'
          import importlib.util, os, pathlib
          source = pathlib.Path('scripts/opencode-v226-source-e2e.py').resolve()
          spec = importlib.util.spec_from_file_location('source_e2e', source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          module.official_binary(root/'opencode-linux-x64-2.2.6.tar.gz',
                                 root/'TEST-opencode-v226-clock'/'opencode')
          PY
          env -i BUN_BE_BUN=1 PATH="$PATH" HOME="$RUNNER_TEMP/TEST-opencode-v226-clock" \
            "$RUNNER_TEMP/TEST-opencode-v226-clock/opencode" \
            "$GITHUB_WORKSPACE/scripts/opencode-v226-clock-e0.mjs" \
            "$RUNNER_TEMP/an-qualification-unreleased" \
            | tee "$RUNNER_TEMP/opencode-v226-clock-e0-safe.json"
      - name: Upload bounded stock-clock observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-clock-e0-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-clock-e0-safe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload closed source-only result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-native-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-source-safe.json
          if-no-files-found: warn
          retention-days: 14

  darwin-arm64-image:
    name: darwin-arm64-native (${{ matrix.os }})
    # Image/Bun discovery only, no native clock admission or notifications.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify official Darwin arm64 2.2.6 archive, executable and Bun
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          curl --fail --location --silent --show-error --max-time 120 --max-filesize 150000000 \
            'https://github.com/anomalyco/opencode/releases/download/v2.2.6/opencode-darwin-arm64.zip' \
            --output "$RUNNER_TEMP/opencode-darwin-arm64.zip"
          printf '%s  %s\n' '15491608f6b0bc4debe5eac35eab629a2b07ea9a1fbac68ad53bcea59fcc4b45' \
            "$RUNNER_TEMP/opencode-darwin-arm64.zip" | shasum -a 256 --check --status
          python - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = root / 'TEST-opencode-v226-darwin'
          target.mkdir(mode=0o700)
          with zipfile.ZipFile(root / 'opencode-darwin-arm64.zip') as archive:
              matches = [info for info in archive.infolist()
                         if not info.is_dir() and pathlib.PurePosixPath(info.filename).name == 'opencode']
              if len(matches) != 1:
                  raise RuntimeError('official_macos_image_not_unique')
              info = matches[0]
              kind = (info.external_attr >> 16) & 0o170000
              if kind not in (0, stat.S_IFREG) or not 0 < info.file_size <= 350000000:
                  raise RuntimeError('official_macos_image_type_or_size')
              binary = target / 'opencode'
              with archive.open(info) as source, binary.open('xb') as output:
                  total = 0
                  while data := source.read(1048576):
                      total += len(data)
                      if total > 350000000:
                          raise RuntimeError('official_macos_image_extraction_limit')
                      output.write(data)
          binary.chmod(0o700)
          with binary.open('rb') as source:
              image_sha = hashlib.file_digest(source, 'sha256').hexdigest()
          env = {'BUN_BE_BUN': '1', 'HOME': str(target),
                 'TMPDIR': str(target), 'PATH': os.environ.get('PATH', '/usr/bin:/bin')}
          result = subprocess.run([str(binary), '--version'], env=env,
                                  capture_output=True, text=True, timeout=20, cwd=target)
          if result.returncode or result.stdout.strip() != '1.4.4':
              raise RuntimeError('official_macos_bun_unverified')
          safe = {'status':'observed_image_only', 'platform':'darwin', 'arch':'arm64',
                  'hostVersion':'2.2.6', 'embeddedBunVersion':'1.4.4',
                  'officialArchiveSHA256':'15491608f6b0bc4debe5eac35eab629a2b07ea9a1fbac68ad53bcea59fcc4b45',
                  'officialExecutableSHA256':image_sha,
                  'nativeObserverQualified':False, 'nativeClockQualified':False,
                  'notificationDeliveryQualified':False}
          (root/'opencode-v226-darwin-image-safe.json').write_text(json.dumps(safe, sort_keys=True) + '\n')
          print(json.dumps(safe, sort_keys=True))
          PY
      - name: Upload only fixed image/Bun observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-darwin-arm64-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-darwin-image-safe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build exact-source Darwin Go clock witness (non-release)
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Compile native witness and verify clean candidate SHA
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CGO_ENABLED: '1'
          GOWORK: off
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/TEST-opencode-v226-darwin/receiver" ./cmd/claude-notifications
          go version -m "$RUNNER_TEMP/TEST-opencode-v226-darwin/receiver" | grep -F "vcs.revision=$EXPECTED_HEAD"
          go version -m "$RUNNER_TEMP/TEST-opencode-v226-darwin/receiver" | grep -F 'vcs.modified=false'
      - name: Observe real macOS ARM64 V2 source and installed-denied events
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/opencode-v226-source-e2e.py \
            --archive "$RUNNER_TEMP/opencode-darwin-arm64.zip" \
            --receiver "$RUNNER_TEMP/TEST-opencode-v226-darwin/receiver" \
            --report "$RUNNER_TEMP/opencode-v226-darwin-denied-safe.json"
      - name: Upload sanitized macOS source/denial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-darwin-denied-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-darwin-denied-safe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe genuine Bun 1.4.4 Darwin FFI/Go E0 (never grant notifications)
        shell: bash
        run: |
          set -euo pipefail
          env -i BUN_BE_BUN=1 PATH="/usr/bin:/bin" \
            HOME="$RUNNER_TEMP/TEST-opencode-v226-darwin" TMPDIR="$RUNNER_TEMP/TEST-opencode-v226-darwin" \
            "$RUNNER_TEMP/TEST-opencode-v226-darwin/opencode" \
            "$GITHUB_WORKSPACE/scripts/opencode-v226-darwin-abi-e0.mjs" \
            "$RUNNER_TEMP/TEST-opencode-v226-darwin/receiver" \
            | tee "$RUNNER_TEMP/opencode-v226-darwin-ffi-e0-safe.json"
      - name: Upload closed Darwin FFI E0 observation only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-v226-darwin-ffi-e0-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opencode-v226-darwin-ffi-e0-safe.json
          if-no-files-found: warn
          retention-days: 14
