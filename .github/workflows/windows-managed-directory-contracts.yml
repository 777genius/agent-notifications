# Focused real-filesystem regression gate; full main CI remains mandatory.
name: Windows managed directory filesystem contracts
on:
  pull_request:
    paths:
      - 'internal/installruntime/**'
      - 'internal/agentnotify/setup/**'
      - 'cmd/claude-notifications/agent_notify_setup*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-managed-directory-contracts.yml'
permissions:
  contents: read
jobs:
  real-filesystem-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 repository pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile exact baseline overlays and current filesystem/setup test binaries
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CGO_ENABLED: '1'
          CC: 'C:\mingw64\bin\gcc.exe'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "TEST-managed-directory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root | Out-Null
          $privateLogs = Join-Path $root 'private-logs'
          New-Item -ItemType Directory -Path $privateLogs | Out-Null
          "TEST_FS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $evidence = [ordered]@{ sourceSHA=$env:SOURCE_SHA; baselineSHA='25b956732717d86a3bdb7fea9bef86ce1f6c4940';
            baselineKind='exact baseline archive plus head lock_windows_test.go overlay';
            setupBaselineSHA='a0ee25796a5312b829a55e24303e5578d848cd46';
            setupBaselineKind='exact a0ee archive plus head CLI admission test overlay';
            filesystemOnly=$true; installedCallbackQualified=$false; qualified=$false; actors=@() }
          # Redirect to files rather than inherited output pipes. A successful exit is
          # insufficient until both files can be opened exclusively and boundedly read.
          function Invoke-Owned([string]$name, [string]$exe, [string[]]$arguments, [string]$cwd, [int]$seconds) {
            $out = Join-Path $privateLogs "$name.stdout.txt"
            $err = Join-Path $privateLogs "$name.stderr.txt"
            $fact = [ordered]@{ name=$name; collected=$false; streamsCollected=$false; timedOut=$false;
              unknown=$true; exitCode=$null; bounded=$false }
            $p = $null
            try {
              $p = Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $cwd -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
              if (!$p.WaitForExit($seconds * 1000)) {
                $fact.timedOut = $true
                try { $p.Kill($true) } catch { }
                if (!$p.WaitForExit(5000)) { return $fact }
              }
              $fact.collected = $true
              $p.Refresh()
              $fact.exitCode = $p.ExitCode
              if ($null -eq $fact.exitCode) { return $fact }
              $handles = @()
              try {
                foreach ($file in @($out, $err)) {
                  $handles += [IO.File]::Open($file, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
                }
                $fact.streamsCollected = $true
                $fact.stdoutBytes = $handles[0].Length
                $fact.stderrBytes = $handles[1].Length
                $fact.bounded = (($handles[0].Length + $handles[1].Length) -le 65536)
                if ($fact.bounded) {
                  foreach ($i in @(0, 1)) {
                    $suffix = @('stdout', 'stderr')[$i]
                    $destination = [IO.File]::Open((Join-Path $root "$name.$suffix.txt"), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                    try { $handles[$i].CopyTo($destination) } finally { $destination.Dispose() }
                  }
                }
              } finally { foreach ($h in $handles) { $h.Dispose() } }
              $fact.unknown = $false
              if ($fact.bounded) {
                $fact.stdoutSHA256 = (Get-FileHash -LiteralPath "$root/$name.stdout.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
                $fact.stderrSHA256 = (Get-FileHash -LiteralPath "$root/$name.stderr.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            } catch { $fact.unknown = $true }
            finally {
              if ($null -ne $p) { $p.Dispose() }
              # Raw/uncollected/unbounded output is never matched by artifact paths.
              # Failed actors retain TEST scratch until disposable CI job teardown.
              $evidence.actors += $fact
              $evidence | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath "$root/evidence.json" -Encoding utf8
            }
            return $fact
          }
          function Require-Collected($fact, [int]$code) {
            if (!$fact.collected -or !$fact.streamsCollected -or $fact.unknown -or $fact.timedOut -or !$fact.bounded -or $fact.exitCode -ne $code) {
              throw "owned filesystem actor did not qualify: $($fact.name)"
            }
          }
          function Source-Digest([string]$directory, [string]$revision) {
            # The exact tree enumerates dangling links too; never traverse a link target.
            $evidence.lastSourceDigestOperation = 'tree_inventory'
            $entries = @(git -c core.quotePath=false ls-tree -r --full-tree $revision)
            if ($LASTEXITCODE -ne 0 -or $entries.Count -eq 0) { throw 'source tree inventory failed' }
            $lines = foreach ($entry in ($entries | Sort-Object -CaseSensitive)) {
              if ($entry -notmatch '^(100644|100755|120000) blob ([0-9a-f]{40})\t([^\t\r\n]+)$') { throw 'unsupported source tree entry' }
              $mode, $oid, $relative = $Matches[1], $Matches[2], $Matches[3]
              if ($relative.StartsWith('"')) { throw 'quoted source path unsupported' }
              $file = Join-Path $directory $relative
              $item = [IO.FileInfo]::new($file)
              $evidence.lastSourceDigestOperation = 'link_target_metadata'
              $target = $item.LinkTarget
              if ($mode -eq '120000') {
                if ($null -ne $target) {
                  # LinkTarget is raw metadata: a missing target must remain admissible.
                  $kind = 'real-link'
                  $payload = [Text.Encoding]::UTF8.GetBytes($target)
                } else {
                  $evidence.lastSourceDigestOperation = 'emulated_link_metadata'
                  $attributes = $item.Attributes
                  if ($attributes -eq -1 -or ($attributes -band [IO.FileAttributes]::Directory)) { throw 'missing/directory emulated link' }
                  if ($attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'unclassified source reparse point' }
                  if ($item.Length -gt 32768) { throw 'emulated link payload over bound' }
                  $kind = 'emulated-link-file'
                  $evidence.lastSourceDigestOperation = 'emulated_link_payload_read'
                  $payload = [IO.File]::ReadAllBytes($file)
                }
                $evidence.lastSourceDigestOperation = 'link_payload_verification'
                if ($payload.Length -eq 0 -or $payload.Length -gt 32768) { throw 'source link payload outside bound' }
                # Git's blob OID binds committed raw link bytes; emulation must not
                # add CRLF or point at the target's contents. No URL/path normalization.
                $header = [Text.Encoding]::ASCII.GetBytes("blob $($payload.Length)`0")
                $actualOID = [Convert]::ToHexString([Security.Cryptography.SHA1]::HashData([byte[]]($header + $payload))).ToLowerInvariant()
                if ($actualOID -cne $oid) { throw 'source link differs from committed payload' }
                $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($payload)).ToLowerInvariant()
              } else {
                $evidence.lastSourceDigestOperation = 'regular_file_metadata'
                $attributes = $item.Attributes
                if ($attributes -eq -1 -or ($attributes -band [IO.FileAttributes]::Directory)) { throw 'missing/directory regular source' }
                if ($null -ne $target -or ($attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'regular source replaced by link' }
                $kind = 'regular-file'
                $evidence.lastSourceDigestOperation = 'regular_content_hash'
                $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              "$mode`0$oid`0$relative`0$kind`0$hash"
            }
            $evidence.lastSourceDigestOperation = 'source_digest_complete'
            $bytes = [Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          }
          $headObserved = $false
          $baselineObserved = $false
          $setupBaselineObserved = $false
          try {
            if ((git rev-parse HEAD) -cne $env:SOURCE_SHA -or $LASTEXITCODE -ne 0) { throw 'head source mismatch' }
            $status = git status --porcelain
            if ($LASTEXITCODE -ne 0 -or $status) { throw 'head source is dirty or unobserved' }
            $evidence.sourceDigestKind = 'exact committed mode/blob plus actual checkout representation/content; links never followed'
            $evidence.headSourceBefore = Source-Digest $env:GITHUB_WORKSPACE $env:SOURCE_SHA
            $headObserved = $true
            $evidence.baselineTree = git rev-parse "$($evidence.baselineSHA)^{tree}"
            if ($LASTEXITCODE -ne 0) { throw 'exact baseline is unavailable' }
            $archive = Join-Path $root 'baseline.tar'
            git archive --format=tar --output=$archive $evidence.baselineSHA
            if ($LASTEXITCODE -ne 0) { throw 'exact baseline archive failed' }
            $evidence.baselineArchiveSHA256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $baseline = Join-Path $root 'baseline'
            New-Item -ItemType Directory -Path $baseline | Out-Null
            tar -xf $archive -C $baseline
            if ($LASTEXITCODE -ne 0) { throw 'baseline extraction failed' }
            $test = 'internal/installruntime/lock_windows_test.go'
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $test) -Destination (Join-Path $baseline $test)
            $evidence.overlayTestSHA256 = (Get-FileHash -LiteralPath (Join-Path $baseline $test) -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence.baselineOverlayBefore = Source-Digest $baseline $evidence.baselineSHA
            $baselineObserved = $true
            $evidence.setupBaselineTree = git rev-parse "$($evidence.setupBaselineSHA)^{tree}"
            if ($LASTEXITCODE -ne 0) { throw 'exact setup baseline is unavailable' }
            $setupArchive = Join-Path $root 'setup-baseline.tar'
            git archive --format=tar --output=$setupArchive $evidence.setupBaselineSHA
            if ($LASTEXITCODE -ne 0) { throw 'exact setup baseline archive failed' }
            $evidence.setupBaselineArchiveSHA256 = (Get-FileHash -LiteralPath $setupArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            $setupBaseline = Join-Path $root 'setup-baseline'
            New-Item -ItemType Directory -Path $setupBaseline | Out-Null
            tar -xf $setupArchive -C $setupBaseline
            if ($LASTEXITCODE -ne 0) { throw 'setup baseline extraction failed' }
            $setupTest = 'cmd/claude-notifications/agent_notify_setup_admission_windows_test.go'
            $evidence.setupOverlaySourceSHA256 = (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $setupTest) -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $setupTest) -Destination (Join-Path $setupBaseline $setupTest)
            # This new test is absent from the baseline tree: bind it separately
            # as well as hashing every original archive member before/after.
            $evidence.setupOverlayTestBefore = (Get-FileHash -LiteralPath (Join-Path $setupBaseline $setupTest) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($evidence.setupOverlayTestBefore -cne $evidence.setupOverlaySourceSHA256) { throw 'setup overlay differs from exact head test' }
            $evidence.setupBaselineBefore = Source-Digest $setupBaseline $evidence.setupBaselineSHA
            $setupBaselineObserved = $true
            $go = (Get-Command go).Source
            $evidence.goVersion = & $go version
            if ($LASTEXITCODE -ne 0) { throw 'Go version observation failed' }
            # Use the image's existing MinGW, as normal Windows CI/release does.
            # No downloads, compiler fallback, or ARM64/emulated qualification.
            $evidence.runnerArchitecture = $env:RUNNER_ARCH
            $evidence.osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            $evidence.processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            if ($env:RUNNER_ARCH -cne 'X64' -or $evidence.osArchitecture -cne 'X64' -or $evidence.processArchitecture -cne 'X64') {
              throw 'native x64 Windows filesystem runner required'
            }
            $fact = Invoke-Owned 'go-build-environment' $go @('env', '-json', 'GOOS', 'GOARCH', 'GOHOSTOS', 'GOHOSTARCH', 'CGO_ENABLED', 'CC') $env:GITHUB_WORKSPACE 10
            Require-Collected $fact 0
            $buildEnv = [IO.File]::ReadAllText("$root/go-build-environment.stdout.txt") | ConvertFrom-Json
            $evidence.goBuildEnvironment = $buildEnv
            if ($buildEnv.GOOS -cne 'windows' -or $buildEnv.GOHOSTOS -cne 'windows' -or $buildEnv.GOARCH -cne 'amd64' -or
                $buildEnv.GOHOSTARCH -cne 'amd64' -or $buildEnv.CGO_ENABLED -cne '1' -or $buildEnv.CC -cne $env:CC) {
              throw 'Go native x64 CGO environment mismatch'
            }
            $evidence.compilerSHA256 = (Get-FileHash -LiteralPath $env:CC -Algorithm SHA256).Hash.ToLowerInvariant()
            $fact = Invoke-Owned 'c-compiler-target' $env:CC @('-dumpmachine') $env:GITHUB_WORKSPACE 10
            Require-Collected $fact 0
            $evidence.compilerTarget = [IO.File]::ReadAllText("$root/c-compiler-target.stdout.txt").Trim()
            if ($evidence.compilerTarget -cne 'x86_64-w64-mingw32') { throw 'MinGW x64 Windows compiler target required' }
            $fact = Invoke-Owned 'c-compiler-version' $env:CC @('-dumpfullversion') $env:GITHUB_WORKSPACE 10
            Require-Collected $fact 0
            $evidence.compilerVersion = [IO.File]::ReadAllText("$root/c-compiler-version.stdout.txt").Trim()
            if ($evidence.compilerVersion -notmatch '^[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw 'compiler version observation invalid' }
            foreach ($case in @(@{name='old'; directory=$baseline}, @{name='new'; directory=$env:GITHUB_WORKSPACE})) {
              $exe = Join-Path $root "$($case.name)-installruntime.test.exe"
              # Build and execution are distinct: a compiler failure cannot count as RED.
              $fact = Invoke-Owned "$($case.name)-compile" $go @('test', '-c', '-mod=readonly', '-trimpath', '-o', ('"' + $exe + '"'), './internal/installruntime') $case.directory 240
              Require-Collected $fact 0
              $evidence["$($case.name)BinarySHA256"] = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $old = Invoke-Owned 'old-test' (Join-Path $root 'old-installruntime.test.exe') @('-test.v', '-test.run=^TestWindowsLockCreatesPrivateManagedSuffix$', '-test.timeout=45s', '-test.count=1') $baseline 60
            Require-Collected $old 1
            $oldText = [IO.File]::ReadAllText("$root/old-test.stdout.txt") + [IO.File]::ReadAllText("$root/old-test.stderr.txt")
            if ($oldText -notmatch '(?m)^=== RUN   TestWindowsLockCreatesPrivateManagedSuffix\r?$' -or
                $oldText -notmatch '(?m)^--- FAIL: TestWindowsLockCreatesPrivateManagedSuffix \([0-9.]+s\)\r?$' -or
                $oldText -notmatch 'managed inode DACL grants foreign access' -or $oldText -match 'panic:|test timed out|no tests to run') {
              throw 'baseline did not observe the required named foreign-ACL failure'
            }
            $evidence.baselineNamedForeignACLFailure = $true
            $names = @('TestWindowsLockCreatesPrivateManagedSuffix', 'TestWindowsLockRefusesForeignDirectoryWithoutRepair',
              'TestWindowsLockDirectoryCreationRace', 'TestWindowsLockRejectsReparseDirectory',
              'TestPrivateWindowsHandleForeignReadOnlyACE', 'TestLockWithInheritedForeignReadOnlyACE',
              'TestCanonicalPrivateWindowsDescriptor', 'TestCanonicalPrivateWindowsDescriptorSystemUser', 'TestLockRequiresDeadline')
            $pattern = '^(' + ($names -join '|') + ')$'
            $new = Invoke-Owned 'new-test' (Join-Path $root 'new-installruntime.test.exe') @('-test.v', "-test.run=$pattern", '-test.timeout=60s', '-test.count=1') $env:GITHUB_WORKSPACE 90
            Require-Collected $new 0
            $newText = [IO.File]::ReadAllText("$root/new-test.stdout.txt") + [IO.File]::ReadAllText("$root/new-test.stderr.txt")
            foreach ($name in $names) {
              if ($newText -notmatch ('(?m)^=== RUN   ' + $name + '\r?$')) { throw "required test did not run: $name" }
              $terminal = '(?m)^--- PASS: ' + $name + ' \([0-9.]+s\)\r?$'
              # Only the real symlink prerequisite may be unsupported on this identity.
              if ($name -eq 'TestWindowsLockRejectsReparseDirectory') {
                $terminal = '(?m)^--- (PASS|SKIP): ' + $name + ' \([0-9.]+s\)\r?$'
              }
              if ($newText -notmatch $terminal) { throw "required terminal test observation missing: $name" }
            }
            foreach ($case in @(@{name='old-setup'; directory=$setupBaseline}, @{name='new-setup'; directory=$env:GITHUB_WORKSPACE})) {
              $exe = Join-Path $root "$($case.name).test.exe"
              $fact = Invoke-Owned "$($case.name)-compile" $go @('test', '-c', '-mod=readonly', '-trimpath', '-o', ('"' + $exe + '"'), './cmd/claude-notifications') $case.directory 240
              Require-Collected $fact 0
              $evidence["$($case.name)BinarySHA256"] = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $setupName = 'TestWindowsSetupGlobalConfigAdmissionDiagnostic'
            $oldSetup = Invoke-Owned 'old-setup-test' (Join-Path $root 'old-setup.test.exe') @('-test.v', "-test.run=^$setupName$", '-test.timeout=60s', '-test.count=1') $setupBaseline 90
            Require-Collected $oldSetup 1
            $oldSetupText = [IO.File]::ReadAllText("$root/old-setup-test.stdout.txt") + [IO.File]::ReadAllText("$root/old-setup-test.stderr.txt")
            if ($oldSetupText -notmatch "(?m)^=== RUN   $setupName/foreign_mutation_true\r?$" -or
                $oldSetupText -notmatch "(?m)^--- FAIL: $setupName \([0-9.]+s\)\r?$" -or
                $oldSetupText -notmatch "(?m)^\s+--- PASS: $setupName/foreign_mutation_false \([0-9.]+s\)\r?$" -or
                $oldSetupText -notmatch "(?m)^\s+--- FAIL: $setupName/foreign_mutation_true \([0-9.]+s\)\r?$" -or
                $oldSetupText -notmatch 'missing/wrong measured diagnostic: \{"reason":"policy_commit_failed","generation":3\}' -or
                $oldSetupText -match 'panic:|test timed out|no tests to run' -or
                [regex]::Matches($oldSetupText, '(?m)^\s+[^\r\n]+\.go:[0-9]+: ').Count -ne 1) {
              throw 'setup baseline did not observe only the required missing-attribution boundary'
            }
            $evidence.setupBaselineNamedMissingDiagnosticFailure = $true
            $newSetup = Invoke-Owned 'new-setup-test' (Join-Path $root 'new-setup.test.exe') @('-test.v', "-test.run=^$setupName$", '-test.timeout=60s', '-test.count=1') $env:GITHUB_WORKSPACE 90
            Require-Collected $newSetup 0
            $newSetupText = [IO.File]::ReadAllText("$root/new-setup-test.stdout.txt") + [IO.File]::ReadAllText("$root/new-setup-test.stderr.txt")
            if ($newSetupText -notmatch "(?m)^--- PASS: $setupName \([0-9.]+s\)\r?$" -or
                $newSetupText -match 'panic:|test timed out|no tests to run') { throw 'new setup contract did not pass' }
            foreach ($subcase in @('foreign_mutation_false', 'foreign_mutation_true')) {
              if ($newSetupText -notmatch "(?m)^=== RUN   $setupName/$subcase\r?$" -or
                  $newSetupText -notmatch "(?m)^\s+--- PASS: $setupName/$subcase \([0-9.]+s\)\r?$") {
                throw 'required actual setup subcase did not pass'
              }
            }
            $evidence.setupAdmissionSubcasesPassed = $true
            $evidence.setupBaselineAfter = Source-Digest $setupBaseline $evidence.setupBaselineSHA
            $evidence.setupOverlayTestAfter = (Get-FileHash -LiteralPath (Join-Path $setupBaseline $setupTest) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($evidence.setupBaselineBefore -cne $evidence.setupBaselineAfter -or $evidence.setupOverlayTestBefore -cne $evidence.setupOverlayTestAfter) {
              throw 'setup baseline/overlay changed during compilation/execution'
            }
            $evidence.headSourceAfter = Source-Digest $env:GITHUB_WORKSPACE $env:SOURCE_SHA
            $evidence.baselineOverlayAfter = Source-Digest $baseline $evidence.baselineSHA
            $status = git status --porcelain
            if ($LASTEXITCODE -ne 0 -or $status -or $evidence.headSourceBefore -cne $evidence.headSourceAfter -or $evidence.baselineOverlayBefore -cne $evidence.baselineOverlayAfter) {
              throw 'test source changed during compilation/execution'
            }
            $evidence.reparseSkipped = ($newText -match '(?m)^--- SKIP: TestWindowsLockRejectsReparseDirectory ')
            if ($evidence.reparseSkipped -and $newText -notmatch 'TEST symlink creation unsupported') { throw 'unknown reparse skip' }
            $evidence.qualified = $true
          } finally {
            if ($evidence.Contains('lastSourceDigestOperation') -and $evidence.lastSourceDigestOperation -cne 'source_digest_complete') {
              $evidence.sourceDigestFailureOperation = $evidence.lastSourceDigestOperation
            }
            # Record exact source observations even after a refused phase.
            try {
              if ($headObserved) { $evidence.headSourceAfter = Source-Digest $env:GITHUB_WORKSPACE $env:SOURCE_SHA }
              if ($baselineObserved) { $evidence.baselineOverlayAfter = Source-Digest $baseline $evidence.baselineSHA }
              if ($setupBaselineObserved) {
                $evidence.setupBaselineAfter = Source-Digest $setupBaseline $evidence.setupBaselineSHA
                $evidence.setupOverlayTestAfter = (Get-FileHash -LiteralPath (Join-Path $setupBaseline $setupTest) -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($evidence.setupBaselineBefore -cne $evidence.setupBaselineAfter -or $evidence.setupOverlayTestBefore -cne $evidence.setupOverlayTestAfter) { $evidence.qualified = $false }
              }
              if ($evidence.headSourceBefore -cne $evidence.headSourceAfter -or $evidence.baselineOverlayBefore -cne $evidence.baselineOverlayAfter) { $evidence.qualified = $false }
            } catch { $evidence.sourceAfterUnknown = $true; $evidence.qualified = $false }
            $evidence | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath "$root/evidence.json" -Encoding utf8
          }
          if (!$evidence.qualified) { throw 'filesystem source/collection gate did not qualify' }
      - name: Retain bounded filesystem evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 repository pin
        with:
          name: windows-managed-directory-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TEST-managed-directory-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json
            ${{ runner.temp }}/TEST-managed-directory-${{ github.run_id }}-${{ github.run_attempt }}/*.stdout.txt
            ${{ runner.temp }}/TEST-managed-directory-${{ github.run_id }}-${{ github.run_attempt }}/*.stderr.txt
          if-no-files-found: error
          retention-days: 14
