name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, platform: linux, runner: ubuntu-24.04 }
          - { language: go, platform: macos, runner: macos-15 }
          - { language: go, platform: windows, runner: windows-2022 }
          - { language: python, platform: linux, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: '1.25.8'
      - name: Install Linux native dependencies
        if: matrix.language == 'go' && matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go source
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}/platform:${{ matrix.platform }}
