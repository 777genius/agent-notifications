name: Explicit paired Windows audio admission TEST
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.sha }}
      PI_WINDOWS_HOST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
    steps:
      - name: Preserve canonical bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Prepare native compiler
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Native compiler unavailable' }
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64 >nul && set'
          cmd.exe /d /s /c $cmd | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE) { throw 'Native compiler setup failed' }
      - name: Run reviewed finite fresh-host and exact endpoint preparation
        id: host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/pi-paired-admission" | Out-Null
          & ./scripts/pi-windows-host.ps1 -Root "$env:RUNNER_TEMP/pi-paired-admission/host"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Admit the unchanged real WinMM cue through the explicitly bound peer
        shell: pwsh
        env:
          AUDIO_FIXTURE: ${{ steps.host.outputs.audio_fixture }}
        run: |
          python -B scripts/pi-native-preflight.py --execute-test-fixtures --platform windows --source-sha "$env:SOURCE_SHA" --windows-audio-fixture "$env:AUDIO_FIXTURE" --report "$env:RUNNER_TEMP/pi-paired-admission/prerequisites.json"
          exit $LASTEXITCODE
      - name: Preserve only diagnostic evidence without vendor binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-paired-admission-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pi-paired-admission/**/*.json
            ${{ runner.temp }}/pi-paired-admission/**/*.log
          if-no-files-found: error
          retention-days: 14
