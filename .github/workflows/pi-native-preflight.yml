name: Pi native desktop prerequisites

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_client_runner:
        description: Existing Windows Client runner label; empty uses the repository override or hosted Windows 11 ARM
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prerequisites:
    name: Pi native prerequisites / ${{ matrix.lane }}
    runs-on: ${{ matrix.platform == 'linux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04') || matrix.platform == 'darwin' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15') || matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, lane: linux}
          - {platform: darwin, lane: darwin}
          - {platform: windows, lane: windows-server, runner: windows-2025}
          - platform: windows
            lane: windows-client
            runner: ${{ inputs.windows_client_runner || vars.CI_PI_WINDOWS_DESKTOP_RUNNER || 'windows-11-vs2026-arm' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject incomplete prerequisite evidence
        run: python -B scripts/test_pi_native_preflight.py -v
      - name: Install controlled Linux desktop and audio fixtures
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dbus-daemon dbus-bin dunst xvfb openbox xterm xdotool pulseaudio pulseaudio-utils alsa-utils libasound2-plugins libnotify-bin ffmpeg fonts-dejavu-core
      - name: Prepare native Windows compiler environment
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Visual Studio prerequisite unavailable' }
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=' + $arch + ' -host_arch=' + $arch + ' >nul && set'
          cmd.exe /d /s /c $cmd | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler environment unavailable' }
      - name: Observe GUI audio and native input prerequisites
        shell: pwsh
        env:
          PI_PREFLIGHT_PLATFORM: ${{ matrix.platform }}
          PI_PREFLIGHT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'pi-native-preflight/evidence.json'
          python -B scripts/pi-native-preflight.py --execute-test-fixtures --platform $env:PI_PREFLIGHT_PLATFORM --source-sha $env:PI_PREFLIGHT_SOURCE --report $report
          exit $LASTEXITCODE
      - name: Preserve prerequisite receipt on pass or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-native-prerequisites-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pi-native-preflight/evidence.json
          if-no-files-found: error
          retention-days: 14
