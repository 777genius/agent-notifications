name: Pi native desktop prerequisites

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_client_runner:
        description: Existing Windows Client runner label; empty uses the repository override or hosted Windows 11 ARM
        type: string
        required: false

      prepare_host:
        description: Prepare one fresh owner-dispatched hosted ARM Client with the authenticated virtual capture fixture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prerequisites:
    name: Pi native prerequisites / ${{ matrix.lane }}
    runs-on: ${{ matrix.platform == 'linux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04') || matrix.platform == 'darwin' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15') }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, lane: linux}
          - {platform: darwin, lane: darwin}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Resolve the interpreter actually used on this image
        id: native_python
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          executable = Path(sys.executable).resolve(strict=True)
          if not executable.is_file() or not os.access(executable, os.X_OK):
              raise SystemExit('Actual Python executable unavailable')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + str(executable) + '\n')
          PY
      - name: Reject incomplete prerequisite evidence
        run: python -B scripts/test_pi_native_preflight.py -v
      - name: Install controlled Linux desktop and audio fixtures
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dbus-daemon dbus-bin dunst xvfb openbox xterm xdotool pulseaudio pulseaudio-utils alsa-utils libasound2-plugins libnotify-bin ffmpeg fonts-dejavu-core
      - name: Observe GUI audio and native input prerequisites
        shell: pwsh
        env:
          PI_PREFLIGHT_PLATFORM: ${{ matrix.platform }}
          PI_PREFLIGHT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHON_EXECUTABLE: ${{ steps.native_python.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = $env:PYTHON_EXECUTABLE
          if (!$python -or !(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Setup Python physical executable unavailable' }
          $report = Join-Path $env:RUNNER_TEMP 'pi-native-preflight/evidence.json'
          & $python -B scripts/pi-native-preflight.py --execute-test-fixtures --platform $env:PI_PREFLIGHT_PLATFORM --source-sha $env:PI_PREFLIGHT_SOURCE --report $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Native preflight did not produce its receipt' }
          exit 0
      - name: Preserve prerequisite receipt on pass or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-native-prerequisites-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pi-native-preflight/evidence.json
          if-no-files-found: error
          retention-days: 14

  # The default hosted Client needs explicit owner preparation. PR compile and
  # real process coverage lives in pi-installed-windows.yml; this native receipt
  # remains a manual gate, and never supplies a product-qualification receipt.
  windows-prerequisites:
    if: github.event_name == 'workflow_dispatch' && github.repository == '777genius/agent-notifications' && github.actor == '777genius' && github.triggering_actor == '777genius'
    name: Owner native gate / Windows Client prerequisites
    runs-on: ${{ inputs.windows_client_runner || vars.CI_PI_WINDOWS_DESKTOP_RUNNER || 'windows-11-vs2026-arm' }}
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Preserve canonical source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: inputs.prepare_host
        with:
          node-version: '24.21.0'
      - name: Prepare the native image compiler
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Native compiler unavailable' }
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=' + $arch + ' -host_arch=' + $arch + ' >nul && set'
          cmd.exe /d /s /c $cmd | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE) { throw 'Native compiler setup failed' }
      - name: Prepare only the fresh owner-dispatched hosted Client fixture
        if: inputs.prepare_host
        id: host_preparation
        shell: pwsh
        env:
          PI_WINDOWS_HOST_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/pi-native-preflight" -Force | Out-Null
          & ./scripts/pi-windows-host.ps1 -Root "$env:RUNNER_TEMP/pi-native-preflight/host"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Require the original real WinMM cue and native input observations
        shell: pwsh
        env:
          PI_WINDOWS_AUDIO_FIXTURE: ${{ steps.host_preparation.outputs.audio_fixture }}
        run: |
          python -B scripts/test_pi_windows_audio_fixture.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $audioArgs = @()
          if ($env:PI_WINDOWS_AUDIO_FIXTURE) { $audioArgs = @('--windows-audio-fixture', $env:PI_WINDOWS_AUDIO_FIXTURE) }
          python -B scripts/pi-native-preflight.py --execute-test-fixtures --platform windows --source-sha "$env:SOURCE_SHA" --report "$env:RUNNER_TEMP/pi-native-preflight/evidence.json" @audioArgs
          exit $LASTEXITCODE
      - name: Preserve explicit prerequisite evidence without claiming product qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-native-prerequisites-windows-client-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pi-native-preflight/**/*.json
            ${{ runner.temp }}/pi-native-preflight/**/*.log
            ${{ steps.host_preparation.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
