name: Temporary SDK integrationctl checksum qualification 595
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  checksum:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/group-known-targets-595-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify matching integrationctl module and record Go-certified sums
        shell: bash
        run: |
          set -euo pipefail
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl@v0.1.1-0.20261105121437-628cbe51f268 > "$RUNNER_TEMP/integrationctl-module.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("VERIFIED_INTEGRATIONCTL_SUMS", d["Path"], d["Version"], d["Sum"], d["GoModSum"])' "$RUNNER_TEMP/integrationctl-module.json"
          go mod tidy
          echo BEGIN_GO_MOD_SUM_DIFF
          git diff -- go.mod go.sum
          echo END_GO_MOD_SUM_DIFF
          go test ./internal/agentnotify/portablesetup -run '^TestGroupUpdateCodexLocalPreservesUnselectedClaude$' -count=1
