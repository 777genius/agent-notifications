name: Temporary SDK checksum qualification 595
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  checksum:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/group-known-targets-595-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify upstream module and print Go-certified sums
        shell: bash
        run: |
          set -euo pipefail
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins@v0.0.0-20261105121437-628cbe51f268 > "$RUNNER_TEMP/sdk-module.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("SDK_MODULE_SUMS", d["Path"], d["Version"], d["Sum"], d["GoModSum"])' "$RUNNER_TEMP/sdk-module.json"
          go mod tidy
          echo "BEGIN_GO_MOD_SUM_DIFF"
          git diff -- go.mod go.sum
          echo "END_GO_MOD_SUM_DIFF"
