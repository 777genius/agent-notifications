name: Navigation Windows packaged native TEST callback
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-windows-msix-native-e2e.yml'
      - 'tests/integration/navigation_windows_msix_probe.cpp'
      - 'tests/integration/navigation_windows_native_probe.cpp'
      - 'tests/integration/navigation_windows_native_e2e.ts'
      - 'tests/integration/navigation_windows_msix_e2e.ts'
      - 'tests/integration/navigation_windows_vendor_sdk_test.h'
      - 'tests/integration/navigation_windows_vendor_acquisition.ts'
  workflow_dispatch:
    inputs:
      mode:
        description: 'One fresh disposable TEST job; unknown effects are never replayed'
        type: choice
        default: compile_only
        options: [compile_only, prepare_only, native_callback, oobe_then_msix_callback, oobe_then_msix_vendor_callback]
permissions:
  contents: read
# Supersede only older checks for this PR; dispatch runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-client:
    runs-on: windows-11-vs2026-arm
    # New manual composition adds bounded acquisition/signature/Add/Remove outside the UI lease.
    timeout-minutes: 25
    env:
      AGENT_NOTIFY_NAVIGATION_WINDOWS_E2E: '1'
      NAVIGATION_WINDOWS_RUNNER: windows-11-vs2026-arm
      NAVIGATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NAVIGATION_WINDOWS_MSIX_MODE: ${{ inputs.mode || 'compile_only' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing v7 pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # existing v6.5.0 pin
        with:
          node-version: '24.21.0'
      - name: Exact source and pinned TypeScript
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:NAVIGATION_SOURCE_SHA) { throw 'checkout SHA mismatch' }
          Write-Host "Source=$env:NAVIGATION_SOURCE_SHA Image=$env:ImageVersion Node=$(node --version)"
          npm ci --prefix opencode-plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'locked tooling install failed' }
          & ./opencode-plugin/node_modules/.bin/tsc.cmd --ignoreConfig --noEmit --allowImportingTsExtensions --strict --target ES2023 --module ESNext --moduleResolution bundler --types node --typeRoots ./opencode-plugin/node_modules/@types tests/integration/navigation_windows_msix_e2e.ts tests/integration/navigation_windows_native_e2e.ts
          if ($LASTEXITCODE -ne 0) { throw 'packaged harness typecheck failed' }
      - name: Compile both native fixtures with static CRT
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'installed Visual Studio prerequisite unavailable' }
          foreach ($kind in @('native', 'msix')) {
            $out = Join-Path $env:RUNNER_TEMP "navigation-$kind-probe.exe"
            $source = Join-Path $env:GITHUB_WORKSPACE "tests\integration\navigation_windows_${kind}_probe.cpp"
            $log = Join-Path $env:RUNNER_TEMP "navigation-$kind-imports.log"
            $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64 && cl /nologo /std:c++20 /MT /EHsc /W4 /DUNICODE /D_UNICODE "' + $source + '" /Fe:"' + $out + '" /Fo:"' + $env:RUNNER_TEMP + '\navigation-' + $kind + '-probe.obj" /link windowsapp.lib ole32.lib oleaut32.lib shell32.lib propsys.lib advapi32.lib user32.lib uuid.lib uiautomationcore.lib && dumpbin /headers /dependents "' + $out + '" > "' + $log + '"'
            cmd.exe /d /s /c $cmd
            if ($LASTEXITCODE -ne 0) { throw 'native compile/import inspection failed' }
            $imports = Get-Content -LiteralPath $log -Raw
            if ($imports -notmatch 'AA64 machine' -or $imports -match '(?i)(VCRUNTIME|MSVCP|Microsoft\.WindowsAppRuntime).*\.dll') { throw 'unsupported architecture/framework dependency' }
            Get-FileHash -LiteralPath tests/integration/navigation_windows_vendor_sdk_test.h, tests/integration/navigation_windows_vendor_acquisition.ts -Algorithm SHA256 | Format-Table
            Write-Host "$kind SHA256=$((Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash)"
          }
      - name: Parse the fixed operator with target Windows PowerShell
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath tests/integration/navigation_windows_msix_e2e.ts -Raw
          $match = [regex]::Match($text, '(?s)const operator = String\.raw`(?<script>.*?)`;')
          if (!$match.Success) { throw 'embedded fixed operator absent' }
          $tokens = $null
          $errors = $null
          $null = [Management.Automation.Language.Parser]::ParseInput($match.Groups['script'].Value, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'target operator parse failed' }
      - name: One finite OOBE setup on this same disposable desktop
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'oobe_then_msix_callback' || inputs.mode == 'oobe_then_msix_vendor_callback')
        id: bootstrap
        shell: pwsh
        env:
          NAVIGATION_WINDOWS_PREFLIGHT_ONLY: '1'
          NAVIGATION_WINDOWS_OOBE_SETUP_TEST: '1'
          NAVIGATION_WINDOWS_CENTER_SURFACE: '0'
          NAVIGATION_WINDOWS_TASKBAR_UIA: '0'
          NAVIGATION_WINDOWS_DESKTOP_CAPTURE_TEST: '0'
          NAVIGATION_WINDOWS_OOBE_PREFLIGHT_TEST: '0'
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -ne '1' -or $env:GITHUB_REPOSITORY -cne '777genius/agent-notifications') { throw 'first manual owned TEST attempt required' }
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
          $observer = Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe'
          $before = (Get-FileHash -LiteralPath $observer -Algorithm SHA256).Hash.ToLowerInvariant()
          node --experimental-strip-types tests/integration/navigation_windows_native_e2e.ts $observer
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap failed/unknown; no package effects or repeat' }
          if ((Get-Item -LiteralPath $env:GITHUB_OUTPUT).Length -gt 4096) { throw 'bootstrap output exceeds bound' }
          $lines = [IO.File]::ReadAllLines($env:GITHUB_OUTPUT)
          if ($lines.Count -ne 1 -or !$lines[0].StartsWith('evidence_root=')) { throw 'single bootstrap output absent' }
          $root = $lines[0].Substring('evidence_root='.Length)
          $evidencePath = Join-Path $root 'evidence.json'
          if ((Get-Item -LiteralPath $evidencePath).Length -gt 131072) { throw 'bootstrap evidence exceeds bound' }
          $e = [IO.File]::ReadAllText($evidencePath) | ConvertFrom-Json
          if ($e.status -cne 'guest_setup_complete' -or !$e.oobeSetupQualified -or !$e.captureQualified -or
              $e.binarySHA256 -cne $before -or $e.sourceSHA -cne $env:NAVIGATION_SOURCE_SHA -or
              $e.'capture-after-preflight.json'.session -ne $session -or
              [Security.Principal.WindowsIdentity]::GetCurrent().User.Value -cne $sid -or
              (Get-FileHash -LiteralPath $observer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $before) { throw 'bootstrap identity changed' }
          $handoff = @{ root=$root; nonce=$e.nonce; sourceSHA=$env:NAVIGATION_SOURCE_SHA;
            runID=$env:GITHUB_RUN_ID; job=$env:GITHUB_JOB; attempt=$env:GITHUB_RUN_ATTEMPT;
            userSid=$sid; session=$session; observerSHA256=$before;
            evidenceSHA256=(Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant();
            recordsSHA256=(Get-FileHash -LiteralPath (Join-Path $root 'oobe-setup-records.json') -Algorithm SHA256).Hash.ToLowerInvariant() }
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($handoff | ConvertTo-Json -Depth 4))
          if ($bytes.Length -gt 65536) { throw 'handoff exceeds bound' }
          $file = [IO.File]::Open((Join-Path $root 'same-job-bootstrap.json'), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $file.Write($bytes, 0, $bytes.Length); $file.Flush($true) } finally { $file.Dispose() }
      - name: Explicit preparation diagnostic or single packaged cold COM callback
        # PR checks compile the fixtures; each native submission needs an explicit run.
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'prepare_only' || inputs.mode == 'native_callback' || ((inputs.mode == 'oobe_then_msix_callback' || inputs.mode == 'oobe_then_msix_vendor_callback') && steps.bootstrap.outcome == 'success'))
        id: probe
        shell: pwsh
        env:
          NAVIGATION_WINDOWS_OOBE_BOOTSTRAP_ROOT: ${{ steps.bootstrap.outputs.evidence_root }}
        run: |
          node --experimental-strip-types tests/integration/navigation_windows_msix_e2e.ts (Join-Path $env:RUNNER_TEMP 'navigation-msix-probe.exe') (Join-Path $env:RUNNER_TEMP 'navigation-native-probe.exe')
          if ($LASTEXITCODE -ne 0) { throw 'selected TEST phase failed or prerequisite unavailable; inspect retained evidence' }
      - name: Preserve bounded bootstrap evidence independently of callback
        if: always() && steps.bootstrap.outputs.evidence_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: navigation-windows-msix-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.bootstrap.outputs.evidence_root }}/.owned-test-root
            ${{ steps.bootstrap.outputs.evidence_root }}/evidence.json
            ${{ steps.bootstrap.outputs.evidence_root }}/oobe-setup-records.json
            ${{ steps.bootstrap.outputs.evidence_root }}/same-job-bootstrap.json
            ${{ steps.bootstrap.outputs.evidence_root }}/center-policy.json
            ${{ steps.bootstrap.outputs.evidence_root }}/preflight.json
            ${{ steps.bootstrap.outputs.evidence_root }}/capture-preflight.json
            ${{ steps.bootstrap.outputs.evidence_root }}/capture-after-preflight.json
            ${{ steps.bootstrap.outputs.evidence_root }}/desktop-capture-intent.json
            ${{ steps.bootstrap.outputs.evidence_root }}/desktop-capture.json
            ${{ steps.bootstrap.outputs.evidence_root }}/desktop-capture.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Preserve partial owned TEST evidence
        if: always() && steps.probe.outputs.evidence_root != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing v7.0.1 pin
        with:
          name: navigation-windows-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.mode == 'prepare_only' && format('{0}/.owned-test-root', steps.probe.outputs.evidence_root) || steps.probe.outputs.evidence_root }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/evidence.json', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/controller-progress.json', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/prepare-trace.json', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/package-operator-state.json', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/operator-context.json', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/navigation-native-imports.log', steps.probe.outputs.evidence_root) || '' }}
            ${{ inputs.mode == 'prepare_only' && format('{0}/navigation-msix-imports.log', steps.probe.outputs.evidence_root) || '' }}
            !${{ steps.probe.outputs.evidence_root }}/client.msix
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
