name: One-shot source-pinned Windows callback signed archive intake
on:
  push:
    branches: [ci/win-callback-dispatch-20261031]
    paths: ['.github/workflows/windows-callback-dispatch-one-shot.yml']
permissions:
  contents: read
  actions: write
jobs:
  signed-archive-intake:
    if: ${{ github.repository == '777genius/agent-notifications' && github.event.head_commit.message == 'ci(windows) signed archive intake f00b56b' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit only fresh read-only signed official archive intake
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='f00b56b36850053c649f61293ccb31da72d24ab2'
          parent='228ca171b4a0b4c10222571e7c8b87ba0f160958'
          current="$(gh api repos/777genius/agent-notifications/git/ref/heads/test/windows-installed-cold-callback -q .object.sha)"
          actualParent="$(gh api repos/777genius/agent-notifications/git/ref/heads/feat/windows-callback-installed -q .object.sha)"
          if [[ "$current" != "$target" || "$actualParent" != "$parent" ]]; then
            echo 'Source or production parent changed; refuse signed intake' >&2
            exit 1
          fi
          gh api --method POST repos/777genius/agent-notifications/actions/workflows/windows-callback-contracts.yml/dispatches \
            -f ref=test/windows-installed-cold-callback \
            -f 'inputs[admission]=one-fresh-disposable-installed-callback' \
            -f 'inputs[phase]=archive_intake' \
            -f 'inputs[scenario]=basic' \
            -f 'inputs[coreRef]='
          echo 'Only signed archive intake dispatched. No package installation, Show or click admitted.'
