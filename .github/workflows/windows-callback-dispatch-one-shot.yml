name: One-shot source-pinned Windows callback signed archive intake
on:
  push:
    branches: [ci/win-callback-dispatch-20261031]
    paths: ['.github/workflows/windows-callback-dispatch-one-shot.yml']
permissions:
  contents: read
  actions: write
jobs:
  signed-intake:
    if: ${{ github.repository == '777genius/agent-notifications' && github.event.head_commit.message == 'ci(windows) intake 9e8c9938 source-bound signed archive' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch one read-only signed archive intake on the exact PR source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source='9e8c9938709b9e43888bf7c57fc320cfd506684d'
          parent='30968141e49596c2207b9c42c5546bbc57539a4c'
          current="$(gh api repos/777genius/agent-notifications/git/ref/heads/test/windows-installed-cold-callback -q .object.sha)"
          currentParent="$(gh api repos/777genius/agent-notifications/git/ref/heads/feat/windows-callback-installed -q .object.sha)"
          if [[ "$current" != "$source" || "$currentParent" != "$parent" ]]; then
            echo 'Parent or source changed; fail closed without dispatch' >&2
            exit 1
          fi
          gh api --method POST repos/777genius/agent-notifications/actions/workflows/windows-callback-contracts.yml/dispatches \
            -f ref=test/windows-installed-cold-callback \
            -f 'inputs[admission]=one-fresh-disposable-installed-callback' \
            -f 'inputs[phase]=archive_intake' \
            -f 'inputs[scenario]=basic' \
            -f 'inputs[coreRef]='
          echo 'Dispatched one new source-pinned read-only signed archive intake; no installation or click.'
