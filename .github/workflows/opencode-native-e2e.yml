name: OpenCode native webhook E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/opencode-native-e2e.yml'
      - 'scripts/opencode-native-e2e.py'
      - 'scripts/opencode-private-root-windows.go'
      - 'cmd/claude-notifications/**'
      - 'internal/**'
      - 'opencode-plugin/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  native-webhook:
    name: OpenCode ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            binary: claude-notifications-darwin-arm64
            archive: opencode-darwin-arm64.zip
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
            binary: claude-notifications-darwin-amd64
            archive: opencode-darwin-x64.zip
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            binary: claude-notifications-linux-arm64
            archive: opencode-linux-arm64.tar.gz
          - runner: ubuntu-22.04
            platform: linux
            arch: amd64
            binary: claude-notifications-linux-amd64
            archive: opencode-linux-x64.tar.gz
          - runner: windows-latest
            platform: windows
            arch: amd64
            binary: claude-notifications-windows-amd64.exe
            archive: opencode-windows-x64.zip

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Linux build dependency
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build native candidate and fetch exact OpenCode CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BINARY: ${{ matrix.binary }}
          OPENCODE_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          CGO_ENABLED=1 go build -ldflags="-s -w" -trimpath -buildvcs=true -o "candidate/$CANDIDATE_BINARY" ./cmd/claude-notifications
          gh release download v1.18.33 --repo anomalyco/opencode \
            --pattern "$OPENCODE_ARCHIVE" --dir candidate

      - name: Run isolated native OpenCode turns and revocation check
        shell: bash
        env:
          CANDIDATE_BINARY: ${{ matrix.binary }}
          OPENCODE_ARCHIVE: ${{ matrix.archive }}
          CANDIDATE_OS: ${{ matrix.platform }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python scripts/opencode-native-e2e.py \
            --binary "candidate/$CANDIDATE_BINARY" \
            --archive "candidate/$OPENCODE_ARCHIVE" \
            --os "$CANDIDATE_OS" --arch "$CANDIDATE_ARCH" \
            --report candidate/opencode-native-e2e.json

      - name: Upload concise evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-native-e2e-${{ matrix.platform }}-${{ matrix.arch }}
          path: candidate/opencode-native-e2e.json
          if-no-files-found: warn
          retention-days: 14
