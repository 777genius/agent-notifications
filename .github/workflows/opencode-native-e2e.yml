name: OpenCode installed dual native E2E (qualification required)
on:
  workflow_dispatch:
    inputs:
      evidence_url:
        description: 'HTTPS parent evidence tar sealed after exact clean source checkout/build; no SDK copies or grants'
        type: string
        required: true
      evidence_sha256:
        description: 'Reviewed SHA256 of that immutable external evidence tar'
        type: string
        required: true
  pull_request:
    paths:
      - '.github/workflows/opencode-native-e2e.yml'
      - 'scripts/opencode-native-e2e.py'
      - 'scripts/testdata/opencode-native-e2e/**'
      - 'scripts/opencode-private-root-windows.go'
      - 'cmd/claude-notifications/**'
      - 'internal/**'
      - 'opencode-plugin/**'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  native:
    name: '${{ matrix.target.platform }}/${{ matrix.target.arch }} ${{ matrix.version }}'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.33', '2.0.21']
        target:
          - {runner: ubuntu-22.04, platform: linux, arch: amd64}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64}
          - {runner: macos-15, platform: darwin, arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: amd64}
          - {runner: windows-latest, platform: windows, arch: amd64}
        include:
          - version: '1.18.34'
            target: {runner: ubuntu-22.04, platform: linux, arch: amd64}
    env:
      AN_EVIDENCE_URL: ${{ inputs.evidence_url }}
      AN_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      AN_OS: ${{ matrix.target.platform }}
      AN_ARCH: ${{ matrix.target.arch }}
      AN_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: {go-version: '1.27', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Initialize unqualified report before any fixture check
        shell: bash
        run: |
          mkdir -p .task-tools/artifacts
          python -c 'import json,pathlib; pathlib.Path(".task-tools/artifacts/native-report.json").write_text(json.dumps({"status":"unqualified","businessPhasesStarted":False,"firstFailedPrerequisite":"fixture_checks_not_completed"})+"\n")'
      - name: Inert fixture parser checks
        run: python -B scripts/testdata/opencode-native-e2e/test_fixture.py
      - name: Linux build and private bus prerequisites
        if: matrix.target.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev dbus iproute2
      - name: Stage immutable external parent artifacts
        id: parent
        shell: bash
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --stage-evidence
      - name: Verify exact source, clean build and bundle/SDK bytes before any host
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py
      - name: Preserve managed native and Windows path protocol checks
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/opencodeinstall -run 'Test.*(Native|Shortcut|Desktop)'
      - name: Guard and execute exact reviewed installed fixture
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: |
          set -euo pipefail
          export AN_SUITE=smoke
          if [ "$AN_OS/$AN_ARCH" = linux/amd64 ]; then export AN_SUITE=full; fi
          if [ "$AN_OS" = linux ]; then
            sudo --preserve-env=PATH,AN_MANIFEST,AN_MANIFEST_SHA256,AN_OS,AN_ARCH,AN_VERSION,AN_SUITE unshare --net -- bash -c 'ip link set lo up; python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --execute'
          else
            python -B scripts/testdata/opencode-native-e2e/ci_inputs.py --execute
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencode-native-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.version }}
          path: .task-tools/artifacts/native-report.json
          if-no-files-found: error
          retention-days: 14
