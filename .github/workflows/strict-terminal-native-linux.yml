name: Strict terminal native X11 click E2E

on:
  pull_request:
    paths:
      - '.github/workflows/strict-terminal-native-linux.yml'
      - 'internal/daemon/**'
      - 'internal/notifier/**'
      - 'internal/notification/**'
      - 'internal/config/**'
      - 'internal/geminievent/**'
      - 'internal/cursorevent/**'
      - 'internal/hooks/**'
      - 'cmd/claude-notifications/**'
      - 'scripts/strict-terminal-native-linux.py'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-terminal:
    name: Actual X11 product daemon / physical notification click
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install actual GUI/audio test host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev dbus-daemon dbus-bin dunst xvfb openbox xterm xdotool tmux pulseaudio pulseaudio-utils alsa-utils libasound2-plugins libnotify-bin ffmpeg fonts-dejavu-core
      - name: Build installed-format product binary and strict Go native test executable
        run: |
          mkdir -p "$RUNNER_TEMP/TEST-strict-build"
          go mod download
          go build -trimpath -o "$RUNNER_TEMP/TEST-strict-build/claude-notifications" ./cmd/claude-notifications
          go test -c -o "$RUNNER_TEMP/TEST-strict-build/strict.test" ./internal/daemon
      - name: Actual X11 daemon banner and physical mouse clicks with negative cases
        run: |
          python3 -B scripts/strict-terminal-native-linux.py \
            --candidate "$RUNNER_TEMP/TEST-strict-build/claude-notifications" \
            --test-binary "$RUNNER_TEMP/TEST-strict-build/strict.test" \
            --report "$RUNNER_TEMP/strict-terminal-native-result.json"
          python3 -B - <<'PY'
          import json,os
          data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"strict-terminal-native-result.json")))
          assert data["status"] == "passed" and data["owned_children_collected"] is True
          assert [x["scenario"] for x in data["cases"]] == ["positive","revoke","policy_revoke","spoof"]
          assert all(x["status"]=="passed" for x in data["cases"])
          assert all(x["sender_exited_before_click"] for x in data["cases"])
          PY
      - name: Preserve exact native outcome (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strict-terminal-native-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/strict-terminal-native-result.json
          if-no-files-found: warn
          retention-days: 14
