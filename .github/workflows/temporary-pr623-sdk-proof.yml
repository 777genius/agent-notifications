name: Temporary PR623 SDK proof diagnosis
on:
  push:
    branches: [fix/group-known-targets-595-20261105]
    paths:
      - .github/workflows/temporary-pr623-sdk-proof.yml
permissions:
  contents: read
jobs:
  trace-user-group-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 777genius/universal-agent-plugins
          ref: f401557f9d1cb2a75efc376c1eba79ccda71937f
          path: _sdk
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve reproducible SDK commit module checksums
        shell: bash
        run: |
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl@v0.1.1-0.20261106093230-f401557f9d1c
          go mod download -json github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins@v0.0.0-20261106093230-f401557f9d1c
      - name: Trace exact SDK completion predicates without changing production dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_sdk/install/integrationctl/agentplugins/installer/group_user_prepared_completion.go")
          lines = p.read_text().splitlines(keepends=True)
          output = []
          for index, line in enumerate(lines, 1):
              indent = line[:len(line)-len(line.lstrip())]
              if line.strip() == "return false":
                  output.append(indent + 'fmt.Printf("SDK-PROOF-FAIL at line '+str(index)+'\\n")\n')
              if line.lstrip().startswith("return binding.ClientBindingID == frozen.BindingID"):
                  output.append(indent+'fmt.Printf("SDK-PROOF-BINDING saved=%+v frozen=%+v plan=%+v\\n", binding, frozen, plan)\n')
              if line.lstrip().startswith("return err == nil && plan.Scope"):
                  output.append(indent+'fmt.Printf("SDK-PROOF-TARGET err=%v frozen=%+v plan=%+v\\n", err, frozen, plan)\n')
              if line.lstrip().startswith("return hasPrepared &&"):
                  output.append(indent+'fmt.Printf("SDK-PROOF-COMPLETE prepared=%t remaining=%d\\n", hasPrepared, len(targets))\n')
              if line.lstrip().startswith("return completedProjectDeliveryIdentity(frozen, current)"):
                  output.append(indent+'fmt.Printf("SDK-PROOF-DELIVERY equality: client=%t scope=%t context=%t artifact=%t active=%t nativeRoot=%t profile=%t authority=%t selected=%t frozen=%+v current=%+v\\n", frozen.ClientID == current.ClientID, frozen.Scope == current.Scope, frozen.TargetContext == current.TargetContext, frozen.PhysicalArtifactID == current.PhysicalArtifactID, frozen.ActivePath == current.ActivePath, frozen.NativeRegistryRoot == current.NativeRegistryRoot, frozen.ProfileNamespace() == current.ProfileNamespace(), domain.SameProfileAuthority(frozen.ProfileAuthority(), current.ProfileAuthority()), reflect.DeepEqual(frozen.SelectedDelivery, current.SelectedDelivery), frozen, current)\n')
              output.append(line)
          p.write_text("".join(output))
          PY
          gofmt -w _sdk/install/integrationctl/agentplugins/installer/group_user_prepared_completion.go
          (cd _sdk/install/integrationctl/agentplugins && go test -count=1 -run '^TestUserGroupPreparedUpdate(RepeatedIdenticalFrozenDeliveries|ConflictingRepeatedFrozenDeliveryFailsClosed)$' ./installer)
          go mod edit -replace=github.com/777genius/plugin-kit-ai/install/integrationctl=./_sdk/install/integrationctl
          go mod edit -replace=github.com/777genius/plugin-kit-ai/install/integrationctl/agentplugins=./_sdk/install/integrationctl/agentplugins
          go test -mod=mod -count=1 -run '^TestGroupUpdateCodexLocalCompletesAndPreservesUnselectedClaude$' -v ./internal/agentnotify/portablesetup
