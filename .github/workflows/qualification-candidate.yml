name: TEST sealed eight business cells
on:
  workflow_dispatch:
    inputs:
      version_group: {type: choice, required: true, default: all, options: [all, v1, v2]}
      platform_group: {type: choice, required: true, default: all, options: [all, linux-arm64, darwin-arm64, darwin-amd64, windows-amd64]}
      product_head: {type: string, required: true}
      parent_run_id: {type: string, required: true}
      parent_artifact_id: {type: string, required: true}
      parent_sha256: {type: string, required: true}
      parent_manifest_sha256: {type: string, required: true}
      ci_inputs_sha256: {type: string, required: true}
      harness_sha256: {type: string, required: true}
      product_checker_sha256: {type: string, required: true}

# Only a newer run for the same PR supersedes its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
jobs:
  native:
    name: '${{ matrix.target.platform }}/${{ matrix.target.arch }} ${{ matrix.version }}'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.version_group == 'v1' && '["1.18.33"]' || inputs.version_group == 'v2' && '["2.0.21"]' || '["1.18.33","2.0.21"]') }}
        target: ${{ fromJSON(inputs.platform_group == 'linux-arm64' && '[{"runner":"ubuntu-22.04-arm","platform":"linux","arch":"arm64"}]' || inputs.platform_group == 'darwin-arm64' && '[{"runner":"macos-15","platform":"darwin","arch":"arm64"}]' || inputs.platform_group == 'darwin-amd64' && '[{"runner":"macos-15-intel","platform":"darwin","arch":"amd64"}]' || inputs.platform_group == 'windows-amd64' && '[{"runner":"windows-latest","platform":"windows","arch":"amd64"}]' || '[{"runner":"ubuntu-22.04-arm","platform":"linux","arch":"arm64"},{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"amd64"},{"runner":"windows-latest","platform":"windows","arch":"amd64"}]') }}
    defaults:
      run:
        working-directory: product
    env:
      TEST_PRODUCT_HEAD: ${{ inputs.product_head }}
      TEST_PARENT_SHA256: ${{ inputs.parent_sha256 }}
      TEST_PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
      TEST_CI_INPUTS_SHA256: ${{ inputs.ci_inputs_sha256 }}
      TEST_HARNESS_SHA256: ${{ inputs.harness_sha256 }}
      TEST_PRODUCT_CHECKER_SHA256: ${{ inputs.product_checker_sha256 }}
      AN_OS: ${{ matrix.target.platform }}
      AN_ARCH: ${{ matrix.target.arch }}
      AN_VERSION: ${{ matrix.version }}
    steps:
      - name: Preserve exact text bytes in both TEST checkouts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          path: product
          ref: ${{ inputs.product_head }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: {go-version: '1.27', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Initialize unqualified report before any fixture check
        shell: bash
        run: |
          mkdir -p .task-tools/artifacts
          python -c 'import json,pathlib; pathlib.Path(".task-tools/artifacts/native-report.json").write_text(json.dumps({"status":"unqualified","businessPhasesStarted":False,"firstFailedPrerequisite":"fixture_checks_not_completed"})+"\n")'
      - name: Inert fixture parser checks through pinned TEST supplier
        run: python -B ../transport/run-inert-checker.py
      - name: Linux build and private bus prerequisites
        if: matrix.target.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev dbus iproute2
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ inputs.parent_artifact_id }}
          run-id: ${{ inputs.parent_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded-parent
      - name: Stage sole sealed parent through exact unchanged parser
        id: parent
        shell: bash
        env:
          TEST_PARENT_DIRECTORY: ${{ github.workspace }}/downloaded-parent
        run: python -B ../transport/consume-parent.py
      - name: Verify exact source, clean build and bundle/SDK bytes before any host
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py
      - name: Preserve managed native and Windows path protocol checks
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/opencodeinstall -run 'Test.*(Native|Shortcut|Desktop)'
          if [ "$AN_OS" = windows ]; then
            test ! -e .task-tools/artifacts/windows-private-root-helper.exe
            test ! -e .task-tools/artifacts/windows-private-root-helper.json
            GOPROXY=off GOSUMDB=off GOVCS='*:off' GOWORK=off GOTOOLCHAIN=local go build -trimpath -mod=readonly -buildvcs=true -o .task-tools/artifacts/windows-private-root-helper.exe scripts/opencode-private-root-windows.go
            python -c 'import hashlib,json,os,pathlib,subprocess; root=pathlib.Path(".task-tools/artifacts"); source=pathlib.Path("scripts/opencode-private-root-windows.go"); binary=root/"windows-private-root-helper.exe"; head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest(); assert head==os.environ["TEST_PRODUCT_HEAD"] and h(source)=="d0995c320cb3b03a287a43915d2319a1b71f93b1d112c1f60ecc61cb276c15bd"; record={"schema":1,"candidateCommit":head,"sourceSHA256":h(source),"binarySHA256":h(binary)}; (root/"windows-private-root-helper.json").write_text(json.dumps(record,sort_keys=True)+"\n"); binary.chmod(0o444); (root/"windows-private-root-helper.json").chmod(0o444)'
          fi
      - name: Stage exact held native TEST supplier outside tracked source
        shell: bash
        run: python -B ../transport/stage-held.py
      - name: Guard and execute exact reviewed installed fixture
        shell: bash
        env:
          AN_MANIFEST: ${{ steps.parent.outputs.manifest }}
          AN_MANIFEST_SHA256: ${{ steps.parent.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$AN_OS" = windows ]; then export TEST_INSTALLER_DIAGNOSTIC_NODE="$(node -p 'process.execPath')"; fi
          export AN_SUITE=business
          if [ "$AN_OS/$AN_ARCH" = linux/amd64 ]; then export AN_SUITE=full; fi
          if [ "$AN_OS" = linux ]; then
            sudo --preserve-env=PATH,AN_MANIFEST,AN_MANIFEST_SHA256,AN_OS,AN_ARCH,AN_VERSION,AN_SUITE,TEST_HARNESS_SHA256,TEST_CI_INPUTS_SHA256,TEST_PRODUCT_HEAD unshare --net -- bash -c 'ip link set lo up; python -B ../transport/held-native-adapter.py --held-source .task-tools/artifacts/held-native-driver.py --held-sha256 560537dec0a5167bc0874ed408090f44c3a771472237c841506ebb57eadafd7e --held-permission-source .task-tools/artifacts/held-portable_permission.py --held-permission-sha256 f499590b9c8c3bfee37156633bf8a5a36024be208b9c26addfd70cbd000874cd --held-provider-source .task-tools/artifacts/held-provider.py --held-provider-sha256 57633468d4187d44b65abd245ad29d49a380619fe1e61049a1612272cad80e49 --held-portable-source .task-tools/artifacts/held-portable.py --held-portable-sha256 3315bfaade44fa1a328269e36954a7858c7b5631ecc41171ba0ccc9116634cac'
          else
            python -B ../transport/held-native-adapter.py --held-source .task-tools/artifacts/held-native-driver.py --held-sha256 560537dec0a5167bc0874ed408090f44c3a771472237c841506ebb57eadafd7e --held-permission-source .task-tools/artifacts/held-portable_permission.py --held-permission-sha256 f499590b9c8c3bfee37156633bf8a5a36024be208b9c26addfd70cbd000874cd --held-provider-source .task-tools/artifacts/held-provider.py --held-provider-sha256 57633468d4187d44b65abd245ad29d49a380619fe1e61049a1612272cad80e49 --held-portable-source .task-tools/artifacts/held-portable.py --held-portable-sha256 3315bfaade44fa1a328269e36954a7858c7b5631ecc41171ba0ccc9116634cac
          fi
      - name: Make only two SAFE public receipts readable for artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AN_OS" = linux ]; then sudo "$(command -v python)" -B ../transport/safe-upload.py; else python -B ../transport/safe-upload.py; fi
          python -c 'import pathlib; root=pathlib.Path(".task-tools/artifacts"); [p.read_bytes() for p in (root/"native-report.json",root/"held-driver-supplier.json") if p.exists()]'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencode-native-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.version }}
          path: |
            product/.task-tools/artifacts/native-report.json
            product/.task-tools/artifacts/held-driver-supplier.json
          if-no-files-found: error
          retention-days: 14
