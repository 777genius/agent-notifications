name: TEST portable business assets
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Actual clean final product commit after portable fixture owner commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  assets:
    name: TEST assets ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-latest, os: windows, arch: amd64}
    steps:
      - name: Read separately committed TEST builder
        uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Hold builder outside final source
        shell: bash
        run: cp scripts/testdata/opencode-portable-assets/build-native.py "$RUNNER_TEMP/portable-build-native.py"
      - name: Checkout exact final product only
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with: {go-version: '1.27.1', cache: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Native Linux CGO prerequisites
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build finite native assets, no installed tests
        shell: bash
        env:
          FINAL_SOURCE_HEAD: ${{ inputs.source_ref }}
          ASSET_OS: ${{ matrix.os }}
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/portable-build-native.py" --source "$GITHUB_WORKSPACE" --head "$FINAL_SOURCE_HEAD" --os "$ASSET_OS" --arch "$ASSET_ARCH" --out "$RUNNER_TEMP/TEST-portable-assets-$ASSET_OS-$ASSET_ARCH" --recipe-sha256 1fbbae173373571e9838c62a792e0f134c21c9ed9d727da82b0e73863b45c280
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TEST-portable-assets-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/TEST-portable-assets-${{ matrix.os }}-${{ matrix.arch }}/export
          if-no-files-found: error
          retention-days: 14
