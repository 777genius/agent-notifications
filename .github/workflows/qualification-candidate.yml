name: Windows observation diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Windows diagnostics Go ${{ matrix.go }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    env:
      AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Record runner and exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence -Force
          git rev-parse HEAD | Out-File evidence/source.txt
          go version | Out-File evidence/go.txt
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber | Out-File evidence/runner.txt
      - name: Verify diagnostics boundary
        shell: pwsh
        run: |
          go test -race -run '^(TestClaimFailureDiagnosticsRedactPrivatePath|TestUnavailableCacheAndLockBudgetAreNeutral)$' ./internal/notification/observation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build instrumented baseline and candidate
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'TEST-observation-baseline'
          git fetch --no-tags --depth=1 origin 2201a6aa843be2d134acb001c9088e1347cbc627
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $baseline 2201a6aa843be2d134acb001c9088e1347cbc627
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @('internal/notification/observation/cache.go', 'internal/notification/observation/cache_failure.go', 'internal/installruntime/private_cache_windows.go')
          foreach ($file in $files) { Copy-Item $file (Join-Path $baseline $file) }
          git -C $baseline diff | Out-File evidence/baseline-instrumentation.diff
          go test -race -cover -c -o evidence/current.test.exe ./internal/geminievent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Join-Path $PWD 'evidence/baseline.test.exe'
          Push-Location $baseline
          try {
            go test -race -cover -c -o $output ./internal/geminievent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Compare fresh test processes with strict assertions
        shell: pwsh
        run: |
          $target = '^Test(CacheWindowBoundAndBindingIsolation|ConcurrentConsumerClaimsEachChannelOnce|ChannelConsentIndependentAndNoRetry)$'
          $failed = $false
          foreach ($iteration in 1..30) {
            foreach ($revision in @('baseline', 'current')) {
              $binary = Join-Path $PWD "evidence/$revision.test.exe"
              $log = "evidence/$revision-$iteration.log"
              $trace = "evidence/$revision-$iteration.trace"
              if ($iteration -le 10) {
                & $binary -test.v -test.run $target "-test.trace=$trace" 2>&1 | Tee-Object $log
              } else {
                & $binary -test.v -test.run $target 2>&1 | Tee-Object $log
              }
              $code = $LASTEXITCODE
              "$revision iteration=$iteration exit=$code" | Add-Content evidence/status.txt
              if ($code -ne 0) { $failed = $true }
              if ((Test-Path $trace) -and ($code -ne 0 -or $iteration -eq 1)) {
                go tool trace -d=parsed $trace > "evidence/$revision-$iteration-events.txt"
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
          Remove-Item evidence/*.test.exe
          if ($failed) { exit 1 }
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-observation-go-${{ matrix.go }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
