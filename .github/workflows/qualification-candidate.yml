name: TEST sealed parent transport producer
on:
  workflow_dispatch:
    inputs:
      parent_url: {type: string, required: true, description: 'Temporary single-file TEST HTTP URL'}
      parent_sha256: {type: string, required: true, description: 'Independently sealed original tar SHA256'}
      parent_size: {type: string, required: true}
      product_head: {type: string, required: true}
      parent_manifest_sha256: {type: string, required: true}
permissions: {contents: read}
jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Fetch sole SHA-authenticated reviewed TEST archive
        env:
          TEST_PARENT_URL: ${{ inputs.parent_url }}
          TEST_PARENT_SHA256: ${{ inputs.parent_sha256 }}
          TEST_PARENT_SIZE: ${{ inputs.parent_size }}
          TEST_PRODUCT_HEAD: ${{ inputs.product_head }}
          TEST_PARENT_MANIFEST_SHA256: ${{ inputs.parent_manifest_sha256 }}
        run: python -B fetch-parent.py
      - uses: actions/upload-artifact@v7
        with:
          name: TEST-sealed-parent
          path: parent-evidence.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
