name: Qualification candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-wpr-helper:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9fb603544188b5ef8b61d3e4cfb26178b81696c2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Verify canonical helper around the original cache-window attempt
        shell: bash
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: |
          mkdir -p observation-evidence
          git rev-parse HEAD > observation-evidence/source.txt
          go version > observation-evidence/go.txt
          source scripts/windows-observation-profile.sh
          trap observation_profile_stop EXIT
          observation_profile_start geminievent
          status=0
          go test -race -cover -covermode=atomic -count=1 -run '^TestCacheWindowBoundAndBindingIsolation$' -trace=observation-evidence/geminievent.trace ./internal/geminievent || status=$?
          observation_profile_stop
          test -s observation-evidence/geminievent-os.etl
          exit "$status"
      - name: Verify the separate original consent-repetition instance
        shell: bash
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: |
          source scripts/windows-observation-profile.sh
          trap observation_profile_stop EXIT
          observation_profile_start geminievent-repeat
          status=0
          go test -race -count=20 -run '^TestChannelConsentIndependentAndNoRetry$' -trace=observation-evidence/geminievent-repeat.trace ./internal/geminievent || status=$?
          observation_profile_stop
          test -s observation-evidence/geminievent-repeat-os.etl
          exit "$status"
      - name: Decode native OS event statistics
        if: always()
        shell: pwsh
        run: |
          $xperf = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Windows Performance Toolkit/xperf.exe'
          foreach ($phase in @('geminievent','geminievent-repeat')) {
            if (Test-Path "observation-evidence/$phase-os.etl") {
              & $xperf -i "observation-evidence/$phase-os.etl" -o "observation-evidence/$phase-tracestats.txt" -a tracestats -detail stack
              if ($LASTEXITCODE -ne 0) { throw 'OS trace decoding failed' }
            }
          }
      - name: Log recorder provider coverage
        if: always()
        shell: pwsh
        run: |
          wpr.exe -profiledetails GeneralProfile+FileIO+Minifilter
          if ($LASTEXITCODE -ne 0) { throw 'Profile details unavailable' }
          wpr.exe -exportprofile GeneralProfile+FileIO+Minifilter observation-evidence/general-profile.wprp
          if ($LASTEXITCODE -ne 0) { throw 'Profile export unavailable' }
          Get-Content observation-evidence/general-profile.wprp
          foreach ($phase in @('geminievent','geminievent-repeat')) {
            if (Test-Path "observation-evidence/$phase-tracestats.txt") {
              Get-Content "observation-evidence/$phase-tracestats.txt"
            }
          }
      - name: Retain exact helper proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-canonical-wpr-helper
          path: observation-evidence/
          retention-days: 14
          if-no-files-found: error
