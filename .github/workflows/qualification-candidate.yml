name: Qualification candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 10806b8400640cda3039bcc91af3e6750b929d77
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify prepared private file lifecycle and ACL invalidation
        shell: bash
        run: |
          mkdir -p observation-evidence
          git rev-parse HEAD > observation-evidence/source.txt
          go version > observation-evidence/go.txt
          go test -race -v -run '^TestWindows(PreparedCacheWriteIsSingleUse|PrivateCacheRootRechecksACL|PrivateCacheRootPinsPathUntilClose|PrivateCacheCreationExcludesInheritedReaders)$' ./internal/installruntime
      - name: Qualify shared cache transaction and preparation contracts
        shell: bash
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: go test -p 1 -race -v -trace=observation-evidence/observation.trace ./internal/notification/observation
      - name: Qualify original Gemini package and record successful preparations
        shell: bash
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: go test -p 1 -race -v -cover -covermode=atomic -trace=observation-evidence/geminievent.trace ./internal/geminievent
      - name: Retain unchanged strict channel consent repetition
        shell: bash
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: go test -race -count=20 -run '^TestChannelConsentIndependentAndNoRetry$' -trace=observation-evidence/geminievent-repeat.trace ./internal/geminievent
      - name: Retain original outcomes and source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-preflight-go-${{ matrix.go }}
          path: observation-evidence/
          retention-days: 14
          if-no-files-found: error
