name: Packaged OpenCode bounded reader continuation
on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'five-undemonstrated plans two TEST mock transactions; Darwin V1 and Windows V2 API plans zero'
        required: true
        default: five-undemonstrated
        type: choice
        options: [five-undemonstrated, darwin-v1-api-diagnostics, windows-v2-api]
permissions:
  contents: read
jobs:
  reader:
    name: Reader ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan == 'windows-v2-api' && '[{"runner":"windows-latest","os":"windows","arch":"amd64","version":"2.0.21","mode":"api-only"}]' || inputs.plan == 'darwin-v1-api-diagnostics' && '[{"runner":"macos-15-intel","os":"darwin","arch":"amd64","version":"1.18.33","mode":"api-only"},{"runner":"macos-15","os":"darwin","arch":"arm64","version":"1.18.33","mode":"api-only"}]' || '[{"runner":"ubuntu-22.04-arm","os":"linux","arch":"arm64","version":"1.18.33","mode":"one-completion"},{"runner":"ubuntu-22.04-arm","os":"linux","arch":"arm64","version":"2.0.21","mode":"api-only"},{"runner":"macos-15-intel","os":"darwin","arch":"amd64","version":"2.0.21","mode":"api-only"},{"runner":"macos-15","os":"darwin","arch":"arm64","version":"2.0.21","mode":"api-only"},{"runner":"windows-latest","os":"windows","arch":"amd64","version":"1.18.33","mode":"one-completion"}]') }}
    env:
      CELL_OS: ${{ matrix.os }}
      CELL_ARCH: ${{ matrix.arch }}
      CELL_VERSION: ${{ matrix.version }}
      CELL_MODE: ${{ matrix.mode }}
    steps:
      - name: Fail closed on unknown observation plan
        shell: bash
        env:
          PLAN_NAME: ${{ inputs.plan }}
        run: |
          case "$PLAN_NAME" in
            five-undemonstrated|darwin-v1-api-diagnostics|windows-v2-api) ;;
            *) echo 'Unknown observation plan refused' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fresh Windows short TEST base
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $base = 'C:\PREADER'
          if (Test-Path -LiteralPath $base) { throw 'Preexisting TEST short base refused' }
          New-Item -ItemType Directory -Path $base | Out-Null
      - name: Stage sealed actual ROOT build and one official stock image
        shell: bash
        run: |
          set -euo pipefail
          F=scripts/testdata/opencode-reader-prequalification
          BASE="$RUNNER_TEMP"
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          python "$F/stage-local.py" --root "$BASE/TEST-reader-inputs" --os "$CELL_OS" --arch "$CELL_ARCH" --version "$CELL_VERSION"
      - name: One planned native observation, without retries
        shell: bash
        run: |
          set -euo pipefail
          F=scripts/testdata/opencode-reader-prequalification
          BASE="$RUNNER_TEMP"
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          I="$BASE/TEST-reader-inputs"
          python "$F/driver.py" --root "$BASE/TEST-reader-case" --archive "$I/$CELL_VERSION.tgz" --bundle "$I/reader.js" --bundle-sha256 e1972d06202ad3a6ca24febe53a63d1def3a02eea8f2f985fbc1876e03913122 --build-receipt "$I/build-receipt.json" --build-receipt-sha256 9041efb60a225440b06da3e2eeaceee269f984fcfa95e34c6d7a2ad138deedc6 --os "$CELL_OS" --arch "$CELL_ARCH" --version "$CELL_VERSION" --mode "$CELL_MODE"
      - name: Retain closed safe case result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP"
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          mkdir -p "$RUNNER_TEMP/TEST-reader-safe-export"
          if [ -f "$BASE/TEST-reader-case/result.json" ]; then cp "$BASE/TEST-reader-case/result.json" "$RUNNER_TEMP/TEST-reader-safe-export/result.json"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.version }}
          path: ${{ runner.temp }}/TEST-reader-safe-export/result.json
          if-no-files-found: error
          retention-days: 14
