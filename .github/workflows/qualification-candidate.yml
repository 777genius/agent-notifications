name: Windows observation diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Windows diagnostics Go ${{ matrix.go }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    env:
      AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Record runner and exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence -Force
          git rev-parse HEAD | Out-File evidence/source.txt
          go version | Out-File evidence/go.txt
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber | Out-File evidence/runner.txt
      - name: Verify diagnostics boundary
        shell: pwsh
        run: |
          go test -race -run '^(TestClaimFailureDiagnosticsRedactPrivatePath|TestUnavailableCacheAndLockBudgetAreNeutral)$' ./internal/notification/observation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve plain and traced strict failures
        shell: pwsh
        run: |
          $target = '^Test(CacheWindowBoundAndBindingIsolation|ConcurrentConsumerClaimsEachChannelOnce|ChannelConsentIndependentAndNoRetry)$'
          go test -v -race -count=200 -run $target '-coverprofile=evidence/plain-coverage.out' -covermode=atomic ./internal/geminievent 2>&1 | Tee-Object evidence/plain.log
          $plain = $LASTEXITCODE
          go test -v -race -count=200 -run $target '-trace=evidence/claim.trace' '-coverprofile=evidence/traced-coverage.out' -covermode=atomic ./internal/geminievent 2>&1 | Tee-Object evidence/traced.log
          $traced = $LASTEXITCODE
          "plain=$plain traced=$traced" | Out-File evidence/status.txt
          if (Test-Path evidence/claim.trace) {
            go tool trace -d=1 evidence/claim.trace > evidence/trace-events.txt
          }
          if ($plain -ne 0 -or $traced -ne 0) { exit 1 }
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-observation-go-${{ matrix.go }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
