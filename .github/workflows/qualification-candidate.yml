name: TEST Windows stock V1 local-entry reader continuation
on:
  workflow_dispatch:
    inputs:
      plan: {description: 'Two Windows floor V1 local entries, one TEST request each, no retry', required: true, default: windows-v1-local-entries, type: choice, options: [windows-v1-local-entries]}
permissions: {contents: read}
jobs:
  reader:
    name: Reader ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.version }} ${{ matrix.entry }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, os: windows, arch: amd64, version: 1.18.33, entry: run}
          - {runner: windows-latest, os: windows, arch: amd64, version: 1.18.33, entry: tui}
    env:
      CELL_OS: ${{ matrix.os }}
      CELL_ARCH: ${{ matrix.arch }}
      CELL_VERSION: ${{ matrix.version }}
      CELL_ENTRY: ${{ matrix.entry }}
    steps:
      - name: Refuse an unknown capture plan
        shell: bash
        env: {PLAN_NAME: '${{ inputs.plan }}'}
        run: test "$PLAN_NAME" = windows-v1-local-entries
      - name: Preserve exact TEST source text bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Fresh Windows short TEST base
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $base = 'C:\PREADER'
          if (Test-Path -LiteralPath $base) { throw 'Preexisting TEST short base refused' }
          New-Item -ItemType Directory -Path $base | Out-Null
      - name: Stage exact actual reader capsule and one fixed official image
        shell: bash
        run: |
          set -euo pipefail
          F=scripts/testdata/opencode-reader-prequalification
          BASE=$(python -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          python -B "$F/stage-local.py" --root "$BASE/TEST-reader-inputs" --os "$CELL_OS" --arch "$CELL_ARCH" --version "$CELL_VERSION" --entry "$CELL_ENTRY"
      - name: One planned genuine local entry observation, no retries
        shell: bash
        run: |
          set -euo pipefail
          F=scripts/testdata/opencode-reader-prequalification
          BASE=$(python -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          I="$BASE/TEST-reader-inputs"
          python -B "$F/driver.py" --root "$BASE/TEST-reader-case" --archive "$I/$CELL_VERSION.tgz" --bundle "$I/reader.js" --bundle-sha256 d48042526d8b657ad48c461c8abae4ea9254a9e3b1390085e0dd20ccdb7eab9a --build-receipt "$I/build-receipt.json" --build-receipt-sha256 a1e49f8f8393fef92099013e8088d30c5bee178c3bd9823341e85c619380dd9d --os "$CELL_OS" --arch "$CELL_ARCH" --version "$CELL_VERSION" --entry "$CELL_ENTRY" --mode one-completion
      - name: Export only bounded safe case result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(python -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')
          if [ "$CELL_OS" = windows ]; then BASE='C:\PREADER'; fi
          python -c 'import pathlib,stat,sys; p=pathlib.Path(sys.argv[1])/"TEST-reader-case/result.json"; out=pathlib.Path(sys.argv[2])/"TEST-reader-safe-export"; out.mkdir(exist_ok=False); exists=p.exists(); assert not exists or (stat.S_ISREG(p.lstat().st_mode) and not p.is_symlink() and p.stat().st_size<=1048576); (out/"result.json").write_bytes(p.read_bytes()) if exists else None' "$BASE" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.version }}-${{ matrix.entry }}
          path: ${{ runner.temp }}/TEST-reader-safe-export/result.json
          if-no-files-found: error
          retention-days: 14
