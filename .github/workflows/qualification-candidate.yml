name: Qualification candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-os-attribution:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Reproduce the ordinary Windows CI preparation before profiling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence | Out-Null
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'dependency download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'dependency verification failed' }
          go build '-o' bin/claude-notifications.exe './cmd/claude-notifications'
          if ($LASTEXITCODE -ne 0) { throw 'qualification binary build failed' }
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          python scripts/release-artifact-e2e.py --binary bin/claude-notifications.exe --version "v$version" *> evidence/binary-qualification.log
          if ($LASTEXITCODE -ne 0) { throw 'binary qualification failed' }
          go vet './...' *> evidence/vet.log
          if ($LASTEXITCODE -ne 0) { throw 'vet failed' }
          go test '-run=^$' '-bench=^BenchmarkWindowsPrivateLock$' '-benchtime=100x' '-count=5' '-benchmem' './internal/installruntime' *> evidence/lock-baseline.log
          if ($LASTEXITCODE -ne 0) { throw 'lock benchmark failed' }
          go test '-run=^$' '-bench=^BenchmarkWindowsPrivateLock$' '-benchtime=100x' '-count=5' '-benchmem' './internal/installruntime' *> evidence/lock-current.log
          if ($LASTEXITCODE -ne 0) { throw 'lock benchmark failed' }
          go test '-run=^$' '-bench=^BenchmarkWindowsPrivateCacheRoot$' '-benchtime=100x' '-count=3' '-benchmem' './internal/installruntime' *> evidence/root-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'root benchmark failed' }
      - name: Build original strict consumer test with native OS profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD > evidence/source.txt
          go version > evidence/go.txt
          go test '-c' '-race' '-cover' '-covermode=atomic' '-o' evidence/original.test.exe './internal/geminievent'
          if ($LASTEXITCODE -ne 0) { throw 'test build failed' }
          wpr -profiles *> evidence/wpr-profiles.txt
          fltmc filters *> evidence/filter-inventory.txt
          fltmc instances *> evidence/filter-instances.txt
          Get-MpComputerStatus | Select-Object AMRunningMode,AntivirusEnabled,RealTimeProtectionEnabled,BehaviorMonitorEnabled,IoavProtectionEnabled | ConvertTo-Json > evidence/defender-state.json
      - name: Retain OS evidence at the first original strict failure
        shell: pwsh
        env:
          AGENT_NOTIFICATIONS_OBSERVATION_DIAGNOSTICS: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          $evidence = Join-Path $PWD 'evidence'
          $failed = $false
          $started = $false
          'round,pid,start_utc,end_utc,exit' | Set-Content evidence/status.csv
          wpr -start GeneralProfile *> evidence/wpr-start.log
          $started = $LASTEXITCODE -eq 0
          try {
            go test '-p=1' '-v' '-race' '-coverprofile=evidence/coverage.txt' '-covermode=atomic' '-trace=evidence/full-qualification.trace' './internal/geminievent' *> evidence/full-qualification.log
            $qualificationCode = $LASTEXITCODE
            "full,0,,,${qualificationCode}" | Add-Content evidence/status.csv
            if ($qualificationCode -ne 0) { $failed = $true }
            for ($round = 1; $round -le 40; $round++) {
              if ($failed) { break }
              $start = [DateTime]::UtcNow.ToString('O')
              $args = @('-test.v','-test.run=^Test(CacheWindowBoundAndBindingIsolation|ChannelConsentIndependentAndNoRetry)$','-test.count=20','-test.timeout=60s',"-test.trace=$evidence/original-$round.trace")
              $process = Start-Process -FilePath "$evidence/original.test.exe" -ArgumentList $args -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$evidence/original-$round.stdout.log" -RedirectStandardError "$evidence/original-$round.stderr.log"
              $testPid = $process.Id
              $process.WaitForExit()
              $code = $process.ExitCode
              $end = [DateTime]::UtcNow.ToString('O')
              "$round,$testPid,$start,$end,$code" | Add-Content evidence/status.csv
              Write-Host "round=$round pid=$testPid exit=$code"
              if ($code -ne 0) { $failed = $true; break }
            }
          } finally {
            if ($started) { wpr -stop "$evidence/original-os.etl" 'Original strict observation failure attribution' -skipPdbGen -compress *> evidence/wpr-stop.log }
          }
          $xperf = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Windows Performance Toolkit/xperf.exe'
          if (Test-Path $xperf) {
            & $xperf -help processing *> evidence/xperf-actions.txt
            if (Test-Path evidence/original-os.etl) {
              & $xperf -i evidence/original-os.etl -o evidence/diskio.txt -a diskio -summary *> evidence/xperf-diskio.log
              & $xperf -i evidence/original-os.etl -o evidence/cswitch.txt -a cswitch -summary *> evidence/xperf-cswitch.log
            }
          }
          if ($failed) { throw 'Original strict failure retained; inspect original process logs and matching OS/Go trace.' }
          exit 0
      - name: Retain bounded original OS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-original-os-attribution
          path: evidence/
          retention-days: 14
          if-no-files-found: error
