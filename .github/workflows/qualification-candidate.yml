name: TEST installed12 local entry, HOST4 plus GHA8
on:
  workflow_dispatch:
    inputs:
      product_head: {type: string, required: true}
      parent_run_id: {type: string, required: true}
      parent_artifact_id: {type: string, required: true}
      parent_sha256: {type: string, required: true}
      parent_manifest_sha256: {type: string, required: true}
      ci_inputs_sha256: {type: string, required: true}
      harness_sha256: {type: string, required: true}
      supplement_artifact_id: {type: string, required: true}
      supplement_sha256: {type: string, required: true}
      cell_group: {type: choice, required: false, default: all, options: [all, linux]}
permissions: {contents: read, actions: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.cells.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - id: cells
        shell: bash
        env: {TEST_CELL_GROUP: '${{ inputs.cell_group }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('scripts/testdata/opencode-installed12/installed12-plan.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='43e800a04df0dac060c3e969dd8f461ee93c36b08be64654b65b68ecd5175f26'
          d=json.loads(p.read_bytes());rows=[r for r in d['cells'] if r['route']=='GHA']
          assert len(d['cells'])==12 and len(rows)==8 and all(r['version']=='1.18.33' and r['entry'] in ('run','tui') and (r['os'],r['arch'])!=('linux','amd64') for r in rows)
          group=os.environ['TEST_CELL_GROUP'];assert group in ('all','linux')
          if group=='linux':rows=[r for r in rows if r['os']=='linux']
          assert len(rows)==(2 if group=='linux' else 8)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY
  native:
    needs: plan
    name: '${{ matrix.id }}'
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 20
    strategy: {fail-fast: false, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}'}
    defaults:
      run: {working-directory: TEST-product, shell: bash}
    env:
      TEST_PRODUCT_HEAD: '${{ inputs.product_head }}'
      TEST_PARENT_SHA256: '${{ inputs.parent_sha256 }}'
      TEST_PARENT_MANIFEST_SHA256: '${{ inputs.parent_manifest_sha256 }}'
      TEST_CI_INPUTS_SHA256: '${{ inputs.ci_inputs_sha256 }}'
      TEST_HARNESS_SHA256: '${{ inputs.harness_sha256 }}'
      AN_OS: '${{ matrix.os }}'
      AN_ARCH: '${{ matrix.arch }}'
      AN_VERSION: '${{ matrix.version }}'
      AN_ENTRY: '${{ matrix.entry }}'
    steps:
      - name: Preserve exact source bytes
        working-directory: '${{ github.workspace }}'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with: {path: transport, ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/checkout@v7
        with: {path: TEST-product, ref: '${{ inputs.product_head }}', persist-credentials: false}
      - uses: actions/setup-go@v7
        with: {go-version: '1.27', cache: false}
      - uses: actions/setup-node@v6
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Linux private bus prerequisites, before native phase
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dbus iproute2
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '${{ inputs.parent_artifact_id }}'
          run-id: '${{ inputs.parent_run_id }}'
          repository: '${{ github.repository }}'
          github-token: '${{ github.token }}'
          path: downloaded-parent
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '${{ inputs.supplement_artifact_id }}'
          run-id: '${{ inputs.parent_run_id }}'
          repository: '${{ github.repository }}'
          github-token: '${{ github.token }}'
          path: downloaded-supplement
      - name: Authenticated final parent and narrow exact SDK alias
        id: parent
        env: {TEST_PARENT_DIRECTORY: '${{ github.workspace }}/downloaded-parent'}
        run: python -B ../transport/scripts/testdata/opencode-installed12/consume-parent.py
      - name: Stage reviewed finite supplement and check all twelve source gates
        id: supplement
        env: {SUPPLEMENT_SHA256: '${{ inputs.supplement_sha256 }}'}
        run: |
          python -B ../transport/scripts/testdata/opencode-installed12/stage-installed12.py \
            --directory ../downloaded-supplement --sha256 "$SUPPLEMENT_SHA256" \
            --manifest "${{ steps.parent.outputs.manifest }}" --manifest-sha256 "${{ steps.parent.outputs.sha256 }}" \
            --os "$AN_OS" --arch "$AN_ARCH" --version "$AN_VERSION" --entry "$AN_ENTRY"
      - name: Final public source/build preflight and actual Linux receiver build
        env: {AN_MANIFEST: '${{ steps.parent.outputs.manifest }}', AN_MANIFEST_SHA256: '${{ steps.parent.outputs.sha256 }}'}
        run: python -B scripts/testdata/opencode-native-e2e/ci_inputs.py
      - name: One planned genuine installed completion, no retries
        env:
          FINAL_MANIFEST: '${{ steps.parent.outputs.manifest }}'
          FINAL_MANIFEST_SHA256: '${{ steps.parent.outputs.sha256 }}'
          THIN_DRIVER: '${{ steps.supplement.outputs.driver }}'
          CELL_GATE: '${{ steps.supplement.outputs.gate }}'
          CELL_GATE_SHA256: '${{ steps.supplement.outputs.gate_sha256 }}'
        run: |
          set -euo pipefail
          REPO=$(python -c 'import pathlib; print(pathlib.Path.cwd().resolve())')
          PYTHON=$(python -c 'import sys; print(sys.executable)')
          args=("$PYTHON" -B "$THIN_DRIVER" --repo "$REPO" --manifest "$REPO/$FINAL_MANIFEST" --manifest-sha256 "$FINAL_MANIFEST_SHA256" --final-gate "$CELL_GATE" --final-gate-sha256 "$CELL_GATE_SHA256" --artifacts "$REPO/.task-tools/artifacts/installed12-cases" --os "$AN_OS" --arch "$AN_ARCH" --version "$AN_VERSION" --entry "$AN_ENTRY")
          if [ "$AN_OS" = linux ]; then
            args+=(--receiver-record "$REPO/.task-tools/artifacts/receiver-record.json")
            # Retain the runner file owner for private-env Git source guards.
            sudo --preserve-env=PATH unshare --net -- bash -c 'ip link set lo up; uid=$1; shift; exec sudo -u "#$uid" --preserve-env=PATH -- "$@"' bash "$(id -u)" "${args[@]}"
          else
            "${args[@]}"
          fi
      - name: Export only closed SAFE scalar/digest result, never private traces
        if: always()
        run: |
          python -B ../transport/scripts/testdata/opencode-installed12/safe-export.py \
            --cases .task-tools/artifacts/installed12-cases \
            --output .task-tools/artifacts/installed12-safe/result.json \
            --os "$AN_OS" --arch "$AN_ARCH" --version "$AN_VERSION" --entry "$AN_ENTRY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 'installed12-${{ matrix.id }}'
          path: TEST-product/.task-tools/artifacts/installed12-safe/result.json
          if-no-files-found: error
          retention-days: 14
