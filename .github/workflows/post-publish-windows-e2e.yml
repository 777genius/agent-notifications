name: Post-publish Windows E2E
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact partial prerelease tag
        required: true
        default: v1.47.0
      source_sha:
        description: Exact product source SHA
        required: true
        default: 192196fbf35710f9f138a5b2728919b3e215f25b
      phase:
        description: Asset visibility
        type: choice
        options: [draft, public]
        default: draft
      expected_stable:
        description: Latest stable must remain this tag
        default: v1.46.1
        required: true
permissions:
  contents: read
jobs:
  package-e2e:
    name: Prerelease ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-latest, os: windows, arch: amd64}
    steps:
      - name: Validate exact source input
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: SOURCE
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: SCRIPT
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and qualify exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: ${{ inputs.tag }}
          TEST_PHASE: ${{ inputs.phase }}
          TEST_STABLE: ${{ inputs.expected_stable }}
          TEST_SOURCE_SHA: ${{ inputs.source_sha }}
          TEST_OS: ${{ matrix.os }}
          TEST_ARCH: ${{ matrix.arch }}
        run: python SCRIPT/scripts/prerelease-package-e2e.py --source SOURCE --report evidence/package-e2e.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prerelease-package-${{ inputs.phase }}-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
