name: Windows CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Display Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Set up Python for binary qualification
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Qualify Windows configuration and delivery
        shell: pwsh
        run: |
          go build -o bin/claude-notifications.exe ./cmd/claude-notifications
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content .claude-plugin/plugin.json | ConvertFrom-Json).version
          python scripts/release-artifact-e2e.py --binary bin/claude-notifications.exe --version "v$version"

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          $fmt_output = go fmt ./...
          if ($fmt_output) {
            Write-Host "The following files need formatting:"
            Write-Host $fmt_output
            exit 1
          }
        shell: pwsh

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        shell: bash

      - name: Repeat config crash recovery
        run: go test -race -count=10 -run '^TestStoreKilledLockOwner$' ./internal/config
        shell: bash

      - name: Build binary
        run: go build -o bin/claude-notifications.exe ./cmd/claude-notifications

      - name: Test binary execution (help)
        run: ./bin/claude-notifications.exe help
        shell: bash

      - name: Build sound preview binary
        run: go build -o bin/sound-preview.exe ./cmd/sound-preview

      - name: Build list-sounds binary
        run: go build -o bin/list-sounds.exe ./cmd/list-sounds

      - name: Run install.sh unit tests
        run: bash bin/install_test.sh
        shell: bash

      - name: Run install.sh E2E tests (offline + mock)
        run: bash bin/install_e2e_test.sh
        shell: bash
