name: OpenCode actual platform clock module prequalification

on:
  pull_request:
    paths:
      - 'scripts/opencode-platform-clock-prequalification.*'
      - 'scripts/testdata/opencode-platform-clock-prequalification/**'
      - '.github/workflows/opencode-platform-clock-prequalification.yml'
      - 'opencode-plugin/*clock*.mjs'
      - 'opencode-plugin/protocol.mjs'
      - 'internal/opencodeevent/*clock*.go'
      - 'internal/agentnotify/journal/clock*.go'
      - 'cmd/claude-notifications/*clock*.go'
      - 'cmd/claude-notifications/main.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      v2_helper_admission_canary:
        description: TEST only, stock V2 Windows amd64 and Darwin amd64 fixture canary, all grants false
        type: boolean
        required: false
        default: false
      current_primary_json:
        description: Separately reviewed immutable current 1.18.34 Linux x64 archive SHA256 and SRI primary (see fixture README)
        type: string
        required: false

permissions:
  contents: read

jobs:
  module-clock:
    name: Actual module ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.v2_helper_admission_canary && '{"include":[{"runner":"macos-15-intel","platform":"darwin","arch":"amd64"},{"runner":"windows-latest","platform":"windows","arch":"amd64"}]}' || '{"include":[{"runner":"ubuntu-22.04","platform":"linux","arch":"amd64"},{"runner":"ubuntu-22.04-arm","platform":"linux","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"amd64"},{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"windows-latest","platform":"windows","arch":"amd64"}]}') }}
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up existing pinned native compiler
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up existing Python baseline
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Linux compiler prerequisite
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Create native Windows short staging base
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $base = 'C:\PCLOCK'
          if (Test-Path -LiteralPath $base) {
            throw 'Preexisting short staging base refused'
          }
          New-Item -ItemType Directory -Path $base | Out-Null
      - name: Observe each planned stock image once using actual source module
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CLOCK_PLATFORM: ${{ matrix.platform }}
          CLOCK_ARCH: ${{ matrix.arch }}
          V2_HELPER_ADMISSION_CANARY: ${{ inputs.v2_helper_admission_canary || false }}
          PLATFORM_CLOCK_CURRENT_PRIMARY_JSON: ${{ inputs.current_primary_json || vars.OPENCODE_PLATFORM_CLOCK_CURRENT_PRIMARY_JSON }}
        run: |
          set -euo pipefail
          temp_base="$RUNNER_TEMP"
          if [[ "$CLOCK_PLATFORM" == windows ]]; then
            temp_base='C:\PCLOCK'
          fi
          launcher=("$(command -v python)" scripts/opencode-platform-clock-prequalification.py
            --execute-ci --os "$CLOCK_PLATFORM" --arch "$CLOCK_ARCH"
            --temp-base "$temp_base" --report "$RUNNER_TEMP/platform-clock-safe-evidence.json")
          if [[ "$V2_HELPER_ADMISSION_CANARY" == true ]]; then
            launcher+=(--v2-helper-admission-canary)
          fi
          if [[ "$CLOCK_PLATFORM" == linux && "$CLOCK_ARCH" == amd64 && -z "$PLATFORM_CLOCK_CURRENT_PRIMARY_JSON" ]]; then
            launcher+=(--current-primary scripts/testdata/opencode-platform-clock-prequalification/current-linux-amd64-primary.json)
          fi
          [[ ${#launcher[@]} -gt 0 && -n "${launcher[0]}" ]]
          "${launcher[@]}"
      - name: Upload only closed public-safe observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-clock-module-${{ matrix.platform }}-${{ matrix.arch }}${{ inputs.v2_helper_admission_canary && '-helper-admission-canary' || '' }}
          path: ${{ runner.temp }}/platform-clock-safe-evidence.json
          if-no-files-found: error
          retention-days: 14
