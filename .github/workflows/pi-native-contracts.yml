name: Pi actual native process contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: Pi 1.4 native events / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04') || matrix.platform == 'darwin' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15') || 'windows-2025' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: amd64}
          - {platform: darwin, arch: arm64}
          - {platform: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Resolve the interpreter actually used on this image
        id: native_python
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          executable = Path(sys.executable).resolve(strict=True)
          if not executable.is_file() or not os.access(executable, os.X_OK):
              raise SystemExit('Actual Python executable unavailable')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + str(executable) + '\n')
          PY
      - name: Pin and native oracle guards
        run: |
          python -B scripts/test_acquire_pi_native.py -v
          python -B scripts/test_pi_native_fixture.py -v
      - name: Acquire exact official standalone
        shell: python
        env:
          PI_PLATFORM: ${{ matrix.platform }}
          PI_ARCH: ${{ matrix.arch }}
          PYTHON_EXECUTABLE: ${{ steps.native_python.outputs.path }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          python = os.environ.get('PYTHON_EXECUTABLE', '')
          if not python or not Path(python).is_file():
              raise SystemExit('Setup Python physical executable unavailable')
          temp = Path(os.environ['RUNNER_TEMP'])
          root = temp / 'TEST-pi-native-contracts'
          report = temp / 'pi-native-contracts/acquisition.json'
          result = subprocess.run([
              python, '-B', 'scripts/acquire-pi-native.py',
              '--download',
              '--platform', os.environ['PI_PLATFORM'],
              '--arch', os.environ['PI_ARCH'],
              '--output', str(root),
              '--report', str(report),
          ])
          if result.returncode:
              raise SystemExit(result.returncode if result.returncode > 0 else 128 - result.returncode)
          if not report.is_file():
              raise SystemExit('Pi acquisition receipt missing')
      - name: Real Pi loader provider and lifecycle events
        shell: python
        env:
          PYTHON_EXECUTABLE: ${{ steps.native_python.outputs.path }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          evidence = Path(os.environ['RUNNER_TEMP']) / 'pi-native-contracts'
          pin = json.loads((evidence / 'acquisition.json').read_text(encoding='utf-8'))
          report = evidence / 'events.json'
          result = subprocess.run([
              os.environ['PYTHON_EXECUTABLE'], '-B', 'scripts/pi-native-contracts.py',
              '--pi-executable', pin['executable'],
              '--report', str(report),
          ])
          if result.returncode:
              raise SystemExit(result.returncode if result.returncode > 0 else 128 - result.returncode)
          if not report.is_file():
              raise SystemExit('Pi event receipt missing')
      - name: Build narrow native Windows ConPTY fixture
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Native Visual Studio compiler unavailable' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\pi_native_pty_windows.cpp'
          $binary = Join-Path $env:RUNNER_TEMP 'TEST-pi-conpty.exe'
          $object = Join-Path $env:RUNNER_TEMP 'TEST-pi-conpty.obj'
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE "' + $source + '" /Fe:"' + $binary + '" /Fo:"' + $object + '"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Native ConPTY fixture compile failed' }
      - name: Actual TUI prompt and reply on native PTY or ConPTY
        shell: python
        env:
          PYTHON_EXECUTABLE: ${{ steps.native_python.outputs.path }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          temp = Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'pi-native-contracts'
          pin = json.loads((evidence / 'acquisition.json').read_text(encoding='utf-8'))
          report = evidence / 'tui.json'
          args = ['--pi-executable', pin['executable'], '--report', str(report)]
          if os.name == 'nt':
              args += ['--pty-bridge', str(temp / 'TEST-pi-conpty.exe')]
          result = subprocess.run([
              os.environ['PYTHON_EXECUTABLE'], '-B', 'scripts/pi-native-tui.py', *args,
          ])
          if result.returncode:
              raise SystemExit(result.returncode if result.returncode > 0 else 128 - result.returncode)
          if not report.is_file():
              raise SystemExit('Pi TUI receipt missing')
      - name: Preserve bounded contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-native-contracts-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pi-native-contracts/*.json
          if-no-files-found: error
          retention-days: 14
