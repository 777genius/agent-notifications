name: Pi actual native process contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Pi 1.4 native events / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04') || matrix.platform == 'darwin' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || vars.CI_MACOS_15_RUNNER || 'macos-15') || 'windows-2025' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: amd64}
          - {platform: darwin, arch: arm64}
          - {platform: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pin and native oracle guards
        run: |
          python -B scripts/test_acquire_pi_native.py -v
          python -B scripts/test_pi_native_fixture.py -v
      - name: Acquire exact official standalone
        shell: pwsh
        env:
          PI_PLATFORM: ${{ matrix.platform }}
          PI_ARCH: ${{ matrix.arch }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'TEST-pi-native-contracts'
          $report = Join-Path $env:RUNNER_TEMP 'pi-native-contracts/acquisition.json'
          python -B scripts/acquire-pi-native.py --download --platform $env:PI_PLATFORM --arch $env:PI_ARCH --output $root --report $report
          exit $LASTEXITCODE
      - name: Real Pi loader provider and lifecycle events
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'pi-native-contracts'
          $pin = Get-Content -LiteralPath (Join-Path $evidence 'acquisition.json') -Raw | ConvertFrom-Json
          python -B scripts/pi-native-contracts.py --pi-executable $pin.executable --report (Join-Path $evidence 'events.json')
          exit $LASTEXITCODE
      - name: Build narrow native Windows ConPTY fixture
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (!$vs) { throw 'Native Visual Studio compiler unavailable' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\integration\pi_native_pty_windows.cpp'
          $binary = Join-Path $env:RUNNER_TEMP 'TEST-pi-conpty.exe'
          $object = Join-Path $env:RUNNER_TEMP 'TEST-pi-conpty.obj'
          $cmd = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul && cl /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE "' + $source + '" /Fe:"' + $binary + '" /Fo:"' + $object + '"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Native ConPTY fixture compile failed' }
      - name: Actual TUI prompt and reply on native PTY or ConPTY
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'pi-native-contracts'
          $pin = Get-Content -LiteralPath (Join-Path $evidence 'acquisition.json') -Raw | ConvertFrom-Json
          $tuiArgs = @('--pi-executable', $pin.executable, '--report', (Join-Path $evidence 'tui.json'))
          if ($IsWindows) { $tuiArgs += @('--pty-bridge', (Join-Path $env:RUNNER_TEMP 'TEST-pi-conpty.exe')) }
          python -B scripts/pi-native-tui.py @tuiArgs
          exit $LASTEXITCODE
      - name: Preserve bounded contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi-native-contracts-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pi-native-contracts/*.json
          if-no-files-found: error
          retention-days: 14
